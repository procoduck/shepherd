services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shepherd_e2e
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: shepherd
    healthcheck:
      # -h 127.0.0.1 forces the check over TCP, and that is the whole point.
      # Without it pg_isready uses the UNIX SOCKET, and on a first-time volume
      # the postgres entrypoint runs a TEMPORARY server that listens on the
      # socket only (listen_addresses='') to execute the init scripts. That
      # temp server logs "database system is ready to accept connections", so a
      # socket-based check goes green ~550ms before any TCP listener exists —
      # compose then starts the dependents, and they get "connection refused"
      # or "FATAL: the database system is shutting down" as the temp server is
      # torn down and the real one starts.
      #
      # This is what made test-fullstack flake: it runs `down -v` first, so it
      # always initialises a fresh volume and always opens the window. Local
      # `make dev` reuses the volume, skips initdb, and never sees it.
      # internal/testutil/postgres.go already avoided the same trap the other
      # way round, by waiting for the "ready" log to appear TWICE.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shepherd -d shepherd_e2e"]
      interval: 2s
      timeout: 5s
      retries: 20

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.1
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": []
        }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/.well-known/openid-configuration || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20

  mockmsft:
    build:
      context: ./mockmsft
      dockerfile: Dockerfile
    image: shepherd-mockmsft:e2e
    environment:
      LISTEN: ":9090"
    ports:
      - "19090:9090"
    healthcheck:
      test: ["CMD", "/mockmsft", "-health-check"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Real git server backing scenario 5 (F9, docs/git-provider-design.md §4) — replaces the
  # hand-written ADO REST mock that used to live entirely in mockmsft. The suite talks to it
  # directly over the host-published ports to seed repos and push real commits; shepherd talks
  # to it over the compose network as http://gitea:3000 / ssh://git@gitea:2222.
  gitea:
    image: gitea/gitea:1-rootless
    environment:
      INSTALL_LOCK: "true"
      HTTP_PORT: "3000"
      # Rootless image can't bind privileged port 22; matches internal/gitrepo's own Gitea
      # testcontainer setup (internal/gitrepo/gitrepo_suite_test.go) so the ssh auth-kind
      # behavior tested there and here stays consistent.
      DISABLE_SSH: "false"
      SSH_LISTEN_PORT: "2222"
      SSH_PORT: "2222"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
    ports:
      - "13080:3000"
      - "12222:2222"
    volumes:
      - gitea_e2e_data:/var/lib/gitea
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot admin bootstrap, sharing gitea's data volume so it operates on the same sqlite
  # DB the running gitea service just initialized. The e2e stack is always started fresh
  # (make e2e tears the volume down at the end), so — unlike the dev compose's gitea-init —
  # no idempotency guard is needed here; a non-zero exit on a genuine failure should fail
  # the run.
  gitea-init:
    image: gitea/gitea:1-rootless
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      INSTALL_LOCK: "true"
      HTTP_PORT: "3000"
      DISABLE_SSH: "false"
      SSH_LISTEN_PORT: "2222"
      SSH_PORT: "2222"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
    volumes:
      - gitea_e2e_data:/var/lib/gitea
    command:
      - gitea
      - admin
      - user
      - create
      - --username
      - shepherd-admin
      - --password
      - Sh3pherd-Admin-Pass-1
      - --email
      - admin@shepherd.test
      - --admin
      - --must-change-password=false
    restart: "no"

  shepherd-init:
    image: shepherd:local-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHEPHERD_DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd_e2e?sslmode=disable
      # Seeded explicitly so the suite is not blocked by the forced password
      # change, which applies only to a defaulted admin/admin.
      SHEPHERD_BOOTSTRAP_ADMIN_LOGIN: "admin"
      SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      SHEPHERD_SECURITY_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      SHEPHERD_DEV_ALLOW_STATIC_TOKEN: "true"
    command:
      - migrate
      - up
    restart: "no"

  shepherd-token:
    image: shepherd:local-init
    depends_on:
      shepherd-init:
        condition: service_completed_successfully
    environment:
      SHEPHERD_DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd_e2e?sslmode=disable
      SHEPHERD_SECURITY_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      SHEPHERD_DEV_ALLOW_STATIC_TOKEN: "true"
    command:
      - token
      - create
      - --name
      - e2e
      - --id
      - "00000000-e2e0-4000-a000-000000000001"
      - --secret
      - e2e-static-secret-32byteslong1234
    restart: "no"

  shepherd:
    image: shepherd:local
    depends_on:
      shepherd-token:
        condition: service_completed_successfully
      # Not because shepherd itself needs Gitea up (gitsync only matters once
      # a test creates a repo link) — `docker compose up --wait` only treats
      # a one-shot container's exit as a legitimate terminal state when some
      # other service names it via service_completed_successfully; without
      # that, gitea-init's normal `Exited (0)` fails the wait, per the
      # documented behavior of --wait for run-to-completion containers.
      gitea-init:
        condition: service_completed_successfully
    command: ["serve"]
    ports:
      # Host ports live in a dedicated range so this stack can run alongside the
      # dev stack (dev/docker-compose.dev.yaml), which owns the low-numbered ones.
      # Bound to 127.0.0.1 only, not the default 0.0.0.0: shepherd's container-side
      # listener is now a pinned IPv4 literal (B-CONTAIN-1's SHEPHERD_SERVER_LISTEN),
      # not the dual-stack bare ":port" it used to be, so Docker/OrbStack's
      # automatic [::]-published half has no IPv6 listener to forward to — a bare
      # `localhost` on a dual-stack host resolves ::1 first and gets a post-connect
      # RST instead of falling back to IPv4. Publishing IPv4-only removes the
      # broken half outright instead of relying on client-side fallback.
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18090:9090" # shepherd metrics listener (V4-4)
    environment:
      SHEPHERD_DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd_e2e?sslmode=disable
      # B-CONTAIN-1: bind to the default-network address only. sim-internal
      # is internal:true (no gateway) so this address is unroutable from
      # there regardless, but binding explicitly closes it even if a future
      # engine's internal:true implementation is looser than Docker's own
      # (see B-CONTAIN-2 — the OrbStack gateway-reachability gap this repo
      # already hit once). Must equal networks.default.ipv4_address below.
      SHEPHERD_SERVER_LISTEN: "172.28.0.10:8080"
      SHEPHERD_SERVER_METRICS_LISTEN: "172.28.0.10:9090"
      SHEPHERD_SECURITY_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      SHEPHERD_OIDC_ISSUER: http://oidc:8090/default
      SHEPHERD_OIDC_CLIENT_ID: shepherd-e2e
      SHEPHERD_OIDC_CLIENT_SECRET: e2e-secret
      SHEPHERD_OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
      SHEPHERD_GRAPH_BASE_URL: http://mockmsft:9090
      SHEPHERD_ADO_BASE_URL: http://mockmsft:9090
      SHEPHERD_AUTH_APP_ADMIN_GROUP_IDS: "11111111-1111-1111-1111-111111111111"
      SHEPHERD_GITSYNC_TICK: 2s
      SHEPHERD_LOG_LEVEL: debug
      # Local admin enabled alongside OIDC for e2e scenario 8 (LA-1).
      # allow_with_oidc=true required when OIDC is also configured.
      # Empty by default so the default stack exercises the "simulator not
      # configured" path; `make dev-sim` / `make e2e-sim` set it to true.
      SHEPHERD_SIMULATOR_ENABLED: ${SHEPHERD_SIM_ENABLED:-false}
      # config.go's SimulatorConfig defaults all assume a compose service
      # named "shepherd-simulator"; internal/simsvc's compose containment
      # spec (internal/simsvc/compose_containment_test.go) pins this
      # service's key to "simulator" instead, so every one of those defaults
      # is overridden here to the real DNS name. Harmless when the `sim`
      # profile is not up: these only matter once Simulator.Enabled is true.
      SHEPHERD_SIMULATOR_CONTROL_URL: http://simulator:8099
      SHEPHERD_SIMULATOR_CAPTURE_BASE_URL: http://simulator:9110
      SHEPHERD_SIMULATOR_OTLP_GRPC_ADDRESS: simulator:4317
      SHEPHERD_SIMULATOR_SYSLOG_HOST: simulator
      SHEPHERD_SIMULATOR_TARGET_ADDRESS: simulator:9111
    networks:
      default:
        ipv4_address: 172.28.0.10
      sim-internal:
        ipv4_address: 172.28.1.10
    healthcheck:
      test: ["CMD", "/usr/local/bin/shepherd", "healthcheck", "--addr", "172.28.0.10:8080"]
      interval: 2s
      timeout: 5s
      retries: 30

  alloy:
    # version must be >= v1.12 for remote_config_status reporting; bump deliberately.
    # Default tracks ALLOY_IMAGE in deploy/versions.env — override via env var to
    # test a different Alloy build without editing this file.
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.1}
    depends_on:
      shepherd:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "22345:12345"

  # S3 sandbox simulator (VB-1 §6.4). Gated behind the `sim` profile: it runs
  # user-authored Alloy configuration, so it is opt-in even in dev.
  #
  # CONTAINMENT — every key below is load-bearing and asserted by
  # TestSimsvc's compose containment spec in internal/simsvc:
  #   sim-internal has `internal: true`, so this container has NO route off it
  #     and no DNS to the outside world. That is the primary control; the
  #     simulator's own endpoint allowlist is only a second gate.
  #   no `ports:` — nothing is published to the host.
  #   read_only + tmpfs /tmp — the only writable path is the run scratch space,
  #     mounted noexec/nosuid/nodev and size-capped.
  #   user/cap_drop/no-new-privileges — non-root with no capabilities and no
  #     way to acquire any.
  #   mem_limit + memswap_limit — the pair matters: mem_limit alone lets a run
  #     swap past its cap.
  #
  # RESIDUAL RISK, stated plainly: compose cannot express one-way egress —
  # shepherd is still a sim-internal MEMBER (needed for DNS/routing to reach
  # simulator). B-CONTAIN-1 closed that surface anyway: shepherd's Listen and
  # MetricsListen are now bound to its default-network address only (see the
  # shepherd service above), so nothing shepherd-side actually LISTENS on
  # sim-internal — a SYN arriving there gets a kernel RST, independent of
  # sim-internal's own routing. What's left is B-CONTAIN-2 (local dev only):
  # the OrbStack host-gateway path runs through the host's NAT/docker-proxy
  # layer, entirely orthogonal to which interface shepherd's own process
  # binds, so this change does not and cannot touch it. The Kubernetes
  # posture (deploy/helm, NetworkPolicy egress: []) remains strictly
  # stricter than either.
  simulator:
    profiles: ["sim"]
    image: shepherd-simulator:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.simulator
    environment:
      SIM_LISTEN: ":8099"
      SIM_LOG_LEVEL: info
      # allowedHosts (internal/simsvc/config.go) defaults to the literal
      # "shepherd-simulator" plus os.Hostname() — which inside a container is
      # the container ID, not the compose service name, so neither half of
      # that default matches this service's real DNS name. Set explicitly to
      # what the transform actually renders (see the SHEPHERD_SIMULATOR_*
      # overrides on the shepherd service, same file) so CheckEndpoints'
      # allowlist (VB-1 §6.4 defense in depth) agrees with the harness
      # addresses Shepherd hands the transform, instead of rejecting every
      # run with endpoint_not_allowed.
      SIM_ALLOWED_HOSTS: "simulator,localhost,127.0.0.1,::1"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    tmpfs:
      # /tmp/shepherd-sim/{storage,run,capture,logs} are the simulator's
      # defaults; Alloy's WAL lives under the same tmpfs.
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    networks:
      - sim-internal
    healthcheck:
      test: ["CMD", "/usr/local/bin/shepherd-simulator", "healthcheck", "--addr", "127.0.0.1:8099"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The hermetic stand-in for "the internet". It exists so the egress probes in
  # e2e/sandbox_sim_test.go have something real to fail to reach, without any
  # outbound traffic and without a public IP literal anywhere in the repo.
  #
  # It is on the DEFAULT network (shepherd-e2e) and MUST NEVER be on
  # sim-internal. That is the whole design: reachable from the host and from
  # every ordinary service, unreachable from the simulator's network namespace.
  # The control probe dials it over shepherd-e2e and must SUCCEED; without that
  # half, a denial probe would also pass against a canary that was simply
  # broken.
  egress-canary:
    profiles: ["sim"]
    image: alpine:3.22
    # A one-connection-at-a-time HTTP responder built from busybox nc, restarted
    # by the loop. Alpine's busybox has no httpd applet, and pulling a real
    # server image for a listener whose entire job is to answer "ok" once per
    # probe would add a dependency the proof does not need.
    command:
      - /bin/sh
      - -c
      - 'while true; do printf "HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok" | nc -l -p 8080 >/dev/null 2>&1; done'
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  gitea_e2e_data:

networks:
  default:
    name: shepherd-e2e
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Dynamic allocation confined to .128+ so pinned addresses (.10)
          # can never collide with compose auto-assignment, however many
          # services are later added before shepherd.
          ip_range: 172.28.0.128/25
  # internal: true is what denies the sandbox egress — no gateway, no DNS to
  # anything outside this network. Removing it silently restores full outbound
  # access for every config a user runs.
  sim-internal:
    name: shepherd-e2e-sim
    internal: true
    ipam:
      config:
        - subnet: 172.28.1.0/24
          ip_range: 172.28.1.128/25
