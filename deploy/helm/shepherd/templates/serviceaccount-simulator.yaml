{{- if ((.Values.simulator).enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shepherd.simulatorFullname" . }}
  labels:
    {{- include "shepherd.simulatorLabels" . | nindent 4 }}
# false, not omitted: an omitted field inherits the namespace default, which a
# cluster operator can (and by default does, on most distributions) leave true.
# The sandbox runs user-authored Alloy; it must never be able to reach the
# Kubernetes API, and internal/simsvc.Config.SATokenPath makes the binary
# itself refuse to start if a token shows up anyway — this is what stops one
# from being mounted in the first place.
automountServiceAccountToken: false
{{- end }}
