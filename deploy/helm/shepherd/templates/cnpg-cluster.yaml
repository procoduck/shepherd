{{- if ((.Values.cnpg).enabled) }}
{{- /*
  Render ONLY when the Cluster does not already exist.

  This is what stops `helm upgrade` from destroying the database. The Cluster is
  a pre-install/pre-upgrade hook, and Helm's default hook-delete-policy --
  applied precisely when the annotation is omitted -- is before-hook-creation:
  it deletes the previous hook resource before creating the new one. CNPG
  cascades that deletion to the PVCs, initdb bootstraps an empty database, the
  migration hook migrates the empty database, and the upgrade reports success.

  A hook that is not in the manifest is not processed at all, so skipping the
  render leaves the live Cluster untouched. lookup returns empty under
  `helm template` and `--dry-run=client`, so rendering and the chart tests are
  unaffected -- only a real upgrade against a real cluster takes this branch.

  The trade: once the Cluster exists, changes to cnpg.* values no longer reach
  it. That is deliberate. Editing a live database's spec is the operator's job
  (`kubectl edit cluster`), not a side effect of an application upgrade.
*/}}
{{- /*
  cnpg.render is the honest version of the same decision, for the pipelines
  where lookup cannot work.

  lookup returns empty whenever there is no cluster connection -- which is not
  only `helm template` and `--dry-run`, but every deployment tool that renders
  the chart and applies the output itself: Argo CD's default Helm integration,
  Flux post-render flows, `helm template | kubectl apply`. There the guard
  above fails OPEN: the Cluster renders on every single sync, and Argo CD maps
  `helm.sh/hook: pre-install,pre-upgrade` onto a PreSync hook whose default
  deletion policy is BeforeHookCreation -- the delete-and-recreate this whole
  comment exists to prevent, run every time anyone syncs.

    auto    (default) render only when lookup says it is not there. Correct
            under the helm CLI, unsafe under anything that renders offline.
    never   never render it. What a GitOps user sets once the database exists,
            so no sync can touch it again.
    always  render unconditionally. For bootstrapping a GitOps deployment, or
            for a pipeline that diffs the full desired state. Understand that
            an apply-based tool may then delete and recreate it.
*/}}
{{- $render := (.Values.cnpg).render | default "auto" }}
{{- if not (has $render (list "auto" "always" "never")) }}
{{- fail (printf "cnpg.render must be one of auto, always, never (got %q)" $render) }}
{{- end }}
{{- $existingCluster := "" }}
{{- if eq $render "auto" }}
{{- $existingCluster = lookup "postgresql.cnpg.io/v1" "Cluster" .Release.Namespace (include "shepherd.cnpgClusterName" .) }}
{{- end }}
{{- if and (ne $render "never") (not $existingCluster) }}
{{- /*
  No CRD precondition here on purpose. .Capabilities.APIVersions is empty under
  `helm template`, so a guard would break rendering the chart offline -- and the
  API server's own "no matches for kind Cluster" is already a clear answer. The
  same reasoning `route.enabled` follows.
*/}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "shepherd.cnpgClusterName" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    {{- include "shepherd.bootstrapHookDeps" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}
  {{- with .Values.cnpg.imageName }}
  imageName: {{ . | quote }}
  {{- end }}
  storage:
    size: {{ .Values.cnpg.storage.size | quote }}
    {{- with .Values.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database | quote }}
      owner: {{ .Values.cnpg.owner | quote }}
  {{- with .Values.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cnpg.extraSpec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
