{{- if .Values.externalSecrets.enabled }}
{{- if .Values.secrets }}
{{- fail "externalSecrets.enabled and `secrets` both set: they would render two different definitions of the same Secret. Pick one -- let the operator generate the bootstrap values, or supply them yourself." }}
{{- end }}
{{- if .Values.existingSecret }}
{{- fail "externalSecrets.enabled and existingSecret both set: the ExternalSecret would generate a Secret that nothing reads. Pick one." }}
{{- end }}
{{- $fullName := include "shepherd.fullname" . }}
apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
kind: Password
metadata:
  name: {{ $fullName }}-encryption-key
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    {{- include "shepherd.bootstrapHookDeps" . | nindent 4 }}
spec:
  # No symbols: the value is base64-encoded into Shepherd's 32-byte key, so
  # the alphabet only has to be 32 bytes wide, not memorable.
  length: {{ .Values.externalSecrets.encryptionKey.length }}
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- if .Values.externalSecrets.bootstrapAdmin.enabled }}
---
apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
kind: Password
metadata:
  name: {{ $fullName }}-admin-password
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    {{- include "shepherd.bootstrapHookDeps" . | nindent 4 }}
spec:
  length: {{ .Values.externalSecrets.bootstrapAdmin.length }}
  digits: 5
  symbols: 5
  symbolCharacters: "-_@%+"
  noUpper: false
  allowRepeat: true
{{- end }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $fullName }}-bootstrap
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    {{- include "shepherd.bootstrapHookDeps" . | nindent 4 }}
spec:
  # "0" means generate once and never again. This is not a rotatable
  # credential: a new encryption key cannot decrypt the git credentials and
  # OIDC client secret the old one wrote, and nothing would report the loss at
  # the moment it happened.
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  target:
    # The name the Deployment and the migration Job already read.
    name: {{ $fullName }}-secrets
    creationPolicy: Owner
    # Retain, for the same reason refreshInterval is 0: deleting this
    # ExternalSecret must not take the encryption key with it.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Shepherd wants base64 of 32 bytes; the generator produces 32
        # characters, so the encoding happens here.
        SHEPHERD_SECURITY_ENCRYPTION_KEY: "{{ `{{ .encryptionKey | b64enc }}` }}"
        {{- if .Values.externalSecrets.bootstrapAdmin.enabled }}
        SHEPHERD_BOOTSTRAP_ADMIN_LOGIN: {{ .Values.externalSecrets.bootstrapAdmin.login | quote }}
        SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD: "{{ `{{ .adminPassword }}` }}"
        {{- end }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
          kind: Password
          name: {{ $fullName }}-encryption-key
      rewrite:
        - regexp:
            source: "password"
            target: "encryptionKey"
    {{- if .Values.externalSecrets.bootstrapAdmin.enabled }}
    - sourceRef:
        generatorRef:
          apiVersion: {{ .Values.externalSecrets.generatorApiVersion }}
          kind: Password
          name: {{ $fullName }}-admin-password
      rewrite:
        - regexp:
            source: "password"
            target: "adminPassword"
    {{- end }}
{{- end }}
