{{- if include "shepherd.serviceAccountCreate" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shepherd.serviceAccountName" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  {{- with (.Values.serviceAccount).annotations }}
  {{- /*
    Where an EKS IRSA role ARN or a GKE Workload Identity binding goes. Both are
    how a Shepherd pod reaches a managed database without a static credential,
    which is the database path values.yaml recommends first.
  */}}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Shepherd talks to PostgreSQL and to collectors. Its only Kubernetes API use is
# applying tenant routes, with the receiver tier on (rbac-tenant-routes.yaml);
# the Deployment opts into the token mount for exactly that case, so the
# account itself never offers one.
automountServiceAccountToken: false
{{- end }}
