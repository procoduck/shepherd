apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shepherd.fullname" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  {{- if ((.Values.migrations).job).enabled }}
  annotations:
    {{- include "shepherd.migrateHookDeps" . | nindent 4 }}
  {{- end }}
# Shepherd talks to PostgreSQL and to collectors, never to the Kubernetes API,
# and the chart grants it no RBAC. A mounted token is therefore pure attack
# surface -- the simulator's ServiceAccount already declines it.
automountServiceAccountToken: false
