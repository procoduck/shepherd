{{- if include "shepherd.serviceAccountCreate" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shepherd.serviceAccountName" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  {{- with (.Values.serviceAccount).annotations }}
  {{- /*
    Where an EKS IRSA role ARN or a GKE Workload Identity binding goes. Both are
    how a Shepherd pod reaches a managed database without a static credential,
    which is the database path values.yaml recommends first.
  */}}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Shepherd talks to PostgreSQL and to collectors, never to the Kubernetes API,
# and the chart grants it no RBAC. A mounted token is therefore pure attack
# surface -- the simulator's ServiceAccount already declines it.
automountServiceAccountToken: false
{{- end }}
