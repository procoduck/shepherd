{{- if and (((.Values.migrations).job).enabled) (not .Values.existingSecret) .Values.secrets }}
{{- /*
  The migration Job's own copy of the Secret, for the same reason as the
  ConfigMap next to it: the runtime Secret is tracked, so it does not exist yet
  when the Job runs as a hook.

  hook-succeeded on this one is doing real work -- it deletes the copy as soon
  as the migration passes, so the credentials do not sit in the namespace in two
  places between releases.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shepherd.migrateFullname" . }}-secrets
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- include "shepherd.migrateHookDeps" . | nindent 4 }}
stringData:
  {{- toYaml .Values.secrets | nindent 2 }}
{{- end }}
