{{- if and (((.Values.migrations).job).enabled) (include "shepherd.serviceAccountCreate" .) }}
{{- /*
  The migration Job's own ServiceAccount: the runtime one is tracked, so it does
  not exist when the Job runs as a hook, and a pod referencing a missing
  ServiceAccount is refused outright.

  When serviceAccount.create is false the Job uses whatever account the operator
  named, which they are responsible for having created -- the same bargain the
  Deployment makes.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shepherd.migrateFullname" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- include "shepherd.migrateHookDeps" . | nindent 4 }}
  {{- with (.Values.serviceAccount).annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
