{{- if ((.Values.networkPolicy).enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shepherd.fullname" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
spec:
  # The server pods only (#234). With the release-wide pair this policy also
  # selected the simulator and receiver pods, and NetworkPolicies are additive:
  # its allow-all egress rule below then overrode the sandbox's default-deny
  # egress the moment networkPolicy.enabled was turned on.
  podSelector:
    matchLabels:
      {{- include "shepherd.serverSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: {{ .Values.service.port | default 8080 }}
          protocol: TCP
        # The metrics port must be allowed too. policyTypes includes Ingress,
        # so anything not listed here is denied -- and /metrics is served ONLY
        # on this port, never on the main one. Without this rule, enabling the
        # policy silently stopped every scrape, including the ServiceMonitor
        # the same values file recommends turning on.
        - port: {{ include "shepherd.metricsPort" . | int }}
          protocol: TCP
  egress:
    - {} # Allow all egress; restrict at CNI level for FQDN policies
{{- end }}
