{{- if ((.Values.autoscaling).enabled) }}
{{- /*
  A CPU-utilisation HPA is a percentage OF THE REQUEST, so with no CPU request
  on the target Deployment there is nothing to take a percentage of: the HPA
  reports FailedGetResourceMetric forever and never scales, which looks exactly
  like an autoscaler that has decided not to. `resources` is {} by default, so
  the two chart defaults combined produced precisely that. Refuse at install
  time instead.
*/}}
{{- if not (((.Values.resources).requests).cpu) }}
{{- fail "autoscaling.enabled needs resources.requests.cpu: an HPA targeting CPU utilization computes a percentage of the request, and with no request it can never scale. Set resources.requests.cpu (and a matching limit), or leave autoscaling off and set replicas." }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "shepherd.fullname" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "shepherd.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 80 }}
{{- end }}
