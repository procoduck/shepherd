{{- if ((.Values.migrations).job).enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shepherd.fullname" . }}-migrate
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
spec:
  # Retries matter when the chart provisions the database: on a first install
  # Postgres is still coming up while this Job is already running, so the first
  # attempts fail on connect. Kubernetes backs off exponentially between
  # attempts, which covers a CNPG cluster reaching readiness without anyone
  # having to sequence it by hand. A genuinely broken migration still fails the
  # release, just later.
  backoffLimit: {{ (((.Values.migrations).job).backoffLimit | default 6) }}
  template:
    spec:
      serviceAccountName: {{ include "shepherd.fullname" . }}
      restartPolicy: Never
      volumes:
        - name: config
          configMap:
            name: {{ include "shepherd.fullname" . }}
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrate
          image: {{ include "shepherd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up", "--config", "/etc/shepherd/shepherd.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/shepherd
            - name: tmp
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "shepherd.fullname" . }}-secrets{{ end }}
                optional: true
          {{- $env := include "shepherd.podEnv" . }}
          {{- if trim $env }}
          env:
            {{- $env | nindent 12 }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
