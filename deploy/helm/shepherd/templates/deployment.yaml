apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shepherd.fullname" . }}
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
spec:
  {{- if not ((.Values.autoscaling).enabled) }}
  # Omitted when an HPA owns the replica count. Setting both means every
  # `helm upgrade` snaps the Deployment back to this number, undoing whatever
  # the autoscaler had decided -- a downscale from 10 to 2 in one step.
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shepherd.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "shepherd.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "shepherd.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # Matching the simulator's pod hardening, which had these and the main
        # workload did not.
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: {{ include "shepherd.fullname" . }}
        - name: tmp
          emptyDir: {}
      containers:
        - name: shepherd
          image: {{ include "shepherd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/shepherd/shepherd.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # Metrics are served on their own listener, never on the main one
            # (internal/server: /metrics on :8080 is explicitly 404-guarded).
            # Without this port declared there was nothing for a ServiceMonitor
            # to scrape.
            - name: metrics
              containerPort: {{ include "shepherd.metricsPort" . | int }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/shepherd
            - name: tmp
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "shepherd.fullname" . }}-secrets{{ end }}
                optional: true
          {{- $env := include "shepherd.podEnv" . }}
          {{- if trim $env }}
          env:
            {{- $env | nindent 12 }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
