{{- if ((.Values.simulator).enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shepherd.simulatorFullname" . }}
  labels:
    {{- include "shepherd.simulatorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shepherd.simulatorSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Only the main shepherd Deployment submits runs (POST /v1/runs on the
  # control port); nothing else in the cluster has a reason to reach this Pod
  # at all. Selected by the server's component label (#234): the release-wide
  # pair alone also matches the receiver, the migrate Job and this very pod.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shepherd.serverSelectorLabels" . | nindent 14 }}
      ports:
        - port: control
          protocol: TCP
  # Default-deny egress, opened only to what §6.4 calls "the harness": the
  # capture/synthetic/OTLP/syslog receivers THIS SAME POD serves for the
  # sandboxed Alloy child process to reach (internal/simsvc/runner.go — it is
  # a child process, not a sibling container, so this Pod's network boundary
  # IS the sandbox's boundary). No cluster DNS, no route to the rest of the
  # cluster, no route to the internet — a user-authored config gets nothing
  # else to talk to, whatever it names.
  #
  # D10: cluster DNS used to be open here so the sandbox could resolve this
  # Service's own name. It no longer needs to: every harness endpoint above is
  # served by THIS SAME POD, so shepherd.configYaml (_helpers.tpl) now wires
  # the sandbox at these ports via 127.0.0.1 directly, and DNS resolution
  # itself is denied end to end (e2e/k8s/simulator_containment_test.go's
  # P-dns-only). A resolver a user-authored config could still ask to name
  # things with -- and get nothing back -- is a smaller attack surface than a
  # resolver it could use to confirm what else is reachable.
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "shepherd.simulatorSelectorLabels" . | nindent 14 }}
      ports:
        - port: capture
          protocol: TCP
        - port: synthetic
          protocol: TCP
        - port: otlp-grpc
          protocol: TCP
        - port: syslog
          protocol: TCP
    {{- with .Values.simulator.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
