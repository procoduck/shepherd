{{- if ((.Values.receiver).enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shepherd.receiverFullname" . }}
  labels:
    {{- include "shepherd.receiverLabels" . | nindent 4 }}
# The receiver talks to no Kubernetes API; it gets no RBAC and its token is
# never mounted (automountServiceAccountToken: false on the pod).
automountServiceAccountToken: false
{{- end }}
