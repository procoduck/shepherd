image:
  tag: "0.0.1"
replicas: 2
config:
  tracing:
    enabled: true
    endpoint: "otel-collector.observability.svc:4317"
    sample_ratio: 0.25
  server:
    listen: ":8080"
    base_url: "https://shepherd.internal"
  database:
    max_conns: 20
  oidc:
    issuer: "https://login.microsoftonline.com/TENANT_ID/v2.0"
    client_id: "CLIENT_ID"
    redirect_url: "https://shepherd.internal/auth/callback"
    scopes: ["openid", "profile", "email"]
  auth:
    session_ttl: "8h"
    app_admin_group_ids: ["00000000-0000-0000-0000-000000000001"]
  graph:
    tenant_id: "TENANT_ID"
    client_id: "GRAPH_CLIENT_ID"
  validate:
    alloy_binary: "/usr/local/bin/alloy"
    stability_level: "experimental"
    timeout: "10s"
  log:
    level: "info"
    format: "json"
existingSecret: "shepherd-secrets"
migrations:
  job:
    enabled: true
route:
  enabled: true
  hostnames:
    - shepherd.internal
  parentRefs:
    - name: prod-gateway
      namespace: gateway
# Observability rendered here so `make helm-lint` catches a broken
# ServiceMonitor or tracing block at template time rather than in a cluster.
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      prometheus: kube-prometheus
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Exercised here so `make helm-lint`'s full-values.yaml render actually renders
# the simulator's Deployment/Service/NetworkPolicy/ServiceAccount, not just the
# disabled-by-default no-op path the default-values.yaml render covers.
simulator:
  enabled: true
