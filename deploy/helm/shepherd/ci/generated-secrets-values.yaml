# The "let the cluster generate everything" path: CloudNativePG provisions the
# database and External Secrets generates the bootstrap values, so nothing is
# supplied by hand at all.
#
# It needs its own file because externalSecrets and existingSecret are mutually
# exclusive by design -- the chart refuses to render both -- and
# full-values.yaml sets existingSecret. Without this file, `make helm-lint`
# would never render a Password generator or an ExternalSecret.
cnpg:
  enabled: true

externalSecrets:
  enabled: true

# Deliberately no existingSecret and no secrets: block. That is the point.
