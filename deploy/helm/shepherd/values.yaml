# nameOverride: replaces the chart name in every generated object name and in
# the app.kubernetes.io/name label. Empty means "shepherd".
nameOverride: ""
# fullnameOverride: replaces the whole "<release>-<chart>" prefix, so objects are
# named exactly this. Empty means the usual release-derived name.
fullnameOverride: ""

image:
  # Default to the released images; set registry: "" to use a bare/local name.
  registry: "ghcr.io/procoduck"
  # repository: the image name, combined with registry above (or used bare
  # if registry is empty) to form the image the chart pulls.
  repository: shepherd
  # Empty means the chart's own appVersion, so a given chart version installs
  # the Shepherd release it was published and tested with. Override only to
  # pin something else deliberately.
  tag: ""
  # pullPolicy: standard Kubernetes image pull policy. IfNotPresent is safe
  # here because tag defaults to a specific released version, not a moving
  # tag like "latest".
  pullPolicy: IfNotPresent
  # pullSecrets: names of existing imagePullSecrets, for a private registry.
  # Empty means the pod pulls with no credentials.
  pullSecrets: []

# Shepherd keeps no state outside PostgreSQL, so replicas are free to add and
# safe to lose. Two by default so a node drain is not an outage; the
# PodDisruptionBudget below assumes at least two.
replicas: 2

# The Service in front of Shepherd. ClusterIP by default: an Ingress or
# HTTPRoute (both below) is the intended way in for a real deployment.
#
# type is exposed because the template hardcoded ClusterIP, which left no way
# to reach Shepherd on a bare cluster without editing the rendered object by
# hand — kind and other local clusters have no ingress controller, and that is
# exactly where someone is trying the chart for the first time.
service:
  # type: the Service's kind (ClusterIP, NodePort, LoadBalancer -- standard
  # Kubernetes values). See above for why this is exposed rather than
  # hardcoded to ClusterIP.
  type: ClusterIP
  # port: the container's HTTP port and the port the Service listens on.
  # config.server.listen below must agree with it -- the Deployment's
  # containerPort is hardcoded to 8080, not derived from either value.
  port: 8080
  # Only used when type is NodePort. Leave empty to let Kubernetes pick one
  # from the node port range.
  nodePort: ""
  # appProtocol: the application-protocol hint on the Service port. Shepherd
  # serves Connect over both HTTP/1.1 and cleartext HTTP/2 (h2c); the default
  # tells gateways that honour the hint (Envoy-based ones, Istio) to speak h2c
  # to it. NGINX Gateway Fabric refuses to proxy an HTTP route to an h2c
  # upstream ("UnsupportedProtocol"), so with route.enabled on NGF set this to
  # "" -- the field is then omitted and the gateway uses HTTP/1.1, which
  # Shepherd serves equally well.
  appProtocol: kubernetes.io/h2c

config:
  server:
    # listen: host:port the main HTTP server binds. The Deployment's
    # containerPort and service.port above are both hardcoded to 8080, so
    # changing this alone does not move where the container is reachable --
    # keep all three in agreement.
    listen: ":8080"
    # Metrics listen on their own port; /metrics is never served on `listen`.
    # The container port, the metrics Service, and the ServiceMonitor are all
    # derived from this value, so changing it here is enough.
    metrics_listen: ":9090"
    # base_url: Shepherd's own externally-reachable URL, no path. Collectors'
    # remotecfg clients and the beacon's remote-write endpoint are both built
    # against it, so it needs to be an address they can actually reach, not
    # just this Service's in-cluster name.
    base_url: "https://shepherd.example.internal"
    # The beacon (docs/gateway-tier-plan.md D6) serves every claimed collector
    # a small baseline pipeline that reports which components it is running
    # and whether they are healthy — component names only, never config text
    # and never raw samples — and mounts an ingest endpoint at
    # /beacon/v1/write authenticated by the same agent token everything else
    # uses.
    #
    # It is ON by default and that is deliberate: the collector nobody knows
    # about is exactly the one that would never opt in. Set this to true to
    # turn it off entirely — no endpoint is mounted and no baseline is served.
    # Opting out is offered because the beacon stores inventory and accepts
    # writes, and an operator who cannot answer for that yet should be able to
    # say no without downgrading.
    beacon_disabled: false
  database:
    # max_conns: the maximum size of Shepherd's own PostgreSQL connection pool.
    max_conns: 20
  # ---------------------------------------------------------------------------
  # OIDC single sign-on (OPTIONAL)
  #
  # Leaving `issuer` unset does NOT mean "no SSO": it hands configuration to
  # the app admins, who can point Shepherd at a provider from the UI
  # (Admin -> Single sign-on) without a rollout. Setting `issuer` here takes
  # that ability away — chart config always wins, and the UI shows the values
  # read-only. Choose deliberately: declare it here if your identity provider
  # belongs in git, leave it out if you would rather bootstrap through the
  # local admin account and configure SSO in the product.
  #
  # The claim fields below default to Microsoft Entra ID's shapes, which is
  # what this chart has always assumed. A non-Entra provider MUST override at
  # least provider, subject_claim, and groups_claim.
  # ---------------------------------------------------------------------------
  oidc:
    # scopes: OAuth scopes requested at login. This default matches every
    # supported provider's minimum; add to it only if your provider requires
    # more to return the claims configured below.
    scopes: ["openid", "profile", "email"]
    # issuer: "https://login.microsoftonline.com/<tenant-id>/v2.0"
    # client_id: ""                  # client_secret via SHEPHERD_OIDC_CLIENT_SECRET
    # redirect_url: "https://shepherd.example.internal/auth/callback"
    #
    # provider: one of entra | okta | google | auth0 | keycloak | cognito |
    # gitlab | authentik | onelogin | generic. It sets the use_graph_groups
    # default and labels the deployment; it does not change any value spelled
    # out below.
    # provider: "entra"
    # display_name: "Microsoft"      # sign-in button label
    #
    # Claim mapping. subject_claim defaults to "oid" (Entra's object ID);
    # every other provider needs "sub".
    # subject_claim: "oid"
    # email_claim: "email"
    # name_claim: "name"
    # groups_claim: "groups"         # "cognito:groups" for Cognito, "groups_direct" for GitLab
    #
    # use_graph_groups resolves membership through Microsoft Graph instead of
    # the ID token claim. Defaults to true for provider "entra" and false
    # otherwise. Keep it on for Entra: the groups claim is dropped entirely
    # once a user is in more than ~200 groups.
    # use_graph_groups: true
    #
    # --- Collector (agent) OIDC (docs/plans/2026-09-16-agent-oidc-auth.md) ---
    # Let an Alloy collector authenticate with an OIDC access token from this
    # same issuer instead of the shared agent token. Off until agent_audience
    # is set.
    #
    # agent_audience is the resource identifier a collector's access token must
    # carry in `aud` — what separates a machine token from a user login token.
    # It is the master switch.
    # agent_audience: "api://shepherd-collectors"
    #
    # The grant gate (recommended): require the token to carry an app role or
    # scope, so a valid token for the audience is not enough without the
    # explicit collector permission (the IdP "app role bound to the API").
    # agent_required_role: "Collector.Poll"
    # agent_required_scope: ""
    #
    # Claim names. agent_app_claim identifies the calling client (default
    # "sub"; often "azp"); agent_roles_claim is the roles claim ("roles" on
    # Entra, "permissions" on Auth0); agent_clusters_claim, if set, lists the
    # clusters a token may act for (empty = any within its org).
    # agent_app_claim: "sub"
    # agent_roles_claim: "roles"
    # agent_clusters_claim: ""
    #
    # Mode 2 — IdP-authoritative org (opt-in). By default a collector's org
    # comes from a Shepherd-local agent-identity binding (see the CLI /
    # Admin -> Single sign-on). These let the IdP assert the org instead:
    # agent_trust_org_claim names a claim whose value IS the org's name;
    # agent_org_role_prefix reads the org from a role like
    # "shepherd-org:platform-eng" (prefix "shepherd-org:"). Both empty by
    # default — setting either means you trust this issuer's org assignment.
    # A token with neither a binding nor a trusted org claim still falls
    # through to the admin cluster-claim.
    # agent_trust_org_claim: ""
    # agent_org_role_prefix: ""
    #
    # Beacon self-monitoring auth. "basic" (default) uses the agent token;
    # "oauth2" makes the served beacon pipeline authenticate with the
    # collector's own OIDC client credentials against agent_token_url. It is a
    # whole-fleet choice — the served config is shared across a collector's
    # instances.
    # beacon_auth: "basic"
    # agent_token_url: "https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token"
    # agent_scopes: ["api://shepherd-collectors/.default"]
  auth:
    # session_ttl: how long a signed-in session stays valid before the user
    # must sign in again.
    session_ttl: "8h"
    #
    # app_admin_group_ids: the groups whose members are APPLICATION ADMINS —
    # full access everywhere, including the Admin -> Single sign-on page. This
    # is the single most important auth value in the chart and it has no
    # default: leave it empty and no one who signs in through your identity
    # provider can administer anything.
    #
    # The values are matched against whatever your provider puts in the groups
    # claim (oidc.groups_claim above), so their FORM depends on the provider:
    #   - Microsoft Entra ID -> group object GUIDs
    #   - Okta / Keycloak / Auth0 / authentik / OneLogin -> group names
    #   - GitLab -> full paths, e.g. "acme/platform"
    #   - AWS Cognito -> user-pool group names (claim is "cognito:groups")
    # The same applies to each org's admin/reader group. Nothing here requires
    # a GUID; only Entra happens to emit one.
    #
    # app_admin_group_ids:
    #   - "11111111-2222-3333-4444-555555555555"   # Entra
    #   - "platform-admins"                        # everyone else
    # -----------------------------------------------------------------------
    # Local users
    #
    # Shepherd can run with no identity provider at all. On first start, when
    # the users table is empty, it creates one administrator; after that,
    # accounts are managed in the UI under Admin -> Users.
    #
    # Set the password through the Secret (SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD),
    # NEVER here — this block renders into a ConfigMap. If you leave it unset
    # the account is created as admin/admin and Shepherd refuses to serve
    # anything to that session until the password is changed, so the default is
    # only ever good for the one action that replaces it.
    #
    #   SHEPHERD_BOOTSTRAP_ADMIN_LOGIN     default "admin"
    #   SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD  no default; see above
    #
    # Both are read only when the users table is empty, so they cannot resurrect
    # a deleted account or reset an existing password on a later rollout.
    # -----------------------------------------------------------------------
  graph:
    # base_url: the Microsoft Graph API root used to resolve group membership
    # when use_graph_groups is on. Override only for a sovereign cloud (e.g.
    # graph.microsoft.us) whose API root differs from the public cloud.
    base_url: "https://graph.microsoft.com"
  agent:
    # inactive_after: mark a collector instance inactive once this long has
    # passed with no check-in.
    inactive_after: "5m"
    # delete_after: hard-delete a collector instance once this long has
    # passed with no check-in. Longer than inactive_after, so an instance
    # spends time visibly inactive before it disappears.
    delete_after: "24h"
  validate:
    # alloy_binary: path to the bundled `alloy` binary Stage 2 validation
    # execs. Empty skips Stage 2 entirely (reported as "skipped", not
    # "valid", so a broken path is visible rather than silently passing).
    alloy_binary: "/usr/local/bin/alloy"
    # stability_level: passed to `alloy validate --stability.level=`. One of
    # stable, public-preview, experimental; a typo here fails every pipeline
    # validation and nothing catches it at install time.
    stability_level: "experimental"
    # timeout: how long Stage 2's `alloy validate` exec is allowed to run
    # before it is killed.
    timeout: "10s"
  gitsync:
    # tick: how often the git-sync reconciler polls repos that are due for a
    # check, per their own poll interval.
    tick: "3m"
  # ---------------------------------------------------------------------------
  # Tracing (OPTIONAL — off by default)
  #
  # `endpoint` is the switch. Unset means tracing is off entirely: no provider
  # is installed, no exporter runs, and the instrumentation costs nothing, so
  # leaving this alone is free. Set it and Shepherd exports OTLP spans for
  # every HTTP request and Connect RPC it serves.
  #
  # Health probes (/healthz, /readyz), the metrics scrape, and static SPA
  # assets are never traced — otherwise a backend fills with Kubernetes
  # liveness checks.
  # ---------------------------------------------------------------------------
  tracing:
    # Set enabled: true AND an endpoint. Enabled with no endpoint is reported
    # as a misconfiguration in the logs rather than silently doing nothing —
    # an empty trace backend with no explanation is the worst way to find out.
    enabled: false
    # endpoint: the OTLP collector's address, e.g.
    # "opentelemetry-collector.observability.svc:4317" -- host:port, no
    # scheme. Required when enabled is true; see enabled above.
    endpoint: ""
    # protocol: "grpc" (collector port 4317, the default) or "http" (port
    # 4318) -- which OTLP transport to export spans over.
    protocol: "grpc"
    # insecure: skip TLS to the collector. true is normal for an in-cluster
    # collector reached over the pod network; set false for a collector
    # reached over the open network.
    insecure: true
    # sample_ratio applies only to traces Shepherd ROOTS; an incoming sampling
    # decision is always honoured. Collectors poll continuously, so 1.0 here is
    # a lot of spans.
    sample_ratio: 0.1
    # service_name: the resource.service.name attribute stamped on every
    # exported span, so your trace backend can group Shepherd's spans apart
    # from other services.
    service_name: "shepherd"
    # service_version: ""   # set it to correlate traces with releases
  log:
    # level: the minimum log level Shepherd emits, e.g. debug, info, warn, error.
    level: "info"
    # format: the log encoding Shepherd writes -- "json" for structured logs
    # (the default, suited to log aggregation) or "text" for human-readable
    # output.
    format: "json"

# -----------------------------------------------------------------------------
# CloudNativePG: let the chart provision the database.
#
# OFF by default, and Shepherd is happy either way — point
# SHEPHERD_DATABASE_URL at an RDS, a Cloud SQL, or any Postgres you already run
# and leave this alone. Turn it on and the chart renders a
# postgresql.cnpg.io/v1 Cluster, and wires Shepherd's database URL to the `uri`
# key of the `<cluster>-app` Secret that CNPG generates. You never write a
# connection string.
#
# Requires the CloudNativePG operator and its CRDs to be installed in the
# cluster already; the chart does not install operators.
#
# The Cluster renders as a pre-install/pre-upgrade hook so it exists before the
# migration Job runs. Three consequences worth knowing:
#   - `helm uninstall` does NOT delete it. Hook resources are not tracked in
#     the release, which for the thing holding all your data is the right way
#     round. Remove it deliberately with `kubectl delete cluster <name>`.
#   - Once it exists, changes to cnpg.* no longer reach it: the chart skips
#     rendering a Cluster that is already there, because a hook Helm re-renders
#     is a hook Helm first DELETES. Edit a live cluster with `kubectl edit
#     cluster <name>`, which is the operator's own interface for it.
#   - On a first install the migration Job may fail a few times while Postgres
#     is still coming up. That is expected and it retries — see
#     migrations.job.backoffLimit.
#
# GITOPS WARNING. The "skips rendering a Cluster that is already there" trick
# above uses `lookup`, which needs a live cluster connection. Argo CD, Flux and
# `helm template | kubectl apply` render the chart with no connection, so the
# guard fails OPEN there: the Cluster is emitted on every sync, and Argo CD in
# particular treats a pre-install/pre-upgrade hook as a PreSync hook it DELETES
# before recreating -- which takes the PVCs and the database with it. If you
# deploy this chart through any such tool, set `render: never` below once the
# database exists.
cnpg:
  # enabled: turn on to let the chart provision the database via
  # CloudNativePG. See the block comment above for what that means and its
  # GitOps caveat.
  enabled: false
  # render: auto | always | never -- when to emit the Cluster object.
  #   auto    (default) only when `lookup` says it is not already there.
  #           Correct under the helm CLI; unsafe under GitOps, see above.
  #   never   never emit it. What a GitOps deployment sets after bootstrap.
  #   always  emit it unconditionally, for bootstrapping or for a pipeline that
  #           wants the full desired state.
  render: auto
  # Cluster name. Empty means "<release>-db".
  name: ""
  # Two gives you a primary and one standby, which is the minimum CloudNativePG
  # needs for automated failover. Raise it for more read capacity or headroom.
  instances: 2
  storage:
    # size: the PersistentVolumeClaim size for the primary and each standby.
    size: 10Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  # The database and the role that owns it. Shepherd needs no superuser.
  database: shepherd
  # owner: the role that owns `database` above; Shepherd connects using this
  # role. See the comment above -- no superuser required.
  owner: shepherd
  # Pinning the image is optional; empty lets the operator choose the version
  # it was built against, which is the one it knows how to upgrade.
  imageName: ""
  # resources: CPU/memory requests and limits for the Postgres instances.
  # Empty means unbounded, same as the app's own `resources` below.
  resources: {}
  # Merged verbatim into the Cluster spec, for anything this chart does not
  # surface: backup, monitoring, affinity, postgresql.parameters, and so on.
  # See the CloudNativePG API reference.
  extraSpec: {}

# -----------------------------------------------------------------------------
# External Secrets Operator: let the cluster generate the bootstrap secrets.
#
# OFF by default. Enabled, the chart renders two Password generators and an
# ExternalSecret that produces the Secret Shepherd reads — so the encryption
# key and the first administrator's password are generated in-cluster and never
# pass through your shell, your values file, or your terminal history.
#
# Requires the External Secrets Operator and its CRDs; the chart does not
# install operators. No SecretStore is needed: a generator is the source.
#
# refreshInterval is "0" and MUST stay "0". These are not rotatable
# credentials: regenerating the encryption key would leave every git credential
# and OIDC client secret already stored in the database undecryptable, with no
# error at the moment it happens. deletionPolicy is Retain for the same reason
# — uninstalling the release must not take the key with it.
#
# Both only hold while the ExternalSecret itself survives, so the chart also
# skips rendering it once it exists. Changing externalSecrets.* after the first
# install therefore has no effect; delete the ExternalSecret deliberately if you
# genuinely want it regenerated, understanding that a new key orphans every
# credential the old one encrypted.
#
# The same GITOPS WARNING as cnpg above applies, and here the loss is quieter:
# under Argo CD or Flux the ExternalSecret is recreated on every sync, syncs
# once against fresh Password generators, and replaces an encryption key that
# cannot be rotated -- with no error at the moment it happens. Set
# `render: never` below once the secret exists.
externalSecrets:
  # enabled: turn on to let External Secrets Operator generate the bootstrap
  # Secret in-cluster. See the block comment above for what that means and
  # its GitOps caveat.
  enabled: false
  # render: auto | always | never. Identical meaning to cnpg.render above.
  render: auto
  # API versions, exposed because ESO has moved them before. These defaults
  # match ESO v1.x.
  apiVersion: external-secrets.io/v1
  # generatorApiVersion: API version for the Password generator objects
  # (distinct from apiVersion above, which is for the ExternalSecret itself).
  generatorApiVersion: generators.external-secrets.io/v1alpha1
  # Do not change. See the note above.
  refreshInterval: "0"
  encryptionKey:
    # 32 characters, base64-encoded by the ExternalSecret template into the
    # 32 bytes Shepherd requires. DO NOT CHANGE: Shepherd rejects any other
    # length outright, so a different value here produces an instance that
    # cannot start. Exposed only because the generator requires the field.
    length: 32
  bootstrapAdmin:
    # Generate the first administrator's password too. Turn this off if you
    # would rather set SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD yourself.
    enabled: true
    # length: character length of the generated bootstrap administrator password.
    length: 24
    # Read it once it exists with:
    #   kubectl get secret <release>-secrets \
    #     -o jsonpath='{.data.SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD}' | base64 -d
    login: admin

# existingSecret: the name of a Secret you already manage, holding the SHEPHERD_*
# environment variables. Empty means the chart renders its own from `secrets`
# below. Set this and `secrets` is ignored entirely; it is also mutually
# exclusive with externalSecrets.enabled, which the chart refuses rather than
# silently picking a winner.
existingSecret: ""
# secrets: key-value pairs rendered into a Kubernetes Secret and injected as environment variables.
#
# Convenient, and the least private of the three options: whatever you put here
# is stored verbatim in the Helm release and stays readable through
# `helm get values <release>` for the life of the release history. For
# production prefer `existingSecret` (you manage the object) or
# `externalSecrets.enabled` (the cluster generates it and it never passes
# through your shell at all).
# Keys must match the SHEPHERD_* env var names. Example for local admin password hash:
#   secrets:
#     SHEPHERD_DATABASE_URL: "postgres://..."
#     SHEPHERD_SECURITY_ENCRYPTION_KEY: "base64-32-bytes"
#     SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD: "choose-something"
# NEVER put SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD in the config: block above — that renders
# into a ConfigMap, which is not a place for a password.
secrets: {}

migrations:
  job:
    # enabled: run `shepherd migrate up` as a pre-install/pre-upgrade hook, so
    # the schema is always current before the new pods start. Turn it off only
    # if you run migrations yourself (`shepherd migrate up` against the same
    # database) BEFORE every upgrade -- Shepherd will not start against a schema
    # older than its binary.
    enabled: true
    # How many times the migration Job may fail before the release does. The
    # default covers a database that is still being provisioned -- see the Job
    # template. Lower it if you would rather fail fast against a database that
    # is always already there.
    backoffLimit: 6
    # resources for the migration pod. Empty means unbounded, which is fine on
    # most clusters; set it if a ResourceQuota or a LimitRange in this namespace
    # requires every pod to declare one, since the Job is a pre-install hook and
    # a rejected hook pod fails the whole install.
    resources: {}

# Gateway API HTTPRoute. OFF by default, like `ingress` below: it needs the
# Gateway API CRDs, which are not present on a vanilla cluster, so defaulting it
# on made a plain `helm install` fail with "no matches for kind HTTPRoute".
# Templating could never catch that — `helm template` does not check whether a
# Kind exists — and every values file in the repo already set it to false, which
# is how the broken default survived. Enable it deliberately, and set
# parentRefs/hostnames when you do: an HTTPRoute with neither routes nothing.
route:
  # enabled: turn on to render the HTTPRoute below. See the comment above
  # for why it defaults off.
  enabled: false
  # hostnames: hostnames this HTTPRoute matches, e.g.
  # ["shepherd.example.com"]. Required alongside parentRefs -- an HTTPRoute
  # with neither routes nothing.
  hostnames: []
  # parentRefs: the Gateway(s) this HTTPRoute attaches to, e.g.
  # [{name: my-gateway, namespace: gateway-system}]. Required alongside
  # hostnames.
  parentRefs: []

ingress:
  # enabled: turn on to render the Ingress below. Off by default: like
  # `route` above, it needs infrastructure (an Ingress controller) a vanilla
  # cluster does not have.
  enabled: false
  # className: the IngressClass to use, e.g. "nginx". Empty lets the
  # cluster's default IngressClass apply.
  className: ""
  # hosts: a list of {host, paths: [{path, pathType}]} entries, the standard
  # Kubernetes Ingress rule shape. Empty renders an Ingress with no rules,
  # which routes nothing.
  hosts: []
  # tls: standard Kubernetes Ingress TLS entries ({hosts, secretName}), for
  # terminating TLS at the Ingress. Empty configures no TLS here.
  tls: []

# ---------------------------------------------------------------------------
# Metrics
#
# Shepherd serves Prometheus metrics on a SEPARATE listener from the API
# (config.server.metrics_listen, default :9090). /metrics on the main port is
# deliberately 404-guarded, so anything scraping :8080/metrics gets nothing —
# which is what the ServiceMonitor here used to do.
#
# `enabled` controls the metrics Service and its container port. It is on by
# default: the listener runs regardless, and a ClusterIP Service in front of it
# exposes nothing outside the cluster. Turn it off only if you have a policy
# against unscraped Services existing.
# ---------------------------------------------------------------------------
metrics:
  # enabled: render the metrics Service and expose
  # config.server.metrics_listen's port on it. The listener itself always
  # runs regardless; this only controls whether a Service fronts it.
  enabled: true
  serviceMonitor:
    # Requires the Prometheus Operator's CRDs. Off by default because a
    # ServiceMonitor on a cluster without them fails the install.
    enabled: false
    # labels the Prometheus Operator selects ServiceMonitors by — commonly
    # something like `release: kube-prometheus-stack`. Check your Prometheus
    # resource's serviceMonitorSelector; without a matching label the
    # ServiceMonitor is created and quietly ignored.
    labels: {}
    # interval: Prometheus scrape interval for this target. Empty uses the
    # Prometheus Operator's own default.
    interval: "30s"
    # scrapeTimeout: how long Prometheus waits for a scrape before giving up.
    # Empty uses the Prometheus Operator's own default.
    scrapeTimeout: "10s"
    # relabelings: standard Prometheus Operator relabeling rules applied
    # before scraping (e.g. to rewrite target labels). Empty applies none.
    relabelings: []
    # metricRelabelings: standard Prometheus Operator relabeling rules
    # applied to each scraped metric after collection (e.g. to drop or
    # rename series). Empty applies none.
    metricRelabelings: []

# serviceAccount: the identity Shepherd's pods run as.
#
# The chart grants no RBAC — Shepherd never calls the Kubernetes API — so the
# account exists to be annotated. That is how a pod reaches a managed database
# without a static credential: an EKS IRSA role ARN or a GKE Workload Identity
# binding goes in `annotations` below, and the token it produces is what
# authenticates to RDS or Cloud SQL.
serviceAccount:
  # create: false to use an account your platform team already manages, in which
  # case `name` is required and must already exist — the migration Job runs as a
  # pre-install hook and a pod naming a missing ServiceAccount is refused.
  create: true
  # name: empty means the release's fullname.
  name: ""
  # annotations: e.g.
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/shepherd
  #   iam.gke.io/gcp-service-account: shepherd@project.iam.gserviceaccount.com
  annotations: {}

# resources: CPU/memory requests and limits for the Shepherd container. Empty
# means unbounded, which is deliberate for a first install — but set it before
# you rely on the deployment: requests are what the scheduler places on, and
# `autoscaling` below REQUIRES resources.requests.cpu (a CPU-utilization HPA is
# a percentage of the request, so with no request it can never scale). The chart
# refuses to render an HPA without one rather than leaving you a silently
# broken autoscaler.
resources: {}
# nodeSelector: constrain Shepherd's pods to nodes carrying these labels.
nodeSelector: {}
# tolerations: let Shepherd's pods schedule onto tainted nodes.
tolerations: []
# affinity: pod/node affinity rules, verbatim. Use this to spread replicas
# across zones — nothing here does that for you.
affinity: {}
# priorityClassName: the PriorityClass Shepherd's pods run at, deciding what
# gets evicted first under node pressure.
priorityClassName: ""
# podAnnotations: extra annotations on the Shepherd pod template. Merged with
# the chart's own checksum/config and checksum/secret annotations.
podAnnotations: {}
# extraEnv: additional container env vars, verbatim (a list of Kubernetes
# EnvVar). This is where SHEPHERD_DATABASE_URL goes when you point Shepherd at
# a database you already run and are not using `secrets`/`existingSecret`.
extraEnv: []

# autoscaling: hand the replica count to a HorizontalPodAutoscaler.
#
# When enabled, `replicas` above is no longer rendered at all — otherwise every
# `helm upgrade` would snap the Deployment back to it, undoing whatever the
# autoscaler had decided. The PodDisruptionBudget follows minReplicas rather
# than `replicas` for the same reason.
#
# REQUIRES resources.requests.cpu; see the note there.
autoscaling:
  # enabled: hand the replica count to a HorizontalPodAutoscaler. See the
  # block comment above -- REQUIRES resources.requests.cpu.
  enabled: false
  # minReplicas: the floor the HPA will not scale below.
  minReplicas: 2
  # maxReplicas: the ceiling the HPA will not scale above.
  maxReplicas: 10
  # targetCPUUtilizationPercentage: the average CPU utilization, as a
  # percentage of resources.requests.cpu, the HPA scales to maintain.
  targetCPUUtilizationPercentage: 80

# networkPolicy: a NetworkPolicy for SHEPHERD's own pods (the simulator has its
# own, far stricter one under `simulator.networkPolicy`).
#
# Enabled, it allows ingress from any namespace in the cluster to the API port
# and the metrics port, and allows all egress — Shepherd has to reach your
# database, your identity provider and your git remotes, and the set of those is
# not something the chart can know. Restrict egress at the CNI level if you need
# FQDN policies. Off by default because a policy is only meaningful on a CNI
# that enforces them.
networkPolicy:
  # enabled: render a NetworkPolicy for Shepherd's own pods. See the block
  # comment above for what it allows and why it defaults off.
  enabled: false

# -----------------------------------------------------------------------------
# S3 sandbox simulator (VB-1 §6.4) — ENABLED BY DEFAULT since v0.0.1, after
# both containment gates closed (docs/project-status.md F5: B-CONTAIN-1 fixed
# and red/green-proven; NetworkPolicy enforcement verified in a real cluster by
# e2e/k8s/simulator_containment_test.go's probes and kill probe).
#
# TO DISABLE: set `simulator.enabled: false` below (or --set on install) —
# nothing simulator-related renders, and shepherd's config is not wired to it.
# The compose stacks keep their opt-in `sim` profile: that is test-environment
# design (the default `make e2e` deliberately exercises the simulator-absent
# path), not the product default.
#
# When enabled, shepherd's config is wired to this chart's simulator Service
# automatically unless you set `config.simulator` yourself — an explicit
# config.simulator block always wins verbatim (see templates/configmap.yaml).
#
# It runs USER-AUTHORED Alloy configuration. Every control below is load-bearing,
# not decoration, and every one is asserted by deploy/helm/chart_test.go so it
# cannot regress silently:
#   - automountServiceAccountToken: false on its ServiceAccount. Defense in
#     depth, not the only gate — internal/simsvc.Config.SATokenPath makes the
#     binary itself refuse to start if a token is mounted anyway.
#   - a bearer token (simulator.token below) on the control API. Without one
#     POST /v1/runs was reachable by anything that could route to the Pod at
#     all; every install now authenticates it, from one of three sources.
#   - a default-deny egress NetworkPolicy. The sandboxed Alloy is a CHILD
#     PROCESS of shepherd-simulator (internal/simsvc/runner.go), not a sibling
#     container, so this Pod's own network boundary IS the sandbox's boundary.
#     Egress is allowed only to this Pod's own harness ports (the capture
#     receivers shepherd-simulator itself serves) — nothing else, including
#     cluster DNS (D10: every harness endpoint the sandbox needs is dialled by
#     loopback IP, so it has no legitimate reason to resolve a name at all),
#     the rest of the cluster, or the internet.
#   - non-root securityContext, every capability dropped, no privilege
#     escalation, a read-only root filesystem (the run scratch directory is an
#     emptyDir mounted over /tmp).
#   - CPU/memory limits, so one runaway sandboxed config cannot starve the node.
#   - what this chart CANNOT set: a per-Pod process/PID limit. Kubernetes has
#     no PodSpec field for one (unlike the compose stacks' `pids_limit`) — it
#     is a kubelet-level setting (`podPidsLimit` in KubeletConfiguration, or
#     `--pod-max-pids`) that belongs to the cluster operator, not this chart.
#     Mitigating factors: the sandboxed Alloy is one process (internal/simsvc
#     runs it directly, no shell fork-bomb surface), and the CPU/memory limits
#     above already bound a runaway config's other resource costs.
#
# See docs/visual-builder-design-VB1.md §6.4 and docs/archive/reviews/s3-sandbox-security-findings.md
# (finding H5) for why each of these exists.
simulator:
  # enabled: turn the S3 sandbox simulator on or off. See the block comment
  # above -- ON by default since v0.0.1, after both containment gates closed.
  enabled: true
  image:
    # registry: the simulator image's registry, mirroring image.registry
    # above. Set to "" to use a bare/local name.
    registry: "ghcr.io/procoduck"
    # repository: the simulator image name, combined with registry above to
    # form the pulled image.
    repository: shepherd-simulator
    # tag: empty means the chart's own appVersion, same convention as
    # image.tag above.
    tag: ""
    # pullPolicy: standard Kubernetes pull policy, mirroring
    # image.pullPolicy above.
    pullPolicy: IfNotPresent
    # pullSecrets for the simulator image specifically. Separate from
    # image.pullSecrets because the two images can come from different
    # registries; set both if they come from the same private one.
    pullSecrets: []
  # replicas: how many simulator Deployment pods run behind the simulator
  # Service and its control API.
  replicas: 1
  resources:
    requests:
      # cpu: minimum CPU reserved for the sandboxed Alloy process and its
      # harness.
      cpu: 250m
      # memory: minimum memory reserved, same reasoning as cpu above.
      memory: 256Mi
    limits:
      # cpu: the hard CPU ceiling -- part of §6.4's defense against a
      # runaway sandboxed config; see the block comment above.
      cpu: "1"
      # memory: the hard memory ceiling, same reasoning as cpu above.
      memory: 512Mi
  # allowedHosts overrides SIM_ALLOWED_HOSTS, the endpoint allowlist that is
  # §6.4's defense-in-depth check ON TOP OF the NetworkPolicy. Empty uses the
  # service's own built-in default (its own hostname plus localhost).
  allowedHosts: []
  # token authenticates the control API both Deployments talk over: the
  # simulator reads it as SIM_TOKEN, Shepherd as SHEPHERD_SIMULATOR_TOKEN /
  # config.simulator.token, and both always read the SAME Secret + key
  # (shepherd.simulatorTokenSecretName in _helpers.tpl resolves it once).
  # Precedence, highest first:
  #   1. existingSecret + key -- bring your own Secret (vault operator,
  #      GitOps-managed, whatever already exists), unmanaged by this chart.
  #   2. externalSecrets.enabled -- a Password generator + ExternalSecret this
  #      chart renders in templates/externalsecret.yaml, the same pattern the
  #      runtime bootstrap values already use.
  #   3. otherwise, the chart generates its own Secret
  #      (templates/secret-simulator-token.yaml) with lookup reuse: `value`
  #      pins it to a literal, and left empty the chart generates a random
  #      token ONCE and reuses it on every later `helm upgrade` -- see that
  #      template for the caveat under GitOps tooling with no live cluster to
  #      look up against.
  token:
    # value: pin the shared bearer token to a literal, e.g. for a
    # fixture-driven parity check. Empty lets the chart generate and reuse a
    # random one instead -- see the block comment above for the full
    # precedence.
    value: ""
    # existingSecret: name of a Secret you already manage holding the token.
    # Highest-precedence option -- see the block comment above.
    existingSecret: ""
    # key: the key within existingSecret (or the chart-generated Secret)
    # that holds the token value.
    key: "token"
  # podAnnotations: extra annotations on the simulator pod template,
  # mirroring podAnnotations below but scoped to the simulator Deployment only.
  podAnnotations: {}
  # nodeSelector: constrain simulator pods to nodes carrying these labels,
  # mirroring nodeSelector below but scoped to the simulator Deployment only.
  nodeSelector: {}
  # tolerations: let simulator pods schedule onto tainted nodes, mirroring
  # tolerations below but scoped to the simulator Deployment only.
  tolerations: []
  # affinity: pod/node affinity rules for the simulator pods, mirroring
  # affinity below but scoped to the simulator Deployment only.
  affinity: {}
  networkPolicy:
    # extraEgress lets an operator open one additional narrow hole (e.g. a
    # split-horizon internal DNS server that is not kube-dns) without editing
    # the template. Empty by default: the harness is everything the sandbox
    # needs, by design.
    extraEgress: []
