image:
  # Default to the released images; set registry: "" to use a bare/local name.
  registry: "ghcr.io/procoduck"
  repository: shepherd
  # Empty means the chart's own appVersion, so a given chart version installs
  # the Shepherd release it was published and tested with. Override only to
  # pin something else deliberately.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Shepherd keeps no state outside PostgreSQL, so replicas are free to add and
# safe to lose. Two by default so a node drain is not an outage; the
# PodDisruptionBudget below assumes at least two.
replicas: 2

# The Service in front of Shepherd. ClusterIP by default: an Ingress or
# HTTPRoute (both below) is the intended way in for a real deployment.
#
# type is exposed because the template hardcoded ClusterIP, which left no way
# to reach Shepherd on a bare cluster without editing the rendered object by
# hand — kind and other local clusters have no ingress controller, and that is
# exactly where someone is trying the chart for the first time.
service:
  type: ClusterIP
  port: 8080
  # Only used when type is NodePort. Leave empty to let Kubernetes pick one
  # from the node port range.
  nodePort: ""

config:
  server:
    listen: ":8080"
    # Metrics listen on their own port; /metrics is never served on `listen`.
    # The container port, the metrics Service, and the ServiceMonitor are all
    # derived from this value, so changing it here is enough.
    metrics_listen: ":9090"
    base_url: "https://shepherd.example.internal"
    # The beacon (docs/gateway-tier-plan.md D6) serves every claimed collector
    # a small baseline pipeline that reports which components it is running
    # and whether they are healthy — component names only, never config text
    # and never raw samples — and mounts an ingest endpoint at
    # /beacon/v1/write authenticated by the same agent token everything else
    # uses.
    #
    # It is ON by default and that is deliberate: the collector nobody knows
    # about is exactly the one that would never opt in. Set this to true to
    # turn it off entirely — no endpoint is mounted and no baseline is served.
    # Opting out is offered because the beacon stores inventory and accepts
    # writes, and an operator who cannot answer for that yet should be able to
    # say no without downgrading.
    beacon_disabled: false
  database:
    max_conns: 20
  # ---------------------------------------------------------------------------
  # OIDC single sign-on (OPTIONAL)
  #
  # Leaving `issuer` unset does NOT mean "no SSO": it hands configuration to
  # the app admins, who can point Shepherd at a provider from the UI
  # (Admin -> Single sign-on) without a rollout. Setting `issuer` here takes
  # that ability away — chart config always wins, and the UI shows the values
  # read-only. Choose deliberately: declare it here if your identity provider
  # belongs in git, leave it out if you would rather bootstrap through the
  # local admin account and configure SSO in the product.
  #
  # The claim fields below default to Microsoft Entra ID's shapes, which is
  # what this chart has always assumed. A non-Entra provider MUST override at
  # least provider, subject_claim, and groups_claim.
  # ---------------------------------------------------------------------------
  oidc:
    scopes: ["openid", "profile", "email"]
    # issuer: "https://login.microsoftonline.com/<tenant-id>/v2.0"
    # client_id: ""                  # client_secret via SHEPHERD_OIDC_CLIENT_SECRET
    # redirect_url: "https://shepherd.example.internal/auth/callback"
    #
    # provider: one of entra | okta | google | auth0 | keycloak | cognito |
    # gitlab | authentik | onelogin | generic. It sets the use_graph_groups
    # default and labels the deployment; it does not change any value spelled
    # out below.
    # provider: "entra"
    # display_name: "Microsoft"      # sign-in button label
    #
    # Claim mapping. subject_claim defaults to "oid" (Entra's object ID);
    # every other provider needs "sub".
    # subject_claim: "oid"
    # email_claim: "email"
    # name_claim: "name"
    # groups_claim: "groups"         # "cognito:groups" for Cognito, "groups_direct" for GitLab
    #
    # use_graph_groups resolves membership through Microsoft Graph instead of
    # the ID token claim. Defaults to true for provider "entra" and false
    # otherwise. Keep it on for Entra: the groups claim is dropped entirely
    # once a user is in more than ~200 groups.
    # use_graph_groups: true
  auth:
    session_ttl: "8h"
    #
    # app_admin_group_ids: the groups whose members are APPLICATION ADMINS —
    # full access everywhere, including the Admin -> Single sign-on page. This
    # is the single most important auth value in the chart and it has no
    # default: leave it empty and no one who signs in through your identity
    # provider can administer anything.
    #
    # The values are matched against whatever your provider puts in the groups
    # claim (oidc.groups_claim above), so their FORM depends on the provider:
    #   - Microsoft Entra ID -> group object GUIDs
    #   - Okta / Keycloak / Auth0 / authentik / OneLogin -> group names
    #   - GitLab -> full paths, e.g. "acme/platform"
    #   - AWS Cognito -> user-pool group names (claim is "cognito:groups")
    # The same applies to each org's admin/reader group. Nothing here requires
    # a GUID; only Entra happens to emit one.
    #
    # app_admin_group_ids:
    #   - "11111111-2222-3333-4444-555555555555"   # Entra
    #   - "platform-admins"                        # everyone else
    # -----------------------------------------------------------------------
    # Local users
    #
    # Shepherd can run with no identity provider at all. On first start, when
    # the users table is empty, it creates one administrator; after that,
    # accounts are managed in the UI under Admin -> Users.
    #
    # Set the password through the Secret (SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD),
    # NEVER here — this block renders into a ConfigMap. If you leave it unset
    # the account is created as admin/admin and Shepherd refuses to serve
    # anything to that session until the password is changed, so the default is
    # only ever good for the one action that replaces it.
    #
    #   SHEPHERD_BOOTSTRAP_ADMIN_LOGIN     default "admin"
    #   SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD  no default; see above
    #
    # Both are read only when the users table is empty, so they cannot resurrect
    # a deleted account or reset an existing password on a later rollout.
    # -----------------------------------------------------------------------
  graph:
    base_url: "https://graph.microsoft.com"
  agent:
    inactive_after: "5m"
    delete_after: "24h"
  validate:
    alloy_binary: "/usr/local/bin/alloy"
    stability_level: "experimental"
    timeout: "10s"
  gitsync:
    tick: "3m"
  # ---------------------------------------------------------------------------
  # Tracing (OPTIONAL — off by default)
  #
  # `endpoint` is the switch. Unset means tracing is off entirely: no provider
  # is installed, no exporter runs, and the instrumentation costs nothing, so
  # leaving this alone is free. Set it and Shepherd exports OTLP spans for
  # every HTTP request and Connect RPC it serves.
  #
  # Health probes (/healthz, /readyz), the metrics scrape, and static SPA
  # assets are never traced — otherwise a backend fills with Kubernetes
  # liveness checks.
  # ---------------------------------------------------------------------------
  tracing:
    # Set enabled: true AND an endpoint. Enabled with no endpoint is reported
    # as a misconfiguration in the logs rather than silently doing nothing —
    # an empty trace backend with no explanation is the worst way to find out.
    enabled: false
    endpoint: ""            # e.g. "opentelemetry-collector.observability.svc:4317"
    protocol: "grpc"        # "grpc" (port 4317) or "http" (port 4318)
    insecure: true          # normal for an in-cluster collector over the pod network
    # sample_ratio applies only to traces Shepherd ROOTS; an incoming sampling
    # decision is always honoured. Collectors poll continuously, so 1.0 here is
    # a lot of spans.
    sample_ratio: 0.1
    service_name: "shepherd"
    # service_version: ""   # set it to correlate traces with releases
  log:
    level: "info"
    format: "json"

# -----------------------------------------------------------------------------
# CloudNativePG: let the chart provision the database.
#
# OFF by default, and Shepherd is happy either way — point
# SHEPHERD_DATABASE_URL at an RDS, a Cloud SQL, or any Postgres you already run
# and leave this alone. Turn it on and the chart renders a
# postgresql.cnpg.io/v1 Cluster, and wires Shepherd's database URL to the `uri`
# key of the `<cluster>-app` Secret that CNPG generates. You never write a
# connection string.
#
# Requires the CloudNativePG operator and its CRDs to be installed in the
# cluster already; the chart does not install operators.
#
# The Cluster renders as a pre-install/pre-upgrade hook so it exists before the
# migration Job runs. Three consequences worth knowing:
#   - `helm uninstall` does NOT delete it. Hook resources are not tracked in
#     the release, which for the thing holding all your data is the right way
#     round. Remove it deliberately with `kubectl delete cluster <name>`.
#   - Once it exists, changes to cnpg.* no longer reach it: the chart skips
#     rendering a Cluster that is already there, because a hook Helm re-renders
#     is a hook Helm first DELETES. Edit a live cluster with `kubectl edit
#     cluster <name>`, which is the operator's own interface for it.
#   - On a first install the migration Job may fail a few times while Postgres
#     is still coming up. That is expected and it retries — see
#     migrations.job.backoffLimit.
cnpg:
  enabled: false
  # Cluster name. Empty means "<release>-db".
  name: ""
  # Two gives you a primary and one standby, which is the minimum CloudNativePG
  # needs for automated failover. Raise it for more read capacity or headroom.
  instances: 2
  storage:
    size: 10Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  # The database and the role that owns it. Shepherd needs no superuser.
  database: shepherd
  owner: shepherd
  # Pinning the image is optional; empty lets the operator choose the version
  # it was built against, which is the one it knows how to upgrade.
  imageName: ""
  resources: {}
  # Merged verbatim into the Cluster spec, for anything this chart does not
  # surface: backup, monitoring, affinity, postgresql.parameters, and so on.
  # See the CloudNativePG API reference.
  extraSpec: {}

# -----------------------------------------------------------------------------
# External Secrets Operator: let the cluster generate the bootstrap secrets.
#
# OFF by default. Enabled, the chart renders two Password generators and an
# ExternalSecret that produces the Secret Shepherd reads — so the encryption
# key and the first administrator's password are generated in-cluster and never
# pass through your shell, your values file, or your terminal history.
#
# Requires the External Secrets Operator and its CRDs; the chart does not
# install operators. No SecretStore is needed: a generator is the source.
#
# refresh_interval is "0" and MUST stay "0". These are not rotatable
# credentials: regenerating the encryption key would leave every git credential
# and OIDC client secret already stored in the database undecryptable, with no
# error at the moment it happens. deletionPolicy is Retain for the same reason
# — uninstalling the release must not take the key with it.
#
# Both only hold while the ExternalSecret itself survives, so the chart also
# skips rendering it once it exists. Changing externalSecrets.* after the first
# install therefore has no effect; delete the ExternalSecret deliberately if you
# genuinely want it regenerated, understanding that a new key orphans every
# credential the old one encrypted.
externalSecrets:
  enabled: false
  # API versions, exposed because ESO has moved them before. These defaults
  # match ESO v1.x.
  apiVersion: external-secrets.io/v1
  generatorApiVersion: generators.external-secrets.io/v1alpha1
  # Do not change. See the note above.
  refreshInterval: "0"
  encryptionKey:
    # 32 characters, base64-encoded by the ExternalSecret template into the
    # 32 bytes Shepherd requires. DO NOT CHANGE: Shepherd rejects any other
    # length outright, so a different value here produces an instance that
    # cannot start. Exposed only because the generator requires the field.
    length: 32
  bootstrapAdmin:
    # Generate the first administrator's password too. Turn this off if you
    # would rather set SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD yourself.
    enabled: true
    length: 24
    # Read it once it exists with:
    #   kubectl get secret <release>-secrets \
    #     -o jsonpath='{.data.SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD}' | base64 -d
    login: admin

existingSecret: ""
# secrets: key-value pairs rendered into a Kubernetes Secret and injected as environment variables.
# Keys must match the SHEPHERD_* env var names. Example for local admin password hash:
#   secrets:
#     SHEPHERD_DATABASE_URL: "postgres://..."
#     SHEPHERD_SECURITY_ENCRYPTION_KEY: "base64-32-bytes"
#     SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD: "choose-something"
# NEVER put SHEPHERD_BOOTSTRAP_ADMIN_PASSWORD in the config: block above — that renders
# into a ConfigMap, which is not a place for a password.
secrets: {}

migrations:
  job:
    enabled: true
    # How many times the migration Job may fail before the release does. The
    # default covers a database that is still being provisioned -- see the Job
    # template. Lower it if you would rather fail fast against a database that
    # is always already there.
    backoffLimit: 6

# Gateway API HTTPRoute. OFF by default, like `ingress` below: it needs the
# Gateway API CRDs, which are not present on a vanilla cluster, so defaulting it
# on made a plain `helm install` fail with "no matches for kind HTTPRoute".
# Templating could never catch that — `helm template` does not check whether a
# Kind exists — and every values file in the repo already set it to false, which
# is how the broken default survived. Enable it deliberately, and set
# parentRefs/hostnames when you do: an HTTPRoute with neither routes nothing.
route:
  enabled: false
  hostnames: []
  parentRefs: []

ingress:
  enabled: false
  className: ""
  hosts: []
  tls: []

# ---------------------------------------------------------------------------
# Metrics
#
# Shepherd serves Prometheus metrics on a SEPARATE listener from the API
# (config.server.metrics_listen, default :9090). /metrics on the main port is
# deliberately 404-guarded, so anything scraping :8080/metrics gets nothing —
# which is what the ServiceMonitor here used to do.
#
# `enabled` controls the metrics Service and its container port. It is on by
# default: the listener runs regardless, and a ClusterIP Service in front of it
# exposes nothing outside the cluster. Turn it off only if you have a policy
# against unscraped Services existing.
# ---------------------------------------------------------------------------
metrics:
  enabled: true
  serviceMonitor:
    # Requires the Prometheus Operator's CRDs. Off by default because a
    # ServiceMonitor on a cluster without them fails the install.
    enabled: false
    # labels the Prometheus Operator selects ServiceMonitors by — commonly
    # something like `release: kube-prometheus-stack`. Check your Prometheus
    # resource's serviceMonitorSelector; without a matching label the
    # ServiceMonitor is created and quietly ignored.
    labels: {}
    interval: "30s"
    scrapeTimeout: "10s"
    relabelings: []
    metricRelabelings: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
podAnnotations: {}
extraEnv: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

networkPolicy:
  enabled: false

# -----------------------------------------------------------------------------
# S3 sandbox simulator (VB-1 §6.4) — ENABLED BY DEFAULT since v0.0.1, after
# both containment gates closed (docs/project-status.md F5: B-CONTAIN-1 fixed
# and red/green-proven; NetworkPolicy enforcement verified in a real cluster by
# e2e/k8s/simulator_containment_test.go's probes and kill probe).
#
# TO DISABLE: set `simulator.enabled: false` below (or --set on install) —
# nothing simulator-related renders, and shepherd's config is not wired to it.
# The compose stacks keep their opt-in `sim` profile: that is test-environment
# design (the default `make e2e` deliberately exercises the simulator-absent
# path), not the product default.
#
# When enabled, shepherd's config is wired to this chart's simulator Service
# automatically unless you set `config.simulator` yourself — an explicit
# config.simulator block always wins verbatim (see templates/configmap.yaml).
#
# It runs USER-AUTHORED Alloy configuration. Every control below is load-bearing,
# not decoration, and every one is asserted by deploy/helm/chart_test.go so it
# cannot regress silently:
#   - automountServiceAccountToken: false on its ServiceAccount. Defense in
#     depth, not the only gate — internal/simsvc.Config.SATokenPath makes the
#     binary itself refuse to start if a token is mounted anyway.
#   - a default-deny egress NetworkPolicy. The sandboxed Alloy is a CHILD
#     PROCESS of shepherd-simulator (internal/simsvc/runner.go), not a sibling
#     container, so this Pod's own network boundary IS the sandbox's boundary.
#     Egress is allowed only to this Pod's own harness ports (the capture
#     receivers shepherd-simulator itself serves) and to cluster DNS; nothing
#     else, including the rest of the cluster and the internet.
#   - non-root securityContext, every capability dropped, no privilege
#     escalation, a read-only root filesystem (the run scratch directory is an
#     emptyDir mounted over /tmp).
#   - CPU/memory limits, so one runaway sandboxed config cannot starve the node.
#
# See docs/visual-builder-design-VB1.md §6.4 and docs/archive/reviews/s3-sandbox-security-findings.md
# (finding H5) for why each of these exists.
simulator:
  enabled: true
  image:
    registry: "ghcr.io/procoduck"
    repository: shepherd-simulator
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # allowedHosts overrides SIM_ALLOWED_HOSTS, the endpoint allowlist that is
  # §6.4's defense-in-depth check ON TOP OF the NetworkPolicy. Empty uses the
  # service's own built-in default (its own hostname plus localhost).
  allowedHosts: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  networkPolicy:
    # extraEgress lets an operator open one additional narrow hole (e.g. a
    # split-horizon internal DNS server that is not kube-dns) without editing
    # the template. Empty by default: the harness is everything the sandbox
    # needs, by design.
    extraEgress: []
