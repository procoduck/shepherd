apiVersion: v2
name: shepherd
description: Self-hosted Grafana Alloy fleet manager
type: application
version: 0.19.0
appVersion: "0.15.0"
# The chart renders autoscaling/v2 (HPA), policy/v1 (PodDisruptionBudget) and
# batch/v1 Jobs with a pod-level seccompProfile — all stable since 1.25. The
# floor is what the Kubernetes e2e suite actually proves: 1.32, the lowest
# version the suite's NGF (Gateway API router, chart 2.7.x) supports, and above
# CloudNativePG's 1.29 (cnpg.enabled=true). 1.29–1.31 were claimed until chart
# 0.19.0 but no longer exercised; all three are end-of-life upstream. Helm
# cannot express a floor that only applies when a value is set, so the chart
# states one supported floor rather than a conditional one.
kubeVersion: ">=1.32.0-0"
keywords:
  - alloy
  - grafana
  - observability
  - fleet
home: https://github.com/procoduck/shepherd
sources:
  - https://github.com/procoduck/shepherd
# icon: deliberately absent. `helm lint` recommends one and Artifact Hub shows
# it, but the repo has no icon asset yet -- and a URL that 404s renders worse in
# a chart listing than no icon at all. Add the file, then add the line.
maintainers:
  - name: procoduck
    url: https://github.com/procoduck
