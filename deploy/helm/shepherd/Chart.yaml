apiVersion: v2
name: shepherd
description: Self-hosted Grafana Alloy fleet manager
type: application
version: 0.12.0
appVersion: "0.8.0"
# The chart renders autoscaling/v2 (HPA), policy/v1 (PodDisruptionBudget) and
# batch/v1 Jobs with a pod-level seccompProfile — all stable since 1.25. The
# floor is 1.29 rather than 1.25 because the optional CloudNativePG database
# path (cnpg.enabled=true) needs it, and Helm cannot express a floor that only
# applies when a value is set; a single global floor is the honest contract, so
# it is set to the higher of the two. A default install (external Postgres) is
# happy on anything from 1.25, but the chart states one supported floor rather
# than a conditional one.
kubeVersion: ">=1.29.0-0"
keywords:
  - alloy
  - grafana
  - observability
  - fleet
home: https://github.com/procoduck/shepherd
sources:
  - https://github.com/procoduck/shepherd
# icon: deliberately absent. `helm lint` recommends one and Artifact Hub shows
# it, but the repo has no icon asset yet -- and a URL that 404s renders worse in
# a chart listing than no icon at all. Add the file, then add the line.
maintainers:
  - name: procoduck
    url: https://github.com/procoduck
