syntax = "proto3";

package shepherd.mgmt.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "shepherd/gen/shepherd/mgmt/v1;mgmtv1";

// FleetService covers an org's collectors, their labels and assignments,
// matcher attributes, and reconciliation. Reads require org viewer; writes
// (labels, assignments) require org admin.
service FleetService {
  rpc ListCollectors(ListCollectorsRequest) returns (ListCollectorsResponse) {}
  rpc GetCollector(GetCollectorRequest) returns (Collector) {}
  rpc GetServedConfig(GetServedConfigRequest) returns (GetServedConfigResponse) {}
  // GetReconciliation returns the collector's declared-vs-served-vs-observed
  // drift findings (W6, #110). Org viewer, like GetServedConfig.
  rpc GetReconciliation(GetReconciliationRequest) returns (GetReconciliationResponse) {}
  rpc ListAssignments(ListAssignmentsRequest) returns (ListAssignmentsResponse) {}
  rpc CreateAssignment(CreateAssignmentRequest) returns (CreateAssignmentResponse) {}
  rpc DeleteAssignment(DeleteAssignmentRequest) returns (DeleteAssignmentResponse) {}
  rpc ListAttributes(ListAttributesRequest) returns (ListAttributesResponse) {}
  rpc SetCollectorLabel(SetCollectorLabelRequest) returns (CollectorLabelsResponse) {}
  rpc DeleteCollectorLabel(DeleteCollectorLabelRequest) returns (CollectorLabelsResponse) {}
  // RenderChartValues renders the Helm values that connect a cluster's
  // Grafana k8s-monitoring collectors to this Shepherd (W9,
  // internal/chartvalues). Org admin: it decides which cluster name joins
  // the org's fleet. Writes nothing.
  rpc RenderChartValues(RenderChartValuesRequest) returns (RenderChartValuesResponse) {}
}

// CollectorInstance is one running Alloy process reporting as a logical Collector.
message CollectorInstance {
  string name = 1;
  string alloy_version = 2;
  string os = 3;
  google.protobuf.Timestamp last_seen = 4;
  string remote_config_status = 5;
  string remote_config_error = 6;
  // local_attributes is a caller-supplied JSON object of arbitrary shape.
  google.protobuf.Struct local_attributes = 7;
}

// Collector is a logical collector, one per cluster and role. The scalar
// remote_config_status/remote_config_error/last_seen/alloy_version/
// local_attributes fields are rolled up from the collector's most recently
// reporting instance; instances is populated only on GetCollector.
message Collector {
  string id = 1;
  string cluster_id = 2;
  string cluster = 3;
  string role = 4;
  // org_id is only populated when an app admin lists across all orgs.
  string org_id = 5;
  string remote_config_status = 6;
  string remote_config_error = 7;
  google.protobuf.Timestamp last_seen = 8;
  string alloy_version = 9;
  google.protobuf.Struct local_attributes = 10;
  repeated CollectorInstance instances = 11;
  // UI-managed grouping labels, independent of Alloy attributes and pipeline matching.
  map<string, string> labels = 12;
  // last_refused_reason is set while the agent API's latest refusal of a poll
  // for this collector is newer than its last successful poll (instances are
  // never written on a refused poll, so last_seen and remote_config_status
  // still describe the last poll that passed). One of "token_unbound",
  // "claim_denied" (cluster not permitted, or claimed by another org) or
  // "role_denied"; empty when the collector is not being refused. A string,
  // per this repo's enum-like-field rule.
  string last_refused_reason = 13;
  // last_refused_at is when that refusal was recorded (refreshed at most once
  // per refusal-log window while refusals continue); unset with the reason.
  google.protobuf.Timestamp last_refused_at = 14;
  // version_warning is what the agent API's version check of this
  // collector's served config found (#375), unset when it found nothing.
  // Stage 3 refuses a save that uses an item missing from any active
  // instance's Alloy version, but instances change after the save (an older
  // pod joins) and serving continues then; this is where that shows. Updated
  // when the served config or the active instances' versions change, and
  // audited (collector.version_warning) once per change, never per poll.
  CollectorVersionWarning version_warning = 15;
}

// CollectorVersionWarning is Collector.version_warning.
message CollectorVersionWarning {
  // findings are human-readable, one per finding, each naming the Alloy
  // version it is about: an item missing from that version's schema, a
  // version checked against the pinned schema only (no shipped schema covers
  // it, or none was reported), or a component below general availability
  // that needs a --stability.level flag on the collector.
  repeated string findings = 1;
  // mismatch is true when a finding is a missing item: an instance running
  // that version will most likely reject the config and keep its last one.
  // false when every finding is a note.
  bool mismatch = 2;
  // since is when these findings were first recorded.
  google.protobuf.Timestamp since = 3;
}

message SetCollectorLabelRequest {
  string org_id = 1;
  string collector_id = 2;
  string key = 3;
  string value = 4;
}

message DeleteCollectorLabelRequest {
  string org_id = 1;
  string collector_id = 2;
  string key = 3;
}

message CollectorLabelsResponse {
  map<string, string> labels = 1;
}

message ListCollectorsRequest {
  string org_id = 1;
}

message ListCollectorsResponse {
  repeated Collector items = 1;
  int32 total = 2;
}

message GetCollectorRequest {
  string org_id = 1;
  string id = 2;
}

message GetServedConfigRequest {
  string org_id = 1;
  string id = 2;
}

// GetServedConfigResponse is the merged config currently served to a collector.
// content and hash are "" when no serve-cache entry exists yet.
message GetServedConfigResponse {
  string content = 1;
  string hash = 2;
  google.protobuf.Timestamp computed_at = 3;
}

message GetReconciliationRequest {
  string org_id = 1;
  string id = 2;
}

// Finding is one reconciliation contradiction (internal/reconcile.Finding).
// A finding always names exactly two disagreeing sources.
message Finding {
  // kind is "role_signal_mismatch" (declared<->served),
  // "role_signal_excluded" (declared<->served: role enforcement kept a
  // matched pipeline out of the served config) or
  // "unserved_component_observed" (served<->observed). A string, per this
  // repo's enum-like-field rule.
  string kind = 1;
  // sources names the two disagreeing inputs, from "declared" | "served" |
  // "observed", in the kind's documented order.
  repeated string sources = 2;
  // summary is a human-readable sentence naming both sides' claims — safe to
  // show verbatim.
  string summary = 3;
  // pipeline_name is set for role_signal_mismatch (the served pipeline whose
  // signals violated the declared role) and role_signal_excluded (the matched
  // pipeline role enforcement left out).
  string pipeline_name = 4;
  // controller_path is set for unserved_component_observed: the beacon-reported
  // identity that matched no served pipeline.
  string controller_path = 5;
  // stale is set for unserved_component_observed: the observation is old enough
  // to be due for the beacon sweeper's expiry (evidence it WAS running, not
  // proof it still is).
  bool stale = 6;
}

message GetReconciliationResponse {
  repeated Finding findings = 1;
  // observed_known is false when the beacon has reported no component
  // inventory for this collector (never reported, or every row aged out):
  // observed state is UNKNOWN, so no findings does not mean "in sync"
  // (internal/reconcile: absence is never agreement either).
  bool observed_known = 2;
}

message ListAssignmentsRequest {
  string org_id = 1;
  string collector_id = 2;
}

// Assignment mirrors internal/store/sqlc: GroupAssignment.
message Assignment {
  string id = 1;
  string group_id = 2;
  string group_display_name = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListAssignmentsResponse {
  repeated Assignment items = 1;
  int32 total = 2;
}

message CreateAssignmentRequest {
  string org_id = 1;
  string collector_id = 2;
  string group_id = 3;
  string group_display_name = 4;
}

message CreateAssignmentResponse {
  string id = 1;
  string group_id = 2;
}

message DeleteAssignmentRequest {
  string org_id = 1;
  string collector_id = 2;
  string group_id = 3;
}

message DeleteAssignmentResponse {}

message ListAttributesRequest {
  string org_id = 1;
}

// ListAttributesResponse maps each matcher key pipeline matching evaluates for
// the org to its distinct values: {"cluster": [...], "role": [...], ...}.
// cluster and role are always present; admin labels and agent-reported
// local_attributes appear only when the org's allow_label_matching /
// allow_local_attribute_matching flags are on, and reserved keys never do
// (#139). The key set is data-dependent, so it is modeled as a Struct rather
// than fixed fields.
message ListAttributesResponse {
  google.protobuf.Struct attributes = 1;
}

// RenderChartValuesRequest describes the cluster being connected.
message RenderChartValuesRequest {
  string org_id = 1;
  // cluster_name is the chart's cluster.name, which each collector reports
  // as its "cluster" attribute. Required.
  string cluster_name = 2;
  // roles are the collectors to wire: any of "metrics", "logs", "singleton",
  // "receiver". At least one.
  repeated string roles = 3;
  // poll_frequency is how often each collector polls Shepherd, e.g. "60s".
  // Empty means 60s.
  string poll_frequency = 4;
  // namespace is where k8s-monitoring is installed, for the rendered
  // commands only. Empty means "monitoring".
  string namespace = 5;
}

// RenderChartValuesResponse carries both values files and the commands that
// use them. Neither file contains a secret.
message RenderChartValuesResponse {
  // values_yaml wires each collector's remoteConfig to Shepherd.
  string values_yaml = 1;
  // credentials_yaml loads the agent token into each collector from the
  // Secret secret_name.
  string credentials_yaml = 2;
  // chart_version is the k8s-monitoring version these values are checked against.
  string chart_version = 3;
  // secret_command creates the Secret, with placeholders for the token.
  string secret_command = 4;
  // helm_command installs or upgrades k8s-monitoring with both files.
  string helm_command = 5;
  string secret_name = 6;
  // cluster_status is "new" (never registered), "unclaimed" (registered,
  // waiting for an app admin to claim it for this org) or "claimed" (already
  // this org's). A name claimed by another org is refused instead.
  string cluster_status = 7;
  // shepherd_url is the address the collectors poll (server.base_url).
  string shepherd_url = 8;
}
