syntax = "proto3";

package shepherd.mgmt.v1;

import "google/protobuf/timestamp.proto";
import "shepherd/mgmt/v1/common.proto";

option go_package = "shepherd/gen/shepherd/mgmt/v1;mgmtv1";

// ServiceAccountService manages machine-caller identities for
// shepherd.mgmt.v1 (docs/gateway-tier-plan.md W10): org-scoped Basic-auth
// credentials, capability-scoped propose vs apply (G12). A service account
// is never app-admin and never spans orgs — org_id is required on every
// request precisely so a compromised or misused token cannot reach past
// the one org it was minted for.
//
// Management (create/revoke) requires org admin, the same ceiling
// agent_tokens' admin-only surface already has. The capability a token
// carries is fixed at creation — there is no "upgrade a propose token to
// apply" endpoint; minting a new apply-capability token and revoking the
// old one is the only path, so a capability change is always visible as
// two distinct audited actions, not one mutation of an existing grant.
service ServiceAccountService {
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {}
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse) {}
  rpc RevokeServiceAccount(RevokeServiceAccountRequest) returns (RevokeServiceAccountResponse) {}
}

// ServiceAccount mirrors internal/store/sqlc.ServiceAccount
// (0012_teams_service_accounts). Never carries the secret — see
// CreateServiceAccountResponse for the one-time exception.
message ServiceAccount {
  string id = 1;
  string org_id = 2;
  string name = 3;
  // capability is "propose" or "apply" (G12) for ROLE_EDITOR and
  // ROLE_ADMIN, and empty for ROLE_VIEWER: a viewer never writes, so it
  // carries no capability (#362, 0042_service_account_viewer).
  string capability = 4;
  string created_by = 5;
  // status is "active" or "revoked", mirroring AgentToken's shape.
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  // Field 8 was the role as a string until step 7a (#361) made it the Role
  // enum. Reserved rather than retyped so a client still sending the string
  // is dropped as an unknown field, never reinterpreted.
  reserved 8;
  // role is ROLE_VIEWER, ROLE_EDITOR or ROLE_ADMIN (W3-1
  // 0018_service_account_role, #362 0042_service_account_viewer): the
  // tier this credential is checked against, the same way a human
  // session's org role is — see
  // authorizeServiceAccountProcedure (rpc_interceptor.go). Orthogonal to
  // capability: role decides WHICH procedures the token may reach at all,
  // capability decides whether it may write once there. Set explicitly
  // at creation (CreateServiceAccountRequest.role).
  Role role = 9;
}

message ListServiceAccountsRequest {
  string org_id = 1;
}

message ListServiceAccountsResponse {
  repeated ServiceAccount items = 1;
  int32 total = 2;
}

message CreateServiceAccountRequest {
  string org_id = 1;
  string name = 2;
  // capability is "propose" or "apply", required for ROLE_EDITOR and
  // ROLE_ADMIN. It must be empty for ROLE_VIEWER: a viewer carries no
  // capability, and one sent with it is refused with InvalidArgument.
  string capability = 3;
  // Field 4 was the role as a string until step 7a (#361) made it the Role
  // enum. Reserved rather than retyped so a client still sending the string
  // is dropped as an unknown field, never reinterpreted.
  reserved 4;
  // role is ROLE_VIEWER, ROLE_EDITOR or ROLE_ADMIN (W3-1, #362), required:
  // ROLE_UNSPECIFIED is refused with InvalidArgument. A ROLE_VIEWER account
  // reaches exactly what an org viewer reaches and never writes. Nothing
  // about the request ever implies ROLE_ADMIN (D3).
  Role role = 5;
}

// CreateServiceAccountResponse carries the one-time plaintext secret
// alongside the account's identity, mirroring CreateAgentTokenResponse's
// shape exactly (admin.proto) — the secret is never retrievable again.
message CreateServiceAccountResponse {
  string id = 1;
  string name = 2;
  string capability = 3;
  string secret = 4;
  // Field 5 was the role as a string until step 7a (#361) made it the Role
  // enum. Reserved rather than retyped so a client still sending the string
  // is dropped as an unknown field, never reinterpreted.
  reserved 5;
  // role is the tier stored (W3-1).
  Role role = 6;
}

message RevokeServiceAccountRequest {
  string org_id = 1;
  string id = 2;
}

message RevokeServiceAccountResponse {}
