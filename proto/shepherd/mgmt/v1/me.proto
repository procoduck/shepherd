syntax = "proto3";

package shepherd.mgmt.v1;

import "shepherd/mgmt/v1/common.proto";

option go_package = "shepherd/gen/shepherd/mgmt/v1;mgmtv1";

// MeService reports the authenticated actor's identity and org memberships.
service MeService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {}
}

message GetMeRequest {}

// OrgMembership is one org the actor can see, with their effective role in it.
message OrgMembership {
  string id = 1;
  string name = 2;
  string display_name = 3;
  // Field 4 was the role as a string until step 7a (#361) made it the Role
  // enum. Reserved rather than retyped so a client still sending the string
  // is dropped as an unknown field, never reinterpreted.
  reserved 4;
  // role is the actor's effective role — the same Role for a local user
  // (org_members.role) and an OIDC one (matched against the org's
  // admin/editor/viewer group), so the UI does not have to know which path
  // the session came from. Never ROLE_UNSPECIFIED: an org the actor holds no
  // role in is not listed. An app admin is reported as ROLE_ADMIN everywhere.
  Role role = 9;
  // allow_experimental_components mirrors the org setting (#114) so the visual
  // builder can show experimental components in the palette for a permitted
  // org. The server render gate is authoritative regardless of this value.
  bool allow_experimental_components = 5;
  // allow_label_matching mirrors the org setting (#139). The server match
  // gate is authoritative regardless of this value.
  bool allow_label_matching = 6;
  // allow_local_attribute_matching mirrors the org setting (#139). The server
  // match gate is authoritative regardless of this value.
  bool allow_local_attribute_matching = 7;
  // Field 8 was tenant_id, the org's single tenant identity, until an org
  // could own several tenants and prefixes (org_tenants, 0039).
  reserved 8;
  reserved "tenant_id";
  // tenants are the tenants and tenant prefixes the org owns (set by an app
  // admin — D11). Read-only: the destination form pre-fills a destination's
  // tenant from the default one, and the tenant-route form offers them.
  repeated OrgTenant tenants = 10;
}

// GetMeResponse is the caller's identity and the orgs they can see.
message GetMeResponse {
  string user_oid = 1;
  string email = 2;
  string display_name = 3;
  bool is_app_admin = 4;
  // AuthMethod is "oidc", "local", or "dev".
  string auth_method = 5;
  repeated OrgMembership orgs = 6;
}
