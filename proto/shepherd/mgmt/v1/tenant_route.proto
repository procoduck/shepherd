syntax = "proto3";

package shepherd.mgmt.v1;

import "google/protobuf/timestamp.proto";

option go_package = "shepherd/gen/shepherd/mgmt/v1;mgmtv1";

// TenantRouteService covers tenant route records for the receiver tier's
// gateway (docs/gateway-tier-plan.md §4 W4). A tenant route pairs a tenant
// with a rotatable, unguessable path segment (D9) that
// internal/gateway.RenderHTTPRoute renders into a Gateway API HTTPRoute
// (D8's two ownership modes: gateway_mode "managed" or "operator"). This
// service only changes Shepherd's records; the tenant-route reconciler
// (internal/routeapply) applies the HTTPRoutes and records apply_status.
// Reads (List, RenderConnectApp) require org viewer; writes
// (Create/Rotate/Revoke) require org admin.
service TenantRouteService {
  rpc ListTenantRoutes(ListTenantRoutesRequest) returns (ListTenantRoutesResponse) {}
  rpc CreateTenantRoute(CreateTenantRouteRequest) returns (TenantRoute) {}
  rpc RotateTenantRoute(RotateTenantRouteRequest) returns (RotateTenantRouteResponse) {}
  rpc RevokeTenantRoute(RevokeTenantRouteRequest) returns (TenantRoute) {}
  // RenderConnectApp renders the "connect an app" artifacts (W7,
  // internal/onboarding) for one OTLP route: the endpoint an app's OTel SDK
  // points at, as env vars and IaC/SDK snippets. Read-only.
  rpc RenderConnectApp(RenderConnectAppRequest) returns (RenderConnectAppResponse) {}
}

// TenantRouteStatus is a route's lifecycle (tenant_routes.status).
enum TenantRouteStatus {
  TENANT_ROUTE_STATUS_UNSPECIFIED = 0;
  TENANT_ROUTE_STATUS_ACTIVE = 1;
  // Still routes, mid-rotation, until valid_until.
  TENANT_ROUTE_STATUS_DEPRECATED = 2;
  TENANT_ROUTE_STATUS_REVOKED = 3;
}

// TenantRouteApplyStatus is whether a route's HTTPRoute is in the cluster, as
// the tenant-route reconciler last found it (tenant_routes.apply_status).
enum TenantRouteApplyStatus {
  TENANT_ROUTE_APPLY_STATUS_UNSPECIFIED = 0;
  // Not yet reconciled.
  TENANT_ROUTE_APPLY_STATUS_PENDING = 1;
  // Attachment verified.
  TENANT_ROUTE_APPLY_STATUS_APPLIED = 2;
  // The gateway refused attachment.
  TENANT_ROUTE_APPLY_STATUS_REFUSED = 3;
  // Failed; retried with backoff.
  TENANT_ROUTE_APPLY_STATUS_ERROR = 4;
  // Revoked or expired; the HTTPRoute was deleted.
  TENANT_ROUTE_APPLY_STATUS_REMOVED = 5;
  // A Faro route, or route apply disabled.
  TENANT_ROUTE_APPLY_STATUS_NOT_APPLICABLE = 6;
}

// TenantRoute mirrors internal/store/sqlc.TenantRoute (0009_tenant_routes).
message TenantRoute {
  string id = 1;
  string org_id = 2;
  string tenant_id = 3;
  // kind is "otlp" or "faro" (internal/gateway.KindOTLP / KindFaro).
  string kind = 4;
  // segment is the route-prefix path segment minted by
  // internal/gateway.GenerateSegment: "/{kind}/{segment}/...".
  string segment = 5;
  // Field 6 was status as a string until step 7a (#361) made it an enum.
  reserved 6;
  TenantRouteStatus status = 18;
  // valid_until is set only for a deprecated route: the end of its
  // rotation overlap window. Unset for active/revoked.
  google.protobuf.Timestamp valid_until = 7;
  // rotated_from_id is the id of the route this one replaced, if any (set
  // only on a route created by RotateTenantRoute).
  string rotated_from_id = 8;
  // gateway_mode is "managed" (Shepherd owns the Gateway object) or
  // "operator" (Shepherd only creates HTTPRoutes against an
  // operator-supplied Gateway) — D8.
  string gateway_mode = 9;
  string gateway_name = 10;
  // gateway_namespace is empty to mean "same namespace as the HTTPRoute",
  // matching internal/gateway.RouteSpec.GatewayNamespace's convention.
  string gateway_namespace = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp revoked_at = 14;
  // Field 15 was apply_status as a string until step 7a (#361) made it an enum.
  reserved 15;
  // apply_status is whether this route's HTTPRoute is actually in the
  // cluster, as the tenant-route reconciler last found it.
  TenantRouteApplyStatus apply_status = 19;
  // apply_message is the reason behind REFUSED or ERROR -- the gateway's
  // own condition message where it gave one.
  string apply_message = 16;
  // applied_at is the last time attachment was verified.
  google.protobuf.Timestamp applied_at = 17;
}

message ListTenantRoutesRequest {
  string org_id = 1;
}

message ListTenantRoutesResponse {
  repeated TenantRoute items = 1;
  int32 total = 2;
}

// CreateTenantRouteRequest mints a new active tenant route. The segment is
// always generated server-side (internal/gateway.GenerateSegment) — this
// request never accepts a caller-supplied segment.
message CreateTenantRouteRequest {
  string org_id = 1;
  // Field 2 was tenant_id, an unchecked free-form tenant, removed
  // 2026-08-22 when tenant identity became a property of the ORG (set by an
  // app admin). It stays reserved so an old client's value is dropped as an
  // unknown field, never reinterpreted; field 8 (tenant) is the checked
  // replacement — it must be a tenant the org owns.
  reserved 2;
  reserved "tenant_id";
  // tenant is the tenant this route injects as X-Scope-OrgID. It must be one
  // the org owns (one of its exact tenants, or a valid tenant under one of
  // its prefixes — Org.tenants, set by an app admin). Empty means the org's
  // default tenant; an org without one is refused.
  string tenant = 8;
  // kind is "otlp" or "faro".
  string kind = 3;
  // format selects the segment format (internal/gateway.SegmentFormat):
  // "opaque" or "slug-suffix". Empty defaults to "slug-suffix" (D9's
  // documented default).
  string format = 4;
  // gateway_mode is "managed" or "operator" (D8), required.
  string gateway_mode = 5;
  string gateway_name = 6;
  string gateway_namespace = 7;
}

// RotateTenantRouteRequest issues a new active segment for an existing
// active route, demoting the old one to "deprecated" with a
// valid_until deadline overlap_seconds in the future (D9: "issue new, run
// both briefly, revoke old").
message RotateTenantRouteRequest {
  string org_id = 1;
  // id is the currently-active TenantRoute to rotate.
  string id = 2;
  // format selects the new segment's format; empty keeps the same format
  // policy as CreateTenantRoute's default (slug-suffix).
  string format = 3;
  // overlap_seconds is how long the old segment keeps routing traffic
  // after rotation. <= 0 uses the service's default (24h).
  int32 overlap_seconds = 4;
}

message RotateTenantRouteResponse {
  // active is the newly minted route.
  TenantRoute active = 1;
  // deprecated is the previously-active route, now status "deprecated"
  // with valid_until set.
  TenantRoute deprecated = 2;
}

// RevokeTenantRouteRequest immediately revokes a route (any status),
// regardless of valid_until — for the "and then revoke it" half of a
// rotation, or for an out-of-band incident response revoke.
message RevokeTenantRouteRequest {
  string org_id = 1;
  string id = 2;
}

// RenderConnectAppRequest names the route and the app being connected.
message RenderConnectAppRequest {
  string org_id = 1;
  string id = 2;
  // service_name becomes OTEL_SERVICE_NAME. Required.
  string service_name = 3;
  // protocol is "http/protobuf" (default when empty) or "http/json". There is
  // no gRPC: the gateway identifies the tenant from the URL path, which a gRPC
  // client cannot set.
  string protocol = 4;
  // include_adot_layer adds the AWS Distro for OpenTelemetry Lambda layer
  // wiring to the Lambda artifacts, with the layer ARN left for the operator
  // to fill in (it is region- and architecture-specific).
  bool include_adot_layer = 5;
  // gateway_base_url is the gateway's public https URL. Empty uses the
  // server's configured gateway.routes.public_base_url; FailedPrecondition
  // when neither is set.
  string gateway_base_url = 6;
}

// RenderConnectAppResponse carries every artifact, each derived from the same
// base_endpoint the gateway routes (internal/onboarding.BaseEndpoint).
message RenderConnectAppResponse {
  // base_endpoint is OTEL_EXPORTER_OTLP_ENDPOINT: the SDK appends v1/traces etc.
  string base_endpoint = 1;
  // gateway_base_url is the URL actually used — the request's, or the
  // configured default.
  string gateway_base_url = 2;
  // env is a KEY=VALUE .env file.
  string env = 3;
  // lambda is JSON for `aws lambda update-function-configuration --environment`.
  string lambda = 4;
  // terraform is an HCL fragment for an aws_lambda_function.
  string terraform = 5;
  // sam is a template.yaml fragment for an AWS::Serverless::Function.
  string sam = 6;
  // cdk is a TypeScript fragment for a lambda.Function.
  string cdk = 7;
  // k8s is a container `env` fragment for a pod template.
  string k8s = 8;
  // sdk_notes is Markdown explaining the variables and when code changes are needed.
  string sdk_notes = 9;
}
