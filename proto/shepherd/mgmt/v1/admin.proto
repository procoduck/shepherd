syntax = "proto3";

package shepherd.mgmt.v1;

import "google/protobuf/timestamp.proto";
import "shepherd/mgmt/v1/common.proto";

option go_package = "shepherd/gen/shepherd/mgmt/v1;mgmtv1";

// AdminService is org, cluster, and agent-token administration plus group
// search. All methods require app-admin, except SearchGroups and
// List/Create/RevokeAgentToken (app admin, or org admin of the request's org).
service AdminService {
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse) {}
  rpc CreateOrg(CreateOrgRequest) returns (Org) {}
  rpc UpdateOrg(UpdateOrgRequest) returns (Org) {}
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse) {}
  // AddOrgTenant gives an org an exact tenant or a tenant prefix. App admin
  // only. An exact tenant is unique across all orgs; a prefix may not
  // overlap another org's prefix nor cover another org's exact tenant, and
  // neither may cover a tenant another org's destination or binding sends.
  rpc AddOrgTenant(AddOrgTenantRequest) returns (Org) {}
  // RemoveOrgTenant takes an exact tenant or prefix away from an org. App
  // admin only, and only while nothing of the org uses it: a live tenant
  // route, a destination or a destination binding under it refuses the
  // removal (failed_precondition, naming each one).
  rpc RemoveOrgTenant(RemoveOrgTenantRequest) returns (Org) {}
  // SetDefaultOrgTenant makes one of the org's exact tenants its default.
  // App admin only.
  rpc SetDefaultOrgTenant(SetDefaultOrgTenantRequest) returns (Org) {}

  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse) {}
  rpc ClaimCluster(ClaimClusterRequest) returns (ClaimClusterResponse) {}
  rpc UnclaimCluster(UnclaimClusterRequest) returns (UnclaimClusterResponse) {}

  // Agent tokens are bound to an organisation (and optionally narrowed to
  // cluster/role allowlists). An org admin lists, creates and revokes the
  // tokens bound to their own org; an app admin sees every token, including
  // unbound ones, and is the only caller who may bind or rebind one.
  rpc ListAgentTokens(ListAgentTokensRequest) returns (ListAgentTokensResponse) {}
  rpc CreateAgentToken(CreateAgentTokenRequest) returns (CreateAgentTokenResponse) {}
  rpc RevokeAgentToken(RevokeAgentTokenRequest) returns (RevokeAgentTokenResponse) {}
  // BindAgentToken sets a live token's org and allowlists in place. The
  // secret is unchanged, so collectors keep their credentials. App admin only.
  rpc BindAgentToken(BindAgentTokenRequest) returns (AgentToken) {}

  // Collector OIDC identity bindings (docs/archive/plans/2026-09-16-agent-oidc-auth.md):
  // map a collector's OIDC identity (issuer + app id) to an organisation.
  rpc ListAgentIdentities(ListAgentIdentitiesRequest) returns (ListAgentIdentitiesResponse) {}
  rpc CreateAgentIdentity(CreateAgentIdentityRequest) returns (AgentIdentity) {}
  rpc DeleteAgentIdentity(DeleteAgentIdentityRequest) returns (DeleteAgentIdentityResponse) {}

  rpc SearchGroups(SearchGroupsRequest) returns (SearchGroupsResponse) {}

  // OIDC single sign-on configuration. Available only when the Helm chart did
  // NOT configure an issuer: chart config always wins, and GetOidcSettings
  // says so through `source` and `editable` rather than by hiding the values,
  // so an admin looking at a chart-managed deployment can still see what it is
  // pointed at.
  rpc GetOidcSettings(GetOidcSettingsRequest) returns (OidcSettings) {}
  rpc UpdateOidcSettings(UpdateOidcSettingsRequest) returns (OidcSettings) {}
  // TestOidcSettings performs OIDC discovery against a candidate
  // configuration WITHOUT storing it, so an admin can find a wrong issuer
  // before turning sign-in over to it. A read by the capability
  // classification's naming rule (it mutates nothing), and deliberately so.
  rpc TestOidcSettings(TestOidcSettingsRequest) returns (TestOidcSettingsResponse) {}
  rpc DeleteOidcSettings(DeleteOidcSettingsRequest) returns (DeleteOidcSettingsResponse) {}
  // ListOidcProviderPresets returns the built-in provider catalogue the
  // settings form prefills from. Served by the backend rather than hardcoded
  // in the UI so the defaults the server applies on save and the defaults the
  // form shows cannot drift apart.
  rpc ListOidcProviderPresets(ListOidcProviderPresetsRequest) returns (ListOidcProviderPresetsResponse) {}
}

// Org is a tenant: its IdP groups per role and its per-org feature settings.
message Org {
  string id = 1;
  string name = 2;
  string display_name = 3;
  string admin_group_id = 4;
  string viewer_group_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Field 8 was tenant_id, the org's single tenant identity, until an org
  // could own several tenants and prefixes (org_tenants, 0039). See tenants.
  reserved 8;
  reserved "tenant_id";
  // editor_group_id is the group whose members may author what the org RUNS —
  // pipelines, wizards, simulations — without being able to change what the
  // org IS (destinations, tenant routes, git credentials, teams). Empty means
  // the org has no editor tier and only admins can author.
  string editor_group_id = 9;
  // allow_experimental_components opts this org into experimental Alloy
  // components in the visual builder (#114). Off by default: the builder hides
  // experimental components in the palette and the server refuses to render a
  // graph that uses one. Only an app admin flips it, via UpdateOrg.
  bool allow_experimental_components = 10;
  // allow_label_matching opts this org into using "Manage labels"
  // (collectors.labels) as pipeline matcher keys, in addition to the
  // built-in cluster/role labels (procoduck/shepherd#139). Off by default:
  // existing pipelines keep matching exactly as they do today until an app
  // admin flips it, via UpdateOrg.
  bool allow_label_matching = 11;
  // allow_local_attribute_matching opts this org into using agent-reported
  // local_attributes (Alloy's remotecfg block) as pipeline matcher keys.
  // Independent of allow_label_matching: local_attributes are agent-reported
  // and reachable via a compromised agent token, a different trust boundary
  // than admin-set labels. Off by default.
  bool allow_local_attribute_matching = 12;
  // tenants are the tenants and tenant prefixes the org owns — the values
  // its tenant routes may inject as X-Scope-OrgID. Only an app admin changes
  // them (AddOrgTenant, RemoveOrgTenant, SetDefaultOrgTenant). Empty means
  // the org cannot have tenant routes yet.
  repeated OrgTenant tenants = 13;
}

message ListOrgsRequest {}

message ListOrgsResponse {
  repeated Org items = 1;
  int32 total = 2;
}

// CreateOrgRequest creates an Org.
message CreateOrgRequest {
  string name = 1;
  string display_name = 2;
  string admin_group_id = 3;
  string viewer_group_id = 4;
  // tenant_id is an optional initial default tenant: an EXACT tenant the
  // org owns from creation, used when a tenant route names none. Must
  // satisfy internal/gateway.ValidateTenantID (Grafana Mimir's documented
  // rule) and be free (AddOrgTenant's rules). More tenants and prefixes are
  // added afterwards with AddOrgTenant.
  string tenant_id = 5;
  // editor_group_id is optional — see Org.editor_group_id.
  string editor_group_id = 6;
}

message UpdateOrgRequest {
  // org_id is the {org} path param — the org being updated.
  string org_id = 1;
  string display_name = 2;
  string admin_group_id = 3;
  string viewer_group_id = 4;
  string editor_group_id = 5;
  // allow_experimental_components — see Org.allow_experimental_components (#114).
  bool allow_experimental_components = 6;
  // allow_label_matching — see Org.allow_label_matching (#139).
  bool allow_label_matching = 7;
  // allow_local_attribute_matching — see Org.allow_local_attribute_matching (#139).
  bool allow_local_attribute_matching = 8;
}

// AddOrgTenantRequest gives org_id an exact tenant or a tenant prefix.
message AddOrgTenantRequest {
  string org_id = 1;
  // tenant is the exact tenant id (internal/gateway.ValidateTenantID) or the
  // prefix (internal/gateway.ValidateTenantPrefix).
  string tenant = 2;
  OrgTenantKind kind = 3;
  // make_default also makes it the org's default tenant. EXACT only.
  bool make_default = 4;
}

// RemoveOrgTenantRequest takes an exact tenant or a prefix away from org_id.
message RemoveOrgTenantRequest {
  string org_id = 1;
  string tenant = 2;
  OrgTenantKind kind = 3;
}

// SetDefaultOrgTenantRequest makes tenant, one of org_id's EXACT tenants,
// its default.
message SetDefaultOrgTenantRequest {
  string org_id = 1;
  string tenant = 2;
}

message DeleteOrgRequest {
  string org_id = 1;
}

message DeleteOrgResponse {}

// Cluster is a registered cluster; org_id is empty until an app admin claims it.
message Cluster {
  string id = 1;
  string name = 2;
  string org_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListClustersRequest {
  // unclaimed, when true, restricts the result to clusters with no org claim
  // (?unclaimed=true today).
  bool unclaimed = 1;
}

message ListClustersResponse {
  repeated Cluster items = 1;
  int32 total = 2;
}

message ClaimClusterRequest {
  // cluster is the cluster's name (the {cluster} path param today).
  string cluster = 1;
  string org_id = 2;
}

message ClaimClusterResponse {
  string status = 1;
}

message UnclaimClusterRequest {
  string cluster = 1;
}

message UnclaimClusterResponse {
  string status = 1;
}

// AgentToken is a collector credential's metadata; the secret is never returned after creation.
message AgentToken {
  string id = 1;
  string name = 2;
  string created_by = 3;
  // Status is "active" or "revoked".
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  // org_id is the organisation the token is bound to; empty means unbound —
  // the agent API refuses an unbound token until it is bound.
  string org_id = 6;
  string org_name = 7;
  // Optional allowlists narrowing what the token may act as within its org.
  // Empty means any.
  repeated string clusters = 8;
  repeated string roles = 9;
  // may_claim: whether collectors using the token may claim an unclaimed
  // cluster for its org. True for a token an app admin minted or bound; a
  // token an org admin or a service account minted serves only clusters its
  // org has already claimed.
  bool may_claim = 10;
}

// ListAgentTokensRequest: org_id set lists only the tokens bound to that org
// (and lets that org's admins call it); empty lists every token, unbound ones
// included, and is app admin only.
message ListAgentTokensRequest {
  string org_id = 1;
}

message ListAgentTokensResponse {
  repeated AgentToken items = 1;
  int32 total = 2;
}

message CreateAgentTokenRequest {
  string name = 1;
  // org_id is required: every new token is bound to an organisation.
  string org_id = 2;
  repeated string clusters = 3;
  repeated string roles = 4;
}

// CreateAgentTokenResponse carries the one-time plaintext secret alongside
// the token's identity. The secret is shown this once and cannot be read back.
message CreateAgentTokenResponse {
  string id = 1;
  string name = 2;
  string secret = 3;
}

// RevokeAgentTokenRequest: with org_id set, only a token bound to that org
// can be revoked (NotFound otherwise); empty is app admin only.
message RevokeAgentTokenRequest {
  string id = 1;
  string org_id = 2;
}

message RevokeAgentTokenResponse {}

// BindAgentTokenRequest binds (or rebinds) a live token to an organisation.
// Replaces the token's org and both allowlists.
message BindAgentTokenRequest {
  string id = 1;
  string org_id = 2;
  repeated string clusters = 3;
  repeated string roles = 4;
}

// AgentIdentity is one collector-OIDC binding: a token identity (issuer +
// app_id) mapped to an org, with optional cluster/role allowlists (empty =
// any within the org).
message AgentIdentity {
  string issuer = 1;
  string app_id = 2;
  string org_id = 3;
  string org_name = 4;
  repeated string clusters = 5;
  repeated string roles = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListAgentIdentitiesRequest {}

message ListAgentIdentitiesResponse {
  repeated AgentIdentity items = 1;
  int32 total = 2;
}

message CreateAgentIdentityRequest {
  string issuer = 1;
  string app_id = 2;
  // org is the organisation slug (orgs.name) to bind to.
  string org = 3;
  repeated string clusters = 4;
  repeated string roles = 5;
}

message DeleteAgentIdentityRequest {
  string issuer = 1;
  string app_id = 2;
}

message DeleteAgentIdentityResponse {}

// GroupSearchResult is a Graph-backed group search hit. Not yet populated by
// the server (SearchGroups is a stub returning an empty list) — field shape
// anticipates the eventual Entra Graph search response.
message GroupSearchResult {
  string id = 1;
  string display_name = 2;
}

// SearchGroupsRequest carries org_id so the authz interceptor can allow org
// admins of that org (in addition to app admins) to search groups.
message SearchGroupsRequest {
  string org_id = 1;
  string q = 2;
}

message SearchGroupsResponse {
  repeated GroupSearchResult items = 1;
  int32 total = 2;
}

// OidcSettings is the effective single sign-on configuration.
//
// The client secret is never present: it is stored AES-256-GCM-encrypted
// (migration 0014) and decrypted only in-process at token-exchange time.
// client_secret_set reports whether one is stored, which is all a settings
// form needs to render "leave blank to keep the current secret".
message OidcSettings {
  // configured is false when neither the chart nor the database has an
  // issuer — the state of a deployment that has never set SSO up.
  bool configured = 1;
  // enabled is the operator's explicit "this provider is live" switch. A
  // provider can be saved and tested while disabled.
  bool enabled = 2;
  // active is true only when a discovered provider is loaded RIGHT NOW, i.e.
  // sign-in through it actually works. enabled && !active means the saved
  // configuration failed discovery — see status_message.
  bool active = 3;
  // source is "helm" or "database": which of the two configuration inputs
  // won. See editable.
  string source = 4;
  // editable is false when source is "helm". A cluster whose identity
  // provider is declared in git must not be re-pointed from a browser
  // session, so UpdateOidcSettings refuses in that case rather than writing a
  // row that would never be read.
  bool editable = 5;

  string provider = 6;
  string display_name = 7;
  string issuer = 8;
  string client_id = 9;
  bool client_secret_set = 10;
  string redirect_url = 11;
  repeated string scopes = 12;

  string subject_claim = 13;
  string email_claim = 14;
  string name_claim = 15;
  string groups_claim = 16;
  repeated string app_admin_groups = 17;

  bool use_graph_groups = 18;
  string graph_base_url = 19;

  // status_message explains a non-obvious state in one sentence: why an
  // enabled provider is not active, or that the chart owns this config.
  // Empty when everything is as it looks.
  string status_message = 20;

  google.protobuf.Timestamp updated_at = 21;
  string updated_by = 22;

  // Collector-OIDC gate, read-only. These configure whether an Alloy collector
  // may authenticate with an access token from this same issuer, and are set
  // via chart config / CLI, never this settings form — they are surfaced here
  // only so an admin can see the gate alongside the SSO provider it reuses.
  // agent_audience is the `aud` a collector token must carry (empty means
  // collector OIDC is off); agent_required_role / agent_required_scope are the
  // D0 grant the token must also prove. See the collector-OIDC bindings
  // section for the identity→org mapping.
  string agent_audience = 23;
  string agent_required_role = 24;
  string agent_required_scope = 25;
  // Mode 2 (IdP-authoritative org), read-only: when set, a collector's org is
  // taken from the IdP rather than a Shepherd-local binding. agent_trust_org_claim
  // names a claim carrying the org name; agent_org_role_prefix reads the org
  // from a role under that prefix. Both empty means a binding is authoritative.
  string agent_trust_org_claim = 26;
  string agent_org_role_prefix = 27;
}

message GetOidcSettingsRequest {}

// UpdateOidcSettingsRequest is a full replacement of the settings row, with
// one exception: client_secret may be left empty to keep the stored secret,
// because the API never returns it and a form that round-tripped a blank
// would otherwise erase it on every save.
message UpdateOidcSettingsRequest {
  bool enabled = 1;
  string provider = 2;
  string display_name = 3;
  string issuer = 4;
  string client_id = 5;
  // client_secret is write-only. Empty means "keep the stored secret"; a
  // non-empty value replaces it.
  string client_secret = 6;
  string redirect_url = 7;
  repeated string scopes = 8;
  string subject_claim = 9;
  string email_claim = 10;
  string name_claim = 11;
  string groups_claim = 12;
  repeated string app_admin_groups = 13;
  bool use_graph_groups = 14;
  string graph_base_url = 15;
}

// TestOidcSettingsRequest mirrors UpdateOidcSettingsRequest's connection
// fields. client_secret may be empty to test with the stored one — an admin
// verifying an issuer change should not have to re-paste a secret that has
// not changed.
message TestOidcSettingsRequest {
  string provider = 1;
  string issuer = 2;
  string client_id = 3;
  string client_secret = 4;
  repeated string scopes = 5;
}

// TestOidcSettingsResponse reports what discovery found, so an admin can
// confirm they are pointed at the right tenant/realm before enabling sign-in.
message TestOidcSettingsResponse {
  bool ok = 1;
  // message is the failure reason when ok is false, or a one-line confirmation
  // when it is true.
  string message = 2;
  // issuer is the issuer the discovery document itself declares, which is not
  // always the URL it was fetched from — a mismatch is the single most common
  // OIDC misconfiguration (trailing slashes, Auth0 vs Okta URL shapes), and
  // go-oidc rejects it at login time with an error nobody sees.
  string issuer = 3;
  string authorization_endpoint = 4;
  string token_endpoint = 5;
  string jwks_uri = 6;
  // supported_scopes / missing_scopes compare the requested scopes against
  // the discovery document's scopes_supported. Advisory only: the list is
  // optional in the spec and many providers under-report it, so a missing
  // scope is a warning in the UI, never a refusal here.
  repeated string supported_scopes = 7;
  repeated string missing_scopes = 8;
  // supports_pkce reports whether S256 appears in
  // code_challenge_methods_supported. Shepherd always sends a PKCE challenge
  // (auth.Handler.LoginHandler), so a provider that does not advertise it is
  // worth flagging before sign-in is switched on.
  bool supports_pkce = 9;
  // issuer_mismatch is set when the discovery document declares an issuer
  // different from the URL it was fetched from. go-oidc rejects that at login
  // time with an error nobody sees, so the probe is the only place it can be
  // caught while it is still cheap to fix. Empty when they match.
  string issuer_mismatch = 10;
}

message DeleteOidcSettingsRequest {}

message DeleteOidcSettingsResponse {}

message ListOidcProviderPresetsRequest {}

message ListOidcProviderPresetsResponse {
  repeated OidcProviderPreset items = 1;
}

// OidcProviderPreset is one entry in the built-in provider catalogue
// (internal/auth.Presets): the conventional defaults for a provider plus the
// prose an admin needs to find the values in that provider's console.
message OidcProviderPreset {
  string key = 1;
  string display_name = 2;
  // issuer_template shows the shape of the issuer URL with {placeholders};
  // it is documentation, never interpolated by the server.
  string issuer_template = 3;
  string issuer_hint = 4;
  repeated string scopes = 5;
  string subject_claim = 6;
  string email_claim = 7;
  string name_claim = 8;
  string groups_claim = 9;
  // supports_graph_groups is true for Entra only — the one provider with a
  // directory API Shepherd knows how to call when the groups claim is absent.
  bool supports_graph_groups = 10;
  // groups_note states what must be configured IN THE IDP for the groups
  // claim to arrive. Every provider needs some deliberate act, and skipping it
  // yields an empty group list with no error — the likeliest way to
  // misconfigure this feature.
  string groups_note = 11;
}
