syntax = "proto3";

package shepherd.mgmt.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "shepherd/mgmt/v1/common.proto";

option go_package = "shepherd/gen/shepherd/mgmt/v1;mgmtv1";

// PipelineService covers /api/orgs/{org}/pipelines/*. Reads require
// org-reader. Writes (create/update/delete/enable/disable/set-owner) require
// EITHER org-admin OR — W10, docs/gateway-tier-plan.md G11 — membership (via
// IdP group) of the team that owns the target pipeline; an unowned pipeline
// stays org-admin-only. See internal/auth.AuthorizeOwnership and
// internal/mgmtapi's per-handler ownership checks: the coarse org-reader
// gate below only proves "has some access to this org", the fine-grained
// ownership decision is made inside each handler, not at this table.
service PipelineService {
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse) {}
  rpc GetPipeline(GetPipelineRequest) returns (Pipeline) {}
  rpc CreatePipeline(CreatePipelineRequest) returns (Pipeline) {}
  rpc UpdatePipeline(UpdatePipelineRequest) returns (Pipeline) {}
  rpc DeletePipeline(DeletePipelineRequest) returns (DeletePipelineResponse) {}
  rpc EnablePipeline(EnablePipelineRequest) returns (Pipeline) {}
  rpc DisablePipeline(DisablePipelineRequest) returns (Pipeline) {}
  rpc ValidatePipeline(ValidatePipelineRequest) returns (ValidatePipelineResponse) {}
  rpc PreviewMatches(PreviewMatchesRequest) returns (PreviewMatchesResponse) {}
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse) {}
  // SetPipelineOwner reassigns (or, with an empty owner_team_id, clears) a
  // pipeline's owning team. Deliberately org-admin-only regardless of
  // current ownership — a team can write what it owns, but granting or
  // revoking ownership is a platform decision, not a delegated one.
  rpc SetPipelineOwner(SetPipelineOwnerRequest) returns (Pipeline) {}
}

// PipelineRevision mirrors internal/mgmtapi/pipelines.go: revisionResponse.
message PipelineRevision {
  int32 revision = 1;
  string changed_by = 2;
  google.protobuf.Timestamp changed_at = 3;
  string change_note = 4;
}

// Pipeline mirrors internal/mgmtapi/pipelines.go: pipelineResponse. revision
// is carried for shape-fidelity but is never populated by pipelineToResponse
// today (always 0/omitted); revisions is populated only on GetPipeline.
message Pipeline {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string contents = 4;
  repeated string matchers = 5;
  bool enabled = 6;
  // Source is "ui", "wizard", "visual", or "git".
  string source = 7;
  int32 revision = 8;
  string created_by = 9;
  string updated_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  repeated PipelineRevision revisions = 13;
  // wizard_state is the stored graph document for a source="visual" pipeline
  // (or wizard form state for source="wizard"); absent for other sources.
  // D3 (docs/reviews): this is the source of truth the visual builder loads
  // from — re-parsing `contents` is a lossy fallback used only when this is
  // missing/invalid, or for the read-only graph view of a non-visual pipeline.
  google.protobuf.Struct wizard_state = 14;
  // owner_team_id is the team (0012_teams_service_accounts) this pipeline
  // is scoped-write-owned by (G11); empty means unowned — org-admin-only,
  // matching every pipeline's behavior before W10.
  string owner_team_id = 15;
}

message ListPipelinesRequest {
  string org_id = 1;
  // needs_upgrade, when true, restricts to visual pipelines whose embedded
  // schema_version is behind the server's current schema version
  // (?needs_upgrade=true today).
  bool needs_upgrade = 2;
}

message ListPipelinesResponse {
  repeated Pipeline items = 1;
  int32 total = 2;
}

message GetPipelineRequest {
  string org_id = 1;
  string id = 2;
}

// CreatePipelineRequest mirrors pipelineRequest in pipelines.go. wizard_state
// is the visual-builder graph document (source="visual") or wizard form
// state (source="wizard") — dynamic, hence Struct.
message CreatePipelineRequest {
  string org_id = 1;
  string name = 2;
  string contents = 3;
  repeated string matchers = 4;
  string source = 5;
  google.protobuf.Struct wizard_state = 6;
  // owner_team_id, when set, requires the caller be an org-admin OR a
  // member of that team's IdP group (G11) — a team member may create a
  // pipeline owned by their own team, but not one owned by someone else's.
  // Empty (the default) creates an unowned pipeline, which only an
  // org-admin caller may do.
  string owner_team_id = 7;
}

message UpdatePipelineRequest {
  string org_id = 1;
  string id = 2;
  string name = 3;
  string contents = 4;
  repeated string matchers = 5;
  string source = 6;
  // wizard_state is nullable by virtue of being a message-typed field: when
  // absent from the request (protojson round-trips this as a nil Struct,
  // same as an explicit JSON null), the server preserves whatever
  // wizard_state/graph is already stored for the pipeline instead of
  // clearing it — so a text-only edit of a visual pipeline's `contents`
  // does not lose its graph. Send an explicit (even empty {}) Struct to
  // replace the stored value.
  google.protobuf.Struct wizard_state = 7;
}

message DeletePipelineRequest {
  string org_id = 1;
  string id = 2;
}

message DeletePipelineResponse {}

message EnablePipelineRequest {
  string org_id = 1;
  string id = 2;
}

message DisablePipelineRequest {
  string org_id = 1;
  string id = 2;
}

// ValidatePipelineRequest mirrors pipelineRequest as used by the standalone
// Validate endpoint (only name/contents are read).
message ValidatePipelineRequest {
  string org_id = 1;
  string name = 2;
  string contents = 3;
}

// ValidatePipelineResponse mirrors internal/validate.Result. The endpoint
// returns 200 with valid=false + diagnostics on validation failure (not an
// error code) — "validate endpoints return 200 + diagnostics today".
//
// signals/signals_proven/unknown_components (docs/gateway-tier-plan.md W1)
// surface the pipeline's derived signal set at authoring time, so a mismatch
// with the collector role(s) this pipeline will eventually match is visible
// before save, not only when merge assembly excludes it later. Populated on
// a best-effort basis: absent when contents fails to parse as Alloy syntax
// (that failure is already reported via valid/diagnostics above).
message ValidatePipelineResponse {
  bool valid = 1;
  repeated Diagnostic diagnostics = 2;
  // signals lists the derived signal set ("metrics", "logs", "traces",
  // "profiles"), in that fixed display order.
  repeated string signals = 3;
  // signals_proven is false when signals is a floor, not a proof — contents
  // has a top-level component the pinned schema does not recognize (see
  // unknown_components) or an unclassified wire type.
  bool signals_proven = 4;
  // unknown_components lists top-level component names contents uses that
  // the pinned schema artifact has no entry for. Never silently dropped —
  // signals may be missing signals these could carry.
  repeated string unknown_components = 5;
}

message PreviewMatchesRequest {
  string org_id = 1;
  string id = 2;
}

// MatchedCollector mirrors the per-item shape returned by previewMatchedCollectors.
message MatchedCollector {
  string cluster = 1;
  string role = 2;
  string id = 3;
}

// PreviewMatchesResponse mirrors pipelines.go PreviewMatches: {"collectors": [...]}.
message PreviewMatchesResponse {
  repeated MatchedCollector collectors = 1;
}

message ListRevisionsRequest {
  string org_id = 1;
  string id = 2;
}

message ListRevisionsResponse {
  repeated PipelineRevision items = 1;
  int32 total = 2;
}

message SetPipelineOwnerRequest {
  string org_id = 1;
  string id = 2;
  // owner_team_id, empty to clear (demote to unowned/admin-only).
  string owner_team_id = 3;
}
