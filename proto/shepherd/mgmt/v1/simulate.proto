syntax = "proto3";

package shepherd.mgmt.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "shepherd/mgmt/v1/visual.proto";

option go_package = "shepherd/gen/shepherd/mgmt/v1;mgmtv1";

// SimulateService covers /api/orgs/{org}/simulate/*: deterministic S2
// stage-trace evaluation, and S3 sandboxed runs (VB-1 §6.4). All methods
// require org-admin.
service SimulateService {
  rpc SimulateRelabel(SimulateRelabelRequest) returns (SimulateRelabelResponse) {}
  rpc SimulateLogs(SimulateLogsRequest) returns (SimulateLogsResponse) {}

  // CreateRun submits a graph for an S3 sandbox run. It returns only the run
  // id — the client always polls GetRun for state, never trusts this
  // response for anything else (VB-1 design doc §2: "graph -> { run_id }").
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse) {}
  // GetRun returns a run's current state, including results once terminal.
  rpc GetRun(GetRunRequest) returns (SimulateRun) {}
}

// -- Relabel --

// RelabelRule mirrors internal/simulate.RelabelRule.
message RelabelRule {
  repeated string source_labels = 1;
  string separator = 2;
  string regex = 3;
  string target_label = 4;
  string replacement = 5;
  // Action is a Prometheus relabel action (replace, keep, drop, labelmap,
  // labeldrop, labelkeep, lowercase, uppercase, keepequal, dropequal, hashmod).
  string action = 6;
  uint64 modulus = 7;
}

// SimulateRelabelRequest mirrors internal/simulate.RelabelRequest.
// sample_targets is a list of label sets (map<string,string> each) — modeled
// as Struct per element since proto has no repeated-map type; each element's
// keys are themselves fully dynamic label names.
message SimulateRelabelRequest {
  string org_id = 1;
  repeated RelabelRule rules = 2;
  repeated google.protobuf.Struct sample_targets = 3;
}

// RelabelStep mirrors internal/simulate.RelabelStep.
message RelabelStep {
  int32 rule_index = 1;
  string action = 2;
  map<string, string> before = 3;
  map<string, string> after = 4;
  bool kept = 5;
}

// TargetTrace mirrors internal/simulate.TargetTrace.
message TargetTrace {
  map<string, string> input = 1;
  repeated RelabelStep steps = 2;
  map<string, string> output = 3;
  bool kept = 4;
}

// SimulateRelabelResponse mirrors internal/simulate.RelabelResponse.
message SimulateRelabelResponse {
  repeated TargetTrace traces = 1;
}

// -- Logs --

// StageSpec mirrors internal/simulate.StageSpec — a single loki.process
// stage for simulation. Type selects which of the other fields apply (json,
// logfmt, regex, labels, label_drop, drop, multiline, template).
message StageSpec {
  string type = 1;
  map<string, string> expressions = 2;
  string source = 3;
  string separator = 4;
  string expression = 5;
  map<string, string> labels = 6;
  repeated string drop_labels = 7;
  string drop_value = 8;
  string template = 9;
  string firstline = 10;
}

message SimulateLogsRequest {
  string org_id = 1;
  repeated StageSpec stages = 2;
  repeated string sample_lines = 3;
}

// StageEffect mirrors internal/simulate.StageEffect.
message StageEffect {
  int32 stage_index = 1;
  string stage_type = 2;
  bool simulated = 3;
  string line_before = 4;
  string line_after = 5;
  map<string, string> labels_before = 6;
  map<string, string> labels_after = 7;
  bool dropped = 8;
  string note = 9;
}

// LineTrace mirrors internal/simulate.LineTrace.
message LineTrace {
  string input = 1;
  repeated StageEffect steps = 2;
  string output = 3;
  bool dropped = 4;
}

// SimulateLogsResponse mirrors internal/simulate.LogsResponse.
message SimulateLogsResponse {
  repeated LineTrace traces = 1;
}

// -- Run (S3 sandbox run, VB-1 §6.4/§13 M7) --

// CreateRunRequest submits a graph for a sandboxed run. GraphDocument and
// VisualNodeDiagnostic are reused from visual.proto rather than redefined,
// per the single-schema-of-truth principle (VB-1 design doc §5.2).
message CreateRunRequest {
  string org_id = 1;
  GraphDocument graph = 2;
  // duration_seconds: 0 selects the server default (30s), clamped to [1,120].
  int32 duration_seconds = 3;
}

message CreateRunResponse {
  string run_id = 1;
}

message GetRunRequest {
  string org_id = 1;
  string id = 2;
}

// SimulateRewrite mirrors internal/simulate.Rewrite — one entry in the "what
// was rewritten" disclosure (VB-1 §6.4 step 4).
//
// kind is one of: destination_endpoint | discovery_stubbed |
// log_source_stubbed | secret_node_removed | secret_dropped |
// secret_ref_substituted | edge_dropped | prop_dropped |
// target_address_forced. Kept a plain string per the
// repo's documented contract rule (docs/archive/api-contract-design.md;
// see visual.proto's UpgradeItem.class for the same precedent) rather than
// a proto enum.
message SimulateRewrite {
  string node_id = 1;
  string node_label = 2;
  string component = 3;
  string kind = 4;
  string detail = 5;
}

// CapturedSeries mirrors one entry of the simulator's Results.Series.
message CapturedSeries {
  string name = 1;
  map<string, string> labels = 2;
  int32 sample_count = 3;
}

// CapturedLogLine mirrors one entry of the simulator's Results.LogLines.
message CapturedLogLine {
  map<string, string> labels = 1;
  string line = 2;
}

// ComponentHealth mirrors one entry of the simulator's Results.Components.
// health_state mirrors Alloy's own /api/v0/web/components values verbatim
// (healthy, unhealthy, unknown, exited) and is NOT evidence of delivery —
// see VB-1 §6.4's "nothing captured" containment note.
message ComponentHealth {
  string node_id = 1;
  string node_label = 2;
  string component = 3;
  string health_state = 4;
  string message = 5;
}

// SimulateRun is the full run document GetRun returns.
//
// status is one of: queued | running | completed | failed | expired — a
// plain string, not a proto enum, per the same contract rule as
// SimulateRewrite.kind above.
// error_code (set iff status == "failed") is one of: cannot_stub |
// gate_failed | simulator_unavailable | timeout | internal.
message SimulateRun {
  string id = 1;
  string org_id = 2;
  string status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  int32 requested_duration_seconds = 7;
  // queue_position is 0 once status leaves "queued"; computed at read time,
  // never stored (best-effort — see VB-1 run-API spec Risks).
  int32 queue_position = 8;
  repeated SimulateRewrite rewrites = 9;
  repeated CapturedSeries captured_series = 10;
  repeated CapturedLogLine captured_log_lines = 11;
  repeated ComponentHealth component_health = 12;
  repeated VisualNodeDiagnostic gate_diagnostics = 13;
  string stderr_tail = 14;
  string error_code = 15;
  string error_message = 16;
  // fidelity_note is the fixed §6.5 tier-S3 one-liner; always populated.
  string fidelity_note = 17;
}
