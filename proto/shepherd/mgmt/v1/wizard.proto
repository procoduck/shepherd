syntax = "proto3";

package shepherd.mgmt.v1;

import "google/protobuf/struct.proto";
import "shepherd/mgmt/v1/common.proto";
import "shepherd/mgmt/v1/pipeline.proto";

option go_package = "shepherd/gen/shepherd/mgmt/v1;mgmtv1";

// WizardService covers /api/orgs/{org}/wizards/*. All methods require org-admin.
service WizardService {
  rpc ListWizards(ListWizardsRequest) returns (ListWizardsResponse) {}
  rpc GetWizardSchema(GetWizardSchemaRequest) returns (WizardSchema) {}
  // RenderWizard renders the wizard state into pipeline contents +
  // validation diagnostics + a match preview, WITHOUT persisting anything.
  // Mirrors CommitWizard's content generation (spec §12).
  rpc RenderWizard(RenderWizardRequest) returns (RenderWizardResponse) {}
  rpc CommitWizard(CommitWizardRequest) returns (Pipeline) {}
}

// StepField mirrors internal/wizard.StepField. Type is "text", "select",
// "toggle", or "number"; default is whatever JSON scalar the wizard declares.
message StepField {
  string name = 1;
  string label = 2;
  string type = 3;
  bool required = 4;
  repeated string options = 5;
  google.protobuf.Value default = 6;
  string placeholder = 7;
  string description = 8;
}

// Step mirrors internal/wizard.Step.
message Step {
  string id = 1;
  string title = 2;
  repeated StepField fields = 3;
}

// WizardSchema mirrors internal/wizard.Schema, returned by GetWizardSchema
// and (as list items) by ListWizards.
message WizardSchema {
  string kind = 1;
  string title = 2;
  repeated Step steps = 3;
  // description is one sentence on what this wizard produces, for the catalog
  // card. Carried from the wizard itself so the UI never needs a parallel map
  // of kinds it knows about.
  string description = 4;
}

message ListWizardsRequest {
  string org_id = 1;
}

message ListWizardsResponse {
  repeated WizardSchema items = 1;
  int32 total = 2;
}

message GetWizardSchemaRequest {
  string org_id = 1;
  string kind = 2;
}

// CommitWizardRequest mirrors commitRequest in wizards.go. state is the
// user-provided wizard form state, a dynamic JSON object.
message CommitWizardRequest {
  string org_id = 1;
  string kind = 2;
  string name = 3;
  google.protobuf.Struct state = 4;
}

// RenderWizardRequest carries the same shape as CommitWizardRequest — name is
// optional here (used only to label validation diagnostics and, once a
// pipeline of that name exists, is irrelevant to the match preview).
message RenderWizardRequest {
  string org_id = 1;
  string kind = 2;
  string name = 3;
  google.protobuf.Struct state = 4;
}

// RenderWizardResponse is the preview counterpart to Pipeline: generated
// contents + suggested matchers, plus stage 1/2 validation diagnostics and
// which of the org's collectors the suggested matchers would currently hit.
// Nothing is persisted.
message RenderWizardResponse {
  string contents = 1;
  repeated string matchers = 2;
  bool valid = 3;
  repeated Diagnostic diagnostics = 4;
  repeated MatchedCollector matched_collectors = 5;
}
