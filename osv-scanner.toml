id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is deprecated and unmaintained (no fixed version). Shepherd does not import it: `go list -deps ./...` reaches only x/crypto/argon2 and go-git's github.com/ProtonMail/go-crypto/openpgp. The match is module-level, and govulncheck reports nothing reachable."
