name: CI

# Runs on every PR and on pushes to main.
#
# Job graph (roughly follows docs/spec.md "CI ordering":
# smoke -> test -> [test-ui, test-fullstack] -> e2e):
#   lint, build, test, web, guards, generated-drift, test-ui all run in
#   parallel — each is fast and independent, so there is no value in
#   chaining them serially here.
# test-ui runs the mocked Playwright visual-builder suite (web/tests/specs)
# against a local `vite preview` server — no backend, no Docker required.
# It is the only coverage for the canvas's delete and port-drag
# interactions, so it must run on every PR, not just on manual dispatch.
# test-fullstack runs here on every PR; e2e lives in e2e.yml (manual
# dispatch + merge_group) per F7's scope, e2e-k8s in e2e-k8s.yml (nightly +
# paths-filtered), and schema-verify in schema-verify.yml (weekly cron +
# versions.env PRs). There is no separate test-integration stage any more —
# `make test` runs the whole Go suite, testcontainers included. smoke is
# still not wired into CI; that remains follow-up.

# Actions minutes are a budgeted resource (3000/month on this plan) and GitHub
# bills EVERY JOB separately, ROUNDED UP TO THE MINUTE. Measured over 20 recent
# runs, a full CI pass is ~26 billed minutes for ~9 minutes of wall clock:
#
#   test-fullstack 9.0   generated-drift 4.0   test 3.9   test-ui 3.0
#   lint 1.6   build 1.2   web 1.0   guards 1.0   changes 1.0
#
# Three rules follow from that:
#
#   1. A change that cannot affect any job here must not start the workflow —
#      hence paths-ignore. A docs-only push used to cost the full run.
#   2. Every job that costs more than its share gates on the `changes` job
#      below and runs only when its own inputs moved. Only `guards` (1 min,
#      cross-cutting, and the thing that catches a broken committed dist) and
#      `changes` itself are unconditional.
#   3. When the diff cannot be computed (force-push, first push on a branch),
#      every gate opens. Running too much is a budget problem; running too
#      little is a correctness problem, and they are not equally bad.
#
# What that buys, per the same measurements:
#   Go-only PR      skips web + test-ui                  -4.0 min
#   Web-only PR     skips lint + build + test            -6.7 min
#                   (+ generated-drift when no proto)    -4.0 min
#   Chart-only PR   skips web + test-ui + fullstack     -13.0 min
#   Docs-only PR    does not start the workflow at all  -26.0 min
#
# paths-ignore is deliberately narrow: anything not listed still runs
# everything. A PR touching docs AND code runs in full, which is correct.
#
# NOT done, deliberately: this still runs in full on every push to main, which
# re-tests a tree that just passed as a PR (8 of the last 30 runs, ~200 billed
# minutes). That duplication is the safety net for semantic conflicts between
# PRs that merged close together, and cutting it trades budget for the one
# signal that catches them. Revisit only if the budget actually binds.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap (<1 min) fan-out gate for the two expensive jobs below. Plain git
  # rather than a third-party paths-filter action, matching this repo's
  # existing preference (see release.yml's note on unverified Actions).
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      generated: ${{ steps.f.outputs.generated }}
      fullstack: ${{ steps.f.outputs.fullstack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: f
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A missing/zero base (first push on a branch, force-push) means we
          # cannot diff — run everything rather than skip a gate blindly.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            for k in backend frontend generated fullstack; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
            echo "no usable base ($base) — running all gated jobs"
            exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"; echo "$files"

          # generated-drift can only fail if a generator input or its committed
          # output moved. Anything else cannot produce drift.
          if echo "$files" | grep -qE '^(proto/|buf\.(gen\.)?yaml|sqlc\.yaml|gen/|web/src/gen/|internal/store/queries/|internal/store/sqlc/|internal/version/|deploy/versions\.env|Makefile|\.github/workflows/ci\.yml)'; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

          # test-fullstack drives the real server + SPA. Changes confined to the
          # k8s e2e suite or the chart cannot affect it; everything else can.
          if echo "$files" | grep -vE '^(e2e/k8s/|deploy/helm/)' | grep -q .; then
            echo "fullstack=true" >> "$GITHUB_OUTPUT"
          else
            echo "fullstack=false" >> "$GITHUB_OUTPUT"
          fi

          # backend gates lint, build and test — together ~7 billed minutes.
          #
          # deploy/helm/** is in here and that is not a mistake: deploy/helm's
          # chart tests shell out to real `helm template` and assert on its
          # output, so a values.yaml edit genuinely can fail `go test ./...`.
          #
          # internal/spa/dist/** is deliberately EXCLUDED (see the -v below).
          # The built SPA is committed, so every web change carries a dist
          # rebuild; treating that as a backend change would mean no web PR
          # ever skips the Go suite and this gate would buy nothing. Nothing in
          # the Go tests depends on dist CONTENT — only that it exists and its
          # index references files that are tracked, which is exactly what the
          # always-on `guards` job checks (check-single-dist,
          # check-dist-consistency).
          if echo "$files" | grep -vE '^internal/spa/dist/' \
             | grep -qE '(\.go$|^go\.(mod|sum)$|^proto/|^gen/|^buf\.(gen\.)?yaml$|^sqlc\.yaml$|^internal/|^cmd/|^tools/|^e2e/|^deploy/helm/|^deploy/Dockerfile|^deploy/versions\.env$|^\.golangci\.yml$|^Makefile$|^\.github/workflows/ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          # frontend gates web and test-ui — ~4 billed minutes. Both run
          # entirely inside web/ (typecheck, vitest, biome, vite build, and
          # Playwright against `vite preview` with mocked APIs), so nothing
          # outside web/ can change their result — except proto/, which
          # regenerates web/src/gen.
          if echo "$files" | grep -qE '(^web/|^proto/|^buf\.(gen\.)?yaml$|^Makefile$|^\.github/workflows/ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          echo "--- gate decisions ---"
          cat "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    # Fail-open: if `changes` could not run, its outputs are empty and a plain
    # equality test would silently skip this job — turning a broken gate into
    # a green PR that tested nothing. Run whenever the gate says yes OR the
    # gate itself did not succeed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # .golangci.yml is v2-schema (see docs/spec.md §20) and must be kept
      # verbatim; this action just runs `golangci-lint run` against it.
      # Pinned so CI results match local `make lint` runs instead of drifting
      # on every golangci-lint release; action v8 is the v2-capable major.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  build:
    name: build
    needs: changes
    # Fail-open: if `changes` could not run, its outputs are empty and a plain
    # equality test would silently skip this job — turning a broken gate into
    # a green PR that tested nothing. Run whenever the gate says yes OR the
    # gate itself did not succeed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go build alone won't compile files that only participate via `go vet`
      # (e.g. build-tag-gated files); run both. Neither needs the embedded
      # SPA dist, so we don't build the web app here (that's the `web` job).
      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pure shell/grep/find guards — no Go or Node toolchain required.
      - name: Repo guard checks
        run: make check-single-dist check-dist-consistency check-build-script check-raw-sql check-docker check-no-route-mocks

      # ubuntu-latest ships helm; this is seconds-cheap and the chart has
      # shipped uninstallable before (commit ec0130f).
      - name: Helm lint
        run: make helm-lint

  # Committed generated code (gen/ from proto/, internal/store/sqlc, and
  # internal/version/alloy_gen.go from deploy/versions.env) can silently drift
  # from its sources: an edit to proto/ without re-running `make generate`
  # still compiles and tests green against the stale output. Regenerate and
  # fail on any diff. Tool pins match `make tools`.
  generated-drift:
    name: generated-drift
    needs: changes
    # Fail-open: if `changes` could not run, its outputs are empty and a plain
    # equality test would silently skip this job — turning a broken gate into
    # a green PR that tested nothing. Run whenever the gate says yes OR the
    # gate itself did not succeed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.generated == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # buf.gen.yaml uses three protoc plugins: go and connect-go (Go tools,
      # pinned to the go.mod module versions so regeneration matches the
      # committed "@generated by" stamps) and protoc-gen-es, which lives in
      # web/node_modules — hence the pnpm install below.
      - name: Install buf, sqlc, and protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$(go list -m -f '{{.Version}}' google.golang.org/protobuf)"
          go install "connectrpc.com/connect/cmd/protoc-gen-connect-go@$(go list -m -f '{{.Version}}' connectrpc.com/connect)"

      - name: Read pnpm version from package.json
        id: pnpm-version
        working-directory: web
        run: |
          version="$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@//')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read packageManager from web/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Provides web/node_modules/.bin/protoc-gen-es at the lockfile-pinned
      # version (CI-local tooling setup, not a build step — see the web job).
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: make generate
        run: make generate

      # git diff alone ignores untracked files, and "new .proto message whose
      # regeneration creates a NEW file" is exactly the drift this job exists
      # to catch — so stage everything and diff the index.
      - name: Fail on generated-code drift
        run: |
          git add -A
          git diff --cached --exit-code

  test:
    name: test
    needs: changes
    # Fail-open: if `changes` could not run, its outputs are empty and a plain
    # equality test would silently skip this job — turning a broken gate into
    # a green PR that tested nothing. Run whenever the gate says yes OR the
    # gate itself did not succeed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/visual's stage-2 corpus spec shells the pinned Alloy binary
      # via a Docker fallback and now fails (rather than silently skipping)
      # when no binary or image is available — see internal/visual/render_test.go.
      # Pulling here surfaces a registry/network problem as its own CI step
      # instead of inside the 20-minute test run, and keeps the image pinned
      # to the same source of truth (deploy/versions.env) everything else uses.
      - name: Pull pinned Alloy image
        run: |
          source deploy/versions.env
          docker pull --quiet "$ALLOY_IMAGE"

      # internal/testutil spins up real Postgres via testcontainers-go;
      # ubuntu-latest runners ship Docker out of the box so this needs no
      # extra setup.
      # ./... rather than ./internal/... — the latter silently excluded
      # ./tools/..., so the schema generator's own unit tests (reconcile.go's
      # categorisation and merge behaviour, and the port/wire model in
      # portmodel.go) had never run in CI.
      - name: go test ./...
        run: go test ./...

  web:
    name: web
    needs: changes
    # Fail-open: if `changes` could not run, its outputs are empty and a plain
    # equality test would silently skip this job — turning a broken gate into
    # a green PR that tested nothing. Run whenever the gate says yes OR the
    # gate itself did not succeed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve the pnpm version from web/package.json's "packageManager"
      # field so CI never drifts from what's pinned in the repo.
      - name: Read pnpm version from package.json
        id: pnpm-version
        run: |
          version="$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@//')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read packageManager from web/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Canonical install path per check-build-script guard: only
      # scripts/build-web.sh may run `pnpm install`/`pnpm build` outside CI.
      # `pnpm install --frozen-lockfile` here is CI-local tooling setup, not
      # a build step, so it doesn't trip that guard.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Lint (biome)
        run: pnpm exec biome check .

      - name: Build
        run: CI=true pnpm run build

  test-ui:
    name: test-ui
    needs: changes
    # Fail-open: if `changes` could not run, its outputs are empty and a plain
    # equality test would silently skip this job — turning a broken gate into
    # a green PR that tested nothing. Run whenever the gate says yes OR the
    # gate itself did not succeed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pnpm version from package.json
        id: pnpm-version
        working-directory: web
        run: |
          version="$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@//')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read packageManager from web/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Warm cache makes the target's `playwright install` a no-op instead of
      # a ~120MB browser download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      # make test-ui installs Playwright's browser + OS deps, builds the SPA
      # via scripts/build-web.sh, and runs the mocked Playwright visual suite
      # (web/tests/specs) against a local `vite preview` server. This is the
      # only coverage for "nothing can be deleted" and "the core wire cannot
      # be drawn on the port" (both CRITICAL in docs/reviews) — without this
      # job neither fix has any automated enforcement.
      - name: make test-ui
        run: make test-ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  # The fullstack suite is the only CI coverage that drives the UI against the REAL
  # server and the REAL embedded schema. The mocked suite (test-ui) proves component
  # behaviour against a fixture sliced from the artifact; this one proves the whole
  # contract — save/reload round-trips, org scoping, and that the schema the server
  # serves is the one the canvas can actually build with. docs/reviews/README.md's
  # root cause was precisely the absence of a layer that touched the shipped schema.
  test-fullstack:
    name: test-fullstack
    needs: changes
    # Fail-open: if `changes` could not run, its outputs are empty and a plain
    # equality test would silently skip this job — turning a broken gate into
    # a green PR that tested nothing. Run whenever the gate says yes OR the
    # gate itself did not succeed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.fullstack == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read pnpm version from package.json
        id: pnpm-version
        working-directory: web
        run: |
          version="$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@//')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read packageManager from web/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Restored before the install so playwright's postinstall skips the
      # ~120MB browser download on a warm cache (and fills it on a cold one).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      # Layer cache for the multi-stage image builds (base pulls, go mod
      # download, pnpm install + vite build all happen inside Docker and are
      # otherwise cold on every runner). cache-to writes to a fresh dir and a
      # rotate step swaps it in, so the cache doesn't grow without bound.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('go.sum', 'web/pnpm-lock.yaml', 'deploy/versions.env', 'deploy/Dockerfile.local', 'deploy/Dockerfile.init', 'deploy/Dockerfile.simulator') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      # Brings up the dev compose stack (postgres, gitea, mockmsft, shepherd, alloy),
      # runs the fullstack specs against it, and tears it down. The target builds the
      # shepherd:local images first — compose's --build does not, since those services
      # reference an image rather than declaring a build context.
      - name: make test-fullstack
        env:
          DOCKER_CACHE_FLAGS: --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max
        run: make test-fullstack

      - name: Rotate Docker layer cache
        if: always()
        run: |
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-stack-log
          path: /tmp/fullstack-stack.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fullstack
          path: web/playwright-report/
          retention-days: 14
