name: E2E K8s

# Kubernetes e2e suite (kind): helm install coverage plus the NetworkPolicy
# containment specs, opening with the negative control that proves the CNI
# enforces before any denial is trusted (docs/kind-test-environment-plan.md).
#
# Scheduled rather than per-PR: `make e2e-k8s` builds both images, creates a
# kind cluster, and installs Calico — ~3-5 min locally, meaningfully longer on
# CI runners, and heavier than any signal it adds for PRs that don't touch the
# chart or the suite. PRs that DO touch them run it via the paths filter,
# because those are the changes it exists to catch. (The 45m go-test timeout
# is a budget for a wedged cluster, not the expected runtime.)
#
# WEEKLY, not nightly: this costs ~12 billed minutes per run, so a nightly
# schedule alone would spend ~360 of the 3000 monthly minutes re-proving the
# same thing against an unchanged tree. The paths filter above is what
# actually catches regressions — the schedule only guards against rot from
# upstream drift (a new kind/Calico/Kubernetes release), which is a weekly-
# scale risk, not a daily one. Run it on demand any time via workflow_dispatch.

on:
  schedule:
    - cron: "43 3 * * 2"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "deploy/helm/**"
      - "e2e/k8s/**"
      - ".github/workflows/e2e-k8s.yml"
      # The Dockerfiles and the image pins decide what is actually INSTALLED:
      # this suite builds shepherd:local from deploy/Dockerfile.local and runs
      # it in the cluster, so a change there is exactly the kind this job
      # exists to catch. Omitting them let a base-image change ship an image
      # where `alloy validate` could not execute at all — Stage 2 of the
      # validation gate dead in every deployment — without this job ever
      # running. Found by a browser walkthrough, not by CI.
      - "deploy/Dockerfile*"
      - "deploy/versions.env"

concurrency:
  group: e2e-k8s-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-k8s:
    name: e2e-k8s
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ubuntu-latest leaves ~14GB free — not enough for two multi-stage image
      # builds + the kind node image + loading shepherd:local into three nodes
      # (first live run failed with ENOSPC in containerd's snapshotter).
      # Dropping the preinstalled toolchains this job never uses frees ~25GB.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # install_only: the suite creates (and destroys) its own cluster; we
      # just need the kind binary. helm and kubectl ship on ubuntu-latest.
      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Keyed per workflow+job+run: actions/cache never overwrites an
      # existing key, so a key shared across ci.yml/e2e.yml/e2e-k8s.yml meant
      # only the first save ever "won" it -- every later save was skipped,
      # and "Rotate Docker layer cache" below found no
      # /tmp/.buildx-cache-new and silently did nothing. The unique run_id
      # guarantees this step always has something new to save; restore-keys
      # stays scoped to this workflow+job (no run_id) so a later run still
      # gets a warm prefix match against the most recent save.
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('go.sum', 'web/pnpm-lock.yaml', 'deploy/versions.env', 'deploy/Dockerfile.local', 'deploy/Dockerfile.init', 'deploy/Dockerfile.simulator') }}-${{ github.run_id }}
          restore-keys: |
            buildx-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-

      - name: make e2e-k8s
        env:
          DOCKER_CACHE_FLAGS: --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max
        run: E2E_K8S_ARTIFACTS=/tmp/e2e-k8s-artifacts make e2e-k8s

      - name: Rotate Docker layer cache
        if: always()
        run: |
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      - name: Upload cluster logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-k8s-cluster-logs
          path: /tmp/e2e-k8s-artifacts/
          retention-days: 14
          if-no-files-found: ignore
