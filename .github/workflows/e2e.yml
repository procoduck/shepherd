name: E2E

# Alloy agent protocol suite (remotecfg polling, GetConfig RPC, hash/not-modified).
# Per docs/spec.md "CI ordering", this only runs in the merge queue (not on every
# push/PR — it's the slowest suite, ~10 min) plus on-demand via manual dispatch.
#
# `make e2e` builds its own images (docker-build-local + docker-build-init) and
# brings up e2e/docker-compose.e2e.yaml itself, so this workflow just needs Docker,
# which ubuntu-latest provides.

on:
  workflow_dispatch: {}
  merge_group: {}

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read pnpm version from package.json
        id: pnpm-version
        run: |
          version="$(jq -r '.packageManager' web/package.json | sed -E 's/^pnpm@//')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read packageManager from web/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install ginkgo CLI
        run: go install github.com/onsi/ginkgo/v2/ginkgo@$(go list -m -f '{{.Version}}' github.com/onsi/ginkgo/v2)

      - name: make e2e
        run: make e2e

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.e2e.yaml logs --no-color || true

      - name: Tear down stack
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yaml down -v || true
