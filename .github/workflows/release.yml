# release.yml — builds and publishes tagged releases with goreleaser.
#
# Required repo settings (Settings -> Secrets and variables -> Actions):
#
#   Variables (optional — fall back to the same defaults as `make release-snapshot`):
#     IMAGE_REGISTRY   e.g. "ghcr.io/procoduck"      (default: ghcr.io/procoduck)
#     SOURCE_URL       e.g. "https://github.com/procoduck/shepherd" (default: that URL)
#
#   Secrets (only needed if pushing to a registry other than ghcr.io under this
#   repo's own GITHUB_TOKEN permissions — e.g. Docker Hub, a private registry):
#     REGISTRY_USERNAME
#     REGISTRY_PASSWORD
#   When unset, login falls back to `github.actor` / `secrets.GITHUB_TOKEN`,
#   which is sufficient for the default ghcr.io/<org> registry.
#
#   No other secrets are invented by this workflow. GITHUB_TOKEN (implicit,
#   scoped by the `permissions:` block below) is used both for the GHCR push
#   and for goreleaser's GitHub release step.
#
# This workflow never runs on forks (see the `if:` guard on the release job) —
# forked repos don't have the above secrets/variables and shouldn't be able to
# push images under this project's name.

name: Release

on:
  push:
    tags:
      # GitHub's tag filter is a glob, not a regex -- there is no \d
      # equivalent beyond a [0-9] character class, so this is the tightest
      # match it allows ("vfoo", "v1" and "version-2" no longer trigger).
      # The verify job's "Validate tag" step backs this up with a real regex
      # at runtime, since e.g. "v1.2.3.4" still satisfies this glob.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# One release at a time. Two tags pushed in quick succession would otherwise
# race the "is this chart version already published" check below, and both
# could conclude it is free.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege at the top level (Scorecard Token-Permissions): the default
# for any job is read-only, and each job below grants exactly the write scopes
# it needs — only `release` (cuts the GitHub release + pushes to GHCR) and the
# attest jobs (Sigstore provenance and SBOM attestations, pushed next to the
# image or chart in the registry) get any write at all. `verify` and
# `verify-attestations` publish nothing and stay read-only.
permissions:
  contents: read

jobs:
  # Gates the tagged commit exactly as hard as a PR to main: nothing here
  # assumes the tag's commit ever passed ci.yml (a tag can be pushed onto any
  # commit, and branch protection only guards main), so `release` needs this
  # job rather than trusting the tag alone.
  verify:
    name: verify
    runs-on: ubuntu-latest
    if: github.repository == 'procoduck/shepherd'
    timeout-minutes: 20
    # Read-only: this job builds and scans images locally but never pushes, and
    # cuts no release — the Alloy image it pulls is a public Docker Hub image.
    permissions:
      contents: read
    steps:
      # The push.tags glob above (GitHub Actions has no \d) still lets
      # through e.g. "v1.2.3.4" or "v01.2.3" -- reject anything that isn't a
      # real semver release tag before doing anything else.
      - name: Validate tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not a valid semver release tag (expected vMAJOR.MINOR.PATCH[-PRERELEASE])" >&2
            exit 1
          fi

      # Full history and tags: the signed-tag check below needs the annotated
      # tag object itself (a shallow tag checkout can hand back only the
      # commit) and origin/main, whose allowed_signers it trusts.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Signed tags (owner decision 2026-10-22): a release tag must carry an
      # SSH signature from a key in .github/allowed_signers, so an unsigned or
      # wrongly signed tag stops here, before anything is published. Release
      # steps: `git tag -s` (AGENTS.md).
      #
      # The signers file is read from origin/main, not from the tagged commit:
      # a tag can point at any commit, including one that never went through
      # review and edits this very file to list its own key. main is
      # branch-protected, so the trusted key set changes only by a reviewed PR.
      # Re-fetching the tag with --force makes sure verify-tag sees the
      # annotated tag object as pushed, and a lightweight tag (no object, so
      # nothing to sign) is refused by name rather than by a confusing
      # verify-tag error.
      - name: Verify the tag is signed by a release key
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' is a lightweight tag; release tags must be annotated and signed (git tag -s)" >&2
            exit 1
          fi
          signers="$RUNNER_TEMP/allowed_signers"
          git show origin/main:.github/allowed_signers > "$signers"
          git config gpg.ssh.allowedSignersFile "$signers"
          if ! git verify-tag "$GITHUB_REF_NAME"; then
            echo "::error::tag '$GITHUB_REF_NAME' is not signed by a key in main's .github/allowed_signers; refusing to release" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to the same version as ci.yml's lint job so a release cannot
      # pass a check main's own CI would have failed.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: golangci-lint config verify
        run: golangci-lint config verify

      # Pure shell/grep/find guards (check-single-dist, check-raw-sql,
      # check-docker, ...) — see ci.yml's own guards job.
      - name: Repo guards
        run: make guards

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # internal/visual's stage-2 corpus spec shells the pinned Alloy binary
      # via a Docker fallback and fails (rather than silently skipping) when
      # no binary or image is available — see internal/visual/render_test.go.
      # Pulling here surfaces a registry/network problem as its own step
      # instead of inside the test run, pinned to the same source of truth
      # (deploy/versions.env) ci.yml uses.
      - name: Pull pinned Alloy image
        run: |
          source deploy/versions.env
          docker pull --quiet "$ALLOY_IMAGE"

      - name: go test
        run: go test ./...

      # Pinned rather than whatever helm ubuntu-latest ships, and to the same
      # version the release job packages and pushes with, so the lint that
      # gates a release is the lint of the helm that publishes it.
      # Seconds-cheap, and the chart has shipped uninstallable before
      # (commit ec0130f).
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Helm lint
        run: make helm-lint

      # Image vulnerability gate, BEFORE anything is published: build the
      # same two images `make dev` builds and refuse the release if
      # Shepherd's own binary or the distroless base carries a fixed
      # critical/high CVE. The vendored Alloy binary is excluded from the
      # gate on purpose — its CVEs are fixed by bumping ALLOY_IMAGE (a schema
      # bump, docs/project-status.md §4), and the weekly security-scan
      # workflow keeps reporting them to the Security tab meanwhile.
      - name: Build images for the vulnerability gate
        run: make docker-build-local docker-build-simulator
      - name: Image vulnerability gate — shepherd
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shepherd:local
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-files: usr/local/bin/alloy
          exit-code: "1"
      - name: Image vulnerability gate — shepherd-simulator
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shepherd-simulator:local
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-files: usr/local/bin/alloy
          exit-code: "1"

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    if: github.repository == 'procoduck/shepherd'
    timeout-minutes: 30
    # The only job that publishes: goreleaser cuts the GitHub release
    # (contents: write) and pushes images + the Helm chart to GHCR
    # (packages: write); attest-build-provenance signs the archives
    # (id-token/attestations: write).
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      # JSON array of {name, digest} for the attest-images job's matrix —
      # the image names and digests aren't known until goreleaser has run.
      images: ${{ steps.images.outputs.images }}
      # The pushed chart's OCI manifest digest and version, for attest-chart
      # and verify-attestations. Empty unless the chart push succeeded.
      chart-digest: ${{ steps.chart.outputs.digest }}
      chart-version: ${{ steps.chart.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Read pnpm version from package.json
        id: pnpm-version
        run: |
          version="$(jq -r '.packageManager' web/package.json | sed -E 's/^pnpm@//')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read packageManager from web/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Generated code is committed and guarded by CI's generated-drift job,
      # so goreleaser's only before-hook is the SPA build (scripts/build-web.sh
      # needs the pnpm/node setup above) — no buf/sqlc toolchain here.

      # goreleaser's sboms section shells out to syft, which ubuntu-latest
      # does not preinstall — the first v0.0.1 run died on exactly this.
      # Before goreleaser, not after. This used to live in the chart step at the
      # end, so a mismatch failed the run only once the images and the GitHub
      # release were already public -- a half-published release that could not
      # be corrected without cutting a new tag. It reads one file; there is no
      # reason for it to run late.
      - name: Verify Chart.yaml appVersion matches the tag
        run: |
          set -euo pipefail
          chart_dir=deploy/helm/shepherd
          read_field() {
            awk -v k="$1:" '$1 == k { gsub(/"/, "", $2); print $2; exit }' "$chart_dir/Chart.yaml"
          }
          app_version="$(read_field appVersion)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$app_version" != "$tag_version" ]; then
            echo "::error::Chart.yaml appVersion is $app_version but the tag is $tag_version." \
                 "The image tag falls back to appVersion, so this release would install the wrong image." >&2
            exit 1
          fi

      # docker/login-action needs just the registry host, but IMAGE_REGISTRY
      # (e.g. "ghcr.io/procoduck") includes the namespace path — split it.
      # Resolved here, ahead of syft/buildx, because the chart-publication
      # probe below needs it too.
      - name: Resolve registry host
        id: registry
        run: |
          full="${IMAGE_REGISTRY:-ghcr.io/procoduck}"
          echo "host=${full%%/*}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}

      # Helm 4: packages and pushes the chart (apiVersion v2, which Helm 4
      # keeps supporting). Proven against a throwaway OCI registry before the
      # move: login (domain only, as Helm 4 requires), the "already published"
      # probe's not-found message, package, push, show chart, pull back, and a
      # Helm 3 client consuming the pushed chart. Keep in step with the
      # verify job's and ci.yml's pin.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      # Runs before goreleaser (and therefore before either image is built or
      # pushed, and before the GitHub release is cut) so a chart that fails
      # to lint, or a chart version that is already published, stops the
      # release here instead of after the half-published state this used to
      # risk: goreleaser had already pushed images and cut the GitHub release
      # by the time this same check used to run, inside the "Publish the Helm
      # chart" step below.
      - name: Verify the Helm chart is unpublished and lints cleanly
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io/procoduck' }}
          REGISTRY_HOST: ${{ steps.registry.outputs.host }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          make helm-lint

          chart_dir=deploy/helm/shepherd
          tag_version="${GITHUB_REF_NAME#v}"

          # awk rather than `sed | head -1`: under `set -o pipefail`, head
          # closing the pipe early can hand sed a SIGPIPE and fail the step
          # for no reason at all.
          read_field() {
            awk -v k="$1:" '$1 == k { gsub(/"/, "", $2); print $2; exit }' "$chart_dir/Chart.yaml"
          }
          chart_version="$(read_field version)"
          app_version="$(read_field appVersion)"

          if [ -z "$chart_version" ] || [ -z "$app_version" ]; then
            echo "::error::could not read version/appVersion from $chart_dir/Chart.yaml" >&2
            exit 1
          fi

          if [ "$app_version" != "$tag_version" ]; then
            echo "::error::Chart.yaml appVersion is $app_version but the tag is $tag_version." \
                 "The image tag falls back to appVersion, so this chart would install the wrong image." >&2
            exit 1
          fi

          # ghcr.io/<ns> -> ghcr.io/<ns>/charts, so the chart lands at
          # oci://ghcr.io/<ns>/charts/shepherd and does not collide with the
          # image package of the same name.
          chart_repo="oci://${IMAGE_REGISTRY}/charts"

          echo "$REGISTRY_PASS" | helm registry login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin

          # Distinguish "absent" from "could not tell". A transient network or
          # auth failure previously looked identical to "not published", and
          # the workflow went on to push -- overwriting a released chart
          # version, the exact thing this check exists to prevent.
          probe_out="$(helm show chart "${chart_repo}/shepherd" --version "$chart_version" 2>&1)" && probe_rc=0 || probe_rc=$?
          if [ "$probe_rc" -ne 0 ] && ! grep -qiE "not found|manifest unknown|no such|does not exist" <<<"$probe_out"; then
            echo "::error::could not determine whether chart $chart_version is already published: $probe_out" >&2
            exit 1
          fi
          if [ "$probe_rc" -eq 0 ]; then
            echo "::error::chart version $chart_version is already published at $chart_repo." \
                 "Bump the chart version in $chart_dir/Chart.yaml -- republishing a version with different contents breaks every consumer pinned to it." >&2
            exit 1
          fi

      - name: Set up syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Pinned, not "latest": .goreleaser.yaml declares a `version: 2`
          # config schema that assumes a v2.x CLI, and "latest" could pick up
          # a new major (or any other behaviour change) between releases with
          # no warning.
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io/procoduck' }}
          SOURCE_URL: ${{ vars.SOURCE_URL || 'https://github.com/procoduck/shepherd' }}

      # Ties every downloaded archive to the workflow run, commit and builder
      # that produced it. checksums.txt already lists a digest per archive
      # (.goreleaser.yaml's checksum section), so one call attests all of
      # them.
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The four docker_manifests entries in .goreleaser.yaml (shepherd and
      # shepherd-simulator, each :{{ .Version }} and :latest) aren't known
      # until goreleaser has written dist/artifacts.json. Collect their
      # name+digest here and hand them to the attest-images job below as a
      # matrix -- actions/attest-build-provenance attests one subject per
      # invocation. :{{ .Version }} and :latest are the same manifest list,
      # so the list is de-duplicated by digest: the attestation subject is
      # name@digest either way, and pushing each attestation to the registry
      # twice would only add duplicate referrers.
      - name: Collect image digests
        id: images
        run: |
          set -euo pipefail
          # goreleaser's artifact "name" is the full tagged ref
          # (ghcr.io/<ns>/shepherd:X.Y.Z); actions/attest-build-provenance
          # wants subject-name as the untagged image ref, matched to the
          # pushed manifest digest by subject-digest.
          images="$(jq -c '[
            .[] | select(.type == "Docker Manifest") |
            {name: (.name | sub(":[^:/]+$"; "")), digest: .extra.Digest}
          ] | unique_by(.digest)' dist/artifacts.json)"
          echo "images=$images" >> "$GITHUB_OUTPUT"

      # The chart is published as an OCI artifact so an operator can install it
      # without cloning the repo:
      #
      #   helm install shepherd oci://ghcr.io/procoduck/charts/shepherd --version X
      #
      # It is versioned independently of the application -- Chart.yaml's
      # `version` is the chart's, `appVersion` is Shepherd's -- so it is pushed
      # under its own version rather than the git tag. Two things have to hold
      # for that to be safe, and both are checked rather than assumed:
      #
      #   1. appVersion matches the tag being released. The image tag falls
      #      back to appVersion (see _helpers.tpl), so a chart published with a
      #      stale one installs the WRONG image -- and does it silently, since
      #      the rendered manifest is perfectly valid.
      #   2. This chart version is not already published. An OCI registry will
      #      happily overwrite a tag, and a chart version whose contents change
      #      underneath it is the one failure a chart consumer cannot defend
      #      against. Bump Chart.yaml's `version` for every release that
      #      changes the chart.
      #
      # Both checks above, the strict lint, and the registry login already
      # ran in "Verify the Helm chart is unpublished and lints cleanly" —
      # before goreleaser, not after. The registry login persists on disk for
      # the rest of the job (same runner, same $HOME), so this step only
      # packages and pushes -- and records the pushed manifest digest for
      # attest-chart. `helm push` prints "Digest: sha256:..."; if that line
      # ever changes shape, `helm pull` (which prints the same line) asks the
      # registry instead, so a reworded message cannot leave the chart
      # unattested. Either way the value must be a sha256 digest before it is
      # handed on.
      - name: Publish the Helm chart to GHCR (OCI)
        id: chart
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io/procoduck' }}
        run: |
          set -euo pipefail
          chart_dir=deploy/helm/shepherd

          # awk rather than `sed | head -1`: under `set -o pipefail`, head
          # closing the pipe early can hand sed a SIGPIPE and fail the step for
          # no reason at all.
          read_field() {
            awk -v k="$1:" '$1 == k { gsub(/"/, "", $2); print $2; exit }' "$chart_dir/Chart.yaml"
          }
          chart_version="$(read_field version)"
          app_version="$(read_field appVersion)"

          # ghcr.io/<ns> -> ghcr.io/<ns>/charts, so the chart lands at
          # oci://ghcr.io/<ns>/charts/shepherd and does not collide with the
          # image package of the same name.
          chart_repo="oci://${IMAGE_REGISTRY}/charts"

          helm package "$chart_dir" --destination dist-chart
          push_out="$(helm push "dist-chart/shepherd-${chart_version}.tgz" "$chart_repo" 2>&1)" ||
            { echo "$push_out" >&2; exit 1; }
          echo "$push_out"

          parse_digest() { awk '$1 == "Digest:" { d = $2 } END { print d }'; }
          digest="$(parse_digest <<<"$push_out")"
          if [ -z "$digest" ]; then
            mkdir -p "$RUNNER_TEMP/chart-pull"
            pull_out="$(helm pull "${chart_repo}/shepherd" --version "$chart_version" \
              --destination "$RUNNER_TEMP/chart-pull" 2>&1)" || { echo "$pull_out" >&2; exit 1; }
            digest="$(parse_digest <<<"$pull_out")"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not determine the pushed chart's digest (got '$digest'); the chart is published but attest-chart cannot attest it" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version=$chart_version" >> "$GITHUB_OUTPUT"

          echo "Published ${chart_repo}/shepherd:${chart_version}@${digest} (appVersion ${app_version})"

  # actions/attest-build-provenance attests one subject per invocation, so
  # each published image digest (shepherd and shepherd-simulator; :latest
  # shares its digest with :{{ .Version }}) gets its own matrix job, built
  # from the release job's "Collect image digests" step. Skips cleanly if
  # goreleaser skipped a manifest's push (e.g. :latest on a prerelease) --
  # that manifest is simply absent from dist/artifacts.json and so from the
  # matrix.
  #
  # Each leg signs two attestations for its digest -- SLSA build provenance
  # and an SPDX-JSON SBOM -- and pushes both to the registry next to the
  # image as well as to GitHub's attestation store, so a consumer that can
  # reach the registry but not api.github.com (an air-gapped mirror, an
  # admission controller) can still verify them.
  #
  # Runs whenever the release job got as far as collecting digests, not only
  # when it succeeded: the images are public from that point on, and a later
  # failure in the release job (the chart push, say) must not also leave them
  # unattested. fail-fast is off for the same reason -- one leg failing must
  # not cancel the other image's attestations.
  attest-images:
    name: attest-images
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.images != '' && needs.release.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sigstore signing needs id-token + attestations write; push-to-registry
    # writes the attestation into the image's GHCR package (packages: write);
    # contents: read is the action's documented minimum.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.release.outputs.images) }}
    steps:
      # The image name is fully qualified (ghcr.io/<ns>/shepherd); its host
      # is what docker/login-action takes.
      - name: Resolve registry host
        id: registry
        env:
          IMAGE: ${{ matrix.image.name }}
        run: echo "host=${IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      # push-to-registry and syft's registry pull both read the Docker
      # credential store this writes.
      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Attest provenance — ${{ matrix.image.name }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image.name }}
          subject-digest: ${{ matrix.image.digest }}
          push-to-registry: true

      - name: Set up syft (SBOM generation)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Scanned from the registry by digest -- the bytes that were published,
      # not a local build. The digest names a multi-arch manifest list, so
      # syft has to pick one member: linux/amd64, pinned rather than left to
      # the runner's arch. The arm64 member is built from the same Dockerfile,
      # Go module graph and distroless base, so its package set is the same;
      # the SBOM is attested to the manifest list's digest, which is what
      # every pull by tag resolves.
      - name: Generate SBOM — ${{ matrix.image.name }}
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: ${{ matrix.image.name }}
          DIGEST: ${{ matrix.image.digest }}
        run: |
          set -euo pipefail
          "$SYFT" scan "registry:${IMAGE}@${DIGEST}" --platform linux/amd64 \
            --output "spdx-json=${RUNNER_TEMP}/sbom.spdx.json"

      # attest-sbom records the predicate type https://spdx.dev/Document/v<N>
      # from the document's own spdxVersion (syft writes SPDX-2.3), which is
      # what verify-attestations and the docs pass as --predicate-type.
      - name: Attest SBOM — ${{ matrix.image.name }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ matrix.image.name }}
          subject-digest: ${{ matrix.image.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

  # SLSA build provenance for the Helm chart, by the OCI manifest digest
  # `helm push` reported, pushed to the registry next to the chart as well as
  # to GitHub's attestation store. A job of its own rather than a step after
  # the push: a failure here then never marks the release job (and so the
  # jobs keyed on its result) failed, and the same !cancelled() reasoning as
  # attest-images applies -- once the chart is public it should be attested
  # whatever else went wrong.
  attest-chart:
    name: attest-chart
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.chart-digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io/procoduck' }}
    steps:
      - name: Resolve registry host
        id: registry
        run: echo "host=${IMAGE_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      # subject-name is the untagged chart repository; the chart version is
      # only a tag, the digest identifies what was pushed.
      - name: Attest provenance — ${{ env.IMAGE_REGISTRY }}/charts/shepherd
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/charts/shepherd
          subject-digest: ${{ needs.release.outputs.chart-digest }}
          push-to-registry: true

  # Report-only scan of the images this release actually published, so the
  # Security tab shows the shipped artifact rather than the local build the
  # verify gate scanned. Never fails the run: by now the release is public,
  # and a half-failed release is worse than a reported CVE (see the chart
  # probe's comment above for the same reasoning).
  scan-published:
    name: scan-published
    needs: [release, attest-images]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io/procoduck' }}
    strategy:
      matrix:
        image: [shepherd, shepherd-simulator]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # goreleaser tags images with the bare version ({{ .Version }} strips the
      # leading v), so the tag name itself is not an image tag. v0.6.0's scan
      # looked for ":v0.6.0" and found nothing.
      - name: Resolve the published image tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Trivy report — ${{ matrix.image }}:${{ steps.version.outputs.version }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "0"
      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-release-${{ matrix.image }}

  # Proves the release's signatures from the consumer's side, with the same
  # commands scripts/docs-content/verifying-releases.html tells an operator to
  # run: every archive in checksums.txt, each image and the chart by digest
  # and by tag, each image's SBOM, and the registry copies pushed by
  # push-to-registry. Pinned to this repository, to release.yml as the signer
  # and to this tag's ref, so an attestation from any other workflow, repo
  # or tag does not count.
  #
  # A failure turns the run red and undoes nothing: by now the release is
  # public, and deleting or re-tagging artifacts that consumers may already
  # have pulled would be worse than a reported gap (the same reasoning as
  # scan-published). A red run here means "fix the attestation and say so in
  # the release notes", not "the release is gone". It checks everything
  # before failing, so one run lists every gap.
  verify-attestations:
    name: verify-attestations
    needs: [release, attest-images, attest-chart]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: downloads the release, reads attestations from GitHub's
    # store and from the registry.
    permissions:
      contents: read
      attestations: read
      packages: read
    env:
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io/procoduck' }}
    steps:
      - name: Resolve registry host
        id: registry
        run: echo "host=${IMAGE_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      # --bundle-from-oci reads the registry with the Docker credential store.
      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Verify every published artifact's attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGES: ${{ needs.release.outputs.images }}
          CHART_DIGEST: ${{ needs.release.outputs.chart-digest }}
          CHART_VERSION: ${{ needs.release.outputs.chart-version }}
          # attest-sbom's predicate type for syft's SPDX-2.3 output (see the
          # "Attest SBOM" step). If syft moves to a new SPDX version this
          # fails loudly, and the docs page's command needs the same bump.
          SBOM_PREDICATE: https://spdx.dev/Document/v2.3
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          pin=(-R "$repo" --signer-workflow "${repo}/.github/workflows/release.yml" --source-ref "$GITHUB_REF")
          version="${GITHUB_REF_NAME#v}"
          failed=()
          check() {
            echo "::group::$*"
            if "$@"; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error::FAILED: $*"; failed+=("$*"); fi
          }

          # Release archives (and their SBOM files): checksums first, then
          # the provenance attestation of every file checksums.txt lists --
          # those are exactly the subjects the release job attested.
          dl="$RUNNER_TEMP/release"
          mkdir -p "$dl"
          if gh release download "$GITHUB_REF_NAME" -R "$repo" -D "$dl" && [ -s "$dl/checksums.txt" ]; then
            sums() { (cd "$1" && sha256sum --strict --check checksums.txt); }
            check sums "$dl"
            # fd 3, so nothing in the loop body can consume the list.
            while read -r -u 3 _ name; do
              check gh attestation verify "$dl/$name" "${pin[@]}"
            done 3< "$dl/checksums.txt"
          else
            check false "could not download the release's assets and checksums.txt"
          fi

          # Images: provenance and SBOM, from GitHub's store and from the
          # registry copy, by digest; provenance again by tag.
          if [ -z "$IMAGES" ] || [ "$IMAGES" = "[]" ]; then
            check false "release job reported no published images"
          else
            for ref in $(jq -r '.[] | "\(.name)@\(.digest)"' <<<"$IMAGES"); do
              check gh attestation verify "oci://${ref}" "${pin[@]}"
              check gh attestation verify "oci://${ref}" "${pin[@]}" --bundle-from-oci
              check gh attestation verify "oci://${ref}" "${pin[@]}" --predicate-type "$SBOM_PREDICATE"
              check gh attestation verify "oci://${ref}" "${pin[@]}" --predicate-type "$SBOM_PREDICATE" --bundle-from-oci
              check gh attestation verify "oci://${ref%@*}:${version}" "${pin[@]}"
            done
          fi

          # The chart: provenance by digest (GitHub's store and the registry
          # copy) and by its own version tag.
          if [ -z "$CHART_DIGEST" ]; then
            check false "release job reported no chart digest"
          else
            chart="${IMAGE_REGISTRY}/charts/shepherd"
            check gh attestation verify "oci://${chart}@${CHART_DIGEST}" "${pin[@]}"
            check gh attestation verify "oci://${chart}@${CHART_DIGEST}" "${pin[@]}" --bundle-from-oci
            check gh attestation verify "oci://${chart}:${CHART_VERSION}" "${pin[@]}"
          fi

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} verification(s) failed; the release stays published -- see the errors above" >&2
            exit 1
          fi
          echo "Every published artifact verified."
