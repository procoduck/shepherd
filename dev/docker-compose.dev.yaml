# DEV ONLY — Local development stack. Do not use in production.
# Ports: postgres=15432, shepherd=8080, mockmsft=9090, oidc=8090, gitea=3080(http)/2222(ssh)
# Profiles:
#   (default): postgres, shepherd-init, shepherd-seed, shepherd, mockmsft,
#              gitea, and the three Alloy agents (alloy-metrics, alloy-logs,
#              alloy-staging) — the Alloy services start by default, no
#              profile needed
#   --profile oidc: adds mock-oauth2-server (for OIDC login testing)
#   --profile sim: adds shepherd-simulator (S3 sandbox runs, VB-1 §6.4)
#
# Usage:
#   make dev                          # start full stack
#   make dev-frontend                 # start backend only, then pnpm dev
#   make dev-reset                    # wipe all data and start fresh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shepherd_dev
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: shepherd
    ports:
      - "15432:5432"
    volumes:
      - shepherd_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepherd -d shepherd_dev"]
      interval: 2s
      timeout: 5s
      retries: 20

  mockmsft:
    build:
      context: ../e2e/mockmsft
      dockerfile: Dockerfile
    image: shepherd-mockmsft:dev
    environment:
      LISTEN: ":9090"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "/mockmsft", "-health-check"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Real git server backing GitOps (F9, docs/git-provider-design.md §4) — replaces the old
  # hand-written ADO REST mock. shepherd-gitea-seed pushes .alloy fixtures to it via real git
  # and wires up a git credential + repo link so GitPage has something real to show.
  gitea:
    image: gitea/gitea:1-rootless
    environment:
      INSTALL_LOCK: "true"
      HTTP_PORT: "3000"
      # The rootless image can't bind the privileged port 22, so its built-in SSH server
      # listens on 2222 instead — set explicitly so a change to the image default doesn't
      # silently break the `ssh` auth kind.
      DISABLE_SSH: "false"
      SSH_LISTEN_PORT: "2222"
      SSH_PORT: "2222"
      # Anonymous read of public repos — Gitea's default, set explicitly.
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
    ports:
      - "3080:3000"
      - "2222:2222"
    volumes:
      - shepherd_dev_gitea:/var/lib/gitea
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot admin bootstrap, sharing gitea's data volume. Idempotent: `make dev` is re-run
  # without a reset routinely, and `gitea admin user create` fails loudly (exit != 0) once the
  # user already exists — swallow exactly that so `docker compose up --wait` doesn't fail on a
  # second run, matching shepherd-seed's own idempotency.
  gitea-init:
    image: gitea/gitea:1-rootless
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      INSTALL_LOCK: "true"
      HTTP_PORT: "3000"
      DISABLE_SSH: "false"
      SSH_LISTEN_PORT: "2222"
      SSH_PORT: "2222"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
    volumes:
      - shepherd_dev_gitea:/var/lib/gitea
    command:
      - sh
      - -c
      - >
        gitea admin user create --username shepherd-admin --password 'Sh3pherd-Admin-Pass-1'
        --email admin@shepherd.test --admin --must-change-password=false
        || echo 'gitea admin user already exists, skipping'
    restart: "no"

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.1
    profiles: ["oidc"]
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": []
        }
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/.well-known/openid-configuration || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20

  shepherd-init:
    image: shepherd:local-init
    depends_on:
      postgres:
        condition: service_healthy
    env_file: shepherd.dev.env
    environment:
      SHEPHERD_DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd_dev?sslmode=disable
    command:
      - migrate
      - up
    restart: "no"

  shepherd-seed:
    image: shepherd:local-init
    depends_on:
      shepherd-init:
        condition: service_completed_successfully
      gitea-init:
        condition: service_completed_successfully
    env_file: shepherd.dev.env
    environment:
      SHEPHERD_DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd_dev?sslmode=disable
      SHEPHERD_DEV_ALLOW_STATIC_TOKEN: "true"
    command:
      - dev
      - seed
    restart: "no"

  shepherd:
    image: shepherd:local
    depends_on:
      shepherd-seed:
        condition: service_completed_successfully
      mockmsft:
        condition: service_healthy
    env_file: shepherd.dev.env
    environment:
      SHEPHERD_DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd_dev?sslmode=disable
      # B-CONTAIN-1: bind to the default-network address only. sim-internal
      # is internal:true (no gateway) so this address is unroutable from
      # there regardless, but binding explicitly closes it even if a future
      # engine's internal:true implementation is looser than Docker's own
      # (see B-CONTAIN-2 — the OrbStack gateway-reachability gap this repo
      # already hit once). Must equal networks.default.ipv4_address below.
      SHEPHERD_SERVER_LISTEN: "172.29.0.10:8080"
      SHEPHERD_SERVER_METRICS_LISTEN: "172.29.0.10:9090"
      SHEPHERD_GRAPH_BASE_URL: http://mockmsft:9090
      SHEPHERD_ADO_BASE_URL: http://mockmsft:9090
      # Empty by default so the default stack exercises the "simulator not
      # configured" path; `make dev-sim` / `make e2e-sim` set it to true.
      SHEPHERD_SIMULATOR_ENABLED: ${SHEPHERD_SIM_ENABLED:-false}
      # config.go's SimulatorConfig defaults all assume a compose service
      # named "shepherd-simulator"; internal/simsvc's compose containment
      # spec (internal/simsvc/compose_containment_test.go) pins this
      # service's key to "simulator" instead, so every one of those defaults
      # is overridden here to the real DNS name. Harmless when the `sim`
      # profile is not up: these only matter once Simulator.Enabled is true.
      SHEPHERD_SIMULATOR_CONTROL_URL: http://simulator:8099
      SHEPHERD_SIMULATOR_CAPTURE_BASE_URL: http://simulator:9110
      SHEPHERD_SIMULATOR_OTLP_GRPC_ADDRESS: simulator:4317
      SHEPHERD_SIMULATOR_SYSLOG_HOST: simulator
      SHEPHERD_SIMULATOR_TARGET_ADDRESS: simulator:9111
    command: ["serve"]
    networks:
      default:
        ipv4_address: 172.29.0.10
      sim-internal:
        ipv4_address: 172.29.1.10
    ports:
      # Bound to 127.0.0.1 only, not the default 0.0.0.0 — see
      # e2e/docker-compose.e2e.yaml's shepherd `ports:` comment: shepherd's
      # container-side listener is now a pinned IPv4 literal (B-CONTAIN-1),
      # so Docker's automatic dual-stack publish would otherwise leave an
      # IPv6-published half connecting to nothing, and `curl localhost:8080`
      # on a dual-stack host would resolve ::1 first and get a post-connect
      # RST instead of falling back to IPv4.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/shepherd", "healthcheck", "--addr", "172.29.0.10:8080"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Three Alloy instances — metrics + logs on prod-eu-1, metrics on staging-eu-1.
  # Started by default (no profile gate).

  # cluster=prod-eu-1 / role=metrics
  alloy-metrics:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.1}
    depends_on:
      shepherd:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy-metrics
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ../dev/alloy-metrics.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "12345:12345"

  # cluster=prod-eu-1 / role=logs
  alloy-logs:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.1}
    depends_on:
      shepherd:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy-logs
      - --server.http.listen-addr=0.0.0.0:12346
      - --disable-reporting
    volumes:
      - ../dev/alloy-logs.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "12346:12346"

  # cluster=staging-eu-1 / role=metrics
  alloy-staging:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.1}
    depends_on:
      shepherd:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy-staging
      - --server.http.listen-addr=0.0.0.0:12347
      - --disable-reporting
    volumes:
      - ../dev/alloy-staging.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "12347:12347"

  # S3 sandbox simulator (VB-1 §6.4). Gated behind the `sim` profile: it runs
  # user-authored Alloy configuration, so it is opt-in even in dev.
  #
  # CONTAINMENT — every key below is load-bearing and asserted by
  # TestSimsvc's compose containment spec in internal/simsvc:
  #   sim-internal has `internal: true`, so this container has NO route off it
  #     and no DNS to the outside world. That is the primary control; the
  #     simulator's own endpoint allowlist is only a second gate.
  #   no `ports:` — nothing is published to the host.
  #   read_only + tmpfs /tmp — the only writable path is the run scratch space,
  #     mounted noexec/nosuid/nodev and size-capped.
  #   user/cap_drop/no-new-privileges — non-root with no capabilities and no
  #     way to acquire any.
  #   mem_limit + memswap_limit — the pair matters: mem_limit alone lets a run
  #     swap past its cap.
  #
  # RESIDUAL RISK, stated plainly: compose cannot express one-way egress —
  # shepherd is still a sim-internal MEMBER (needed for DNS/routing to reach
  # simulator). B-CONTAIN-1 closed that surface anyway: shepherd's Listen and
  # MetricsListen are now bound to its default-network address only (see the
  # shepherd service above), so nothing shepherd-side actually LISTENS on
  # sim-internal — a SYN arriving there gets a kernel RST, independent of
  # sim-internal's own routing. What's left is B-CONTAIN-2 (local dev only):
  # the OrbStack host-gateway path runs through the host's NAT/docker-proxy
  # layer, entirely orthogonal to which interface shepherd's own process
  # binds, so this change does not and cannot touch it. The Kubernetes
  # posture (deploy/helm, NetworkPolicy egress: []) remains strictly
  # stricter than either.
  simulator:
    profiles: ["sim"]
    image: shepherd-simulator:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.simulator
    environment:
      SIM_LISTEN: ":8099"
      SIM_LOG_LEVEL: info
      # allowedHosts (internal/simsvc/config.go) defaults to the literal
      # "shepherd-simulator" plus os.Hostname() — which inside a container is
      # the container ID, not the compose service name, so neither half of
      # that default matches this service's real DNS name. Set explicitly to
      # what the transform actually renders (see the SHEPHERD_SIMULATOR_*
      # overrides on the shepherd service, same file) so CheckEndpoints'
      # allowlist (VB-1 §6.4 defense in depth) agrees with the harness
      # addresses Shepherd hands the transform, instead of rejecting every
      # run with endpoint_not_allowed.
      SIM_ALLOWED_HOSTS: "simulator,localhost,127.0.0.1,::1"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    tmpfs:
      # /tmp/shepherd-sim/{storage,run,capture,logs} are the simulator's
      # defaults; Alloy's WAL lives under the same tmpfs.
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    networks:
      - sim-internal
    healthcheck:
      test: ["CMD", "/usr/local/bin/shepherd-simulator", "healthcheck", "--addr", "127.0.0.1:8099"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  shepherd_dev_postgres:
    name: shepherd_dev_postgres
  shepherd_dev_gitea:
    name: shepherd_dev_gitea

networks:
  default:
    name: shepherd-dev
    ipam:
      config:
        - subnet: 172.29.0.0/24
          # Same rationale as the e2e file: dynamic allocs in .128+, pins below.
          ip_range: 172.29.0.128/25
  # internal: true is what denies the sandbox egress — no gateway, no DNS to
  # anything outside this network. Removing it silently restores full outbound
  # access for every config a user runs.
  sim-internal:
    name: shepherd-dev-sim
    internal: true
    ipam:
      config:
        - subnet: 172.29.1.0/24
          ip_range: 172.29.1.128/25
