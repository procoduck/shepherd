# DEV ONLY — Local development stack. Do not use in production.
# Ports: postgres=15432, shepherd=8080, mockmsft=9090, oidc=8090
# Profiles:
#   (default): postgres, shepherd-init, shepherd, mockmsft
#   --profile oidc: adds mock-oauth2-server (for OIDC login testing)
#   --profile alloy: adds Alloy agent (for collector screen demo)
#
# Usage:
#   make dev                          # start full stack
#   make dev-frontend                 # start backend only, then pnpm dev
#   make dev E2E_KEEP=1               # keep stack after tests
#   make dev-reset                    # wipe all data and start fresh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shepherd_dev
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: shepherd
    ports:
      - "15432:5432"
    volumes:
      - shepherd_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepherd -d shepherd_dev"]
      interval: 2s
      timeout: 5s
      retries: 20

  mockmsft:
    build:
      context: ../e2e/mockmsft
      dockerfile: Dockerfile
    image: shepherd-mockmsft:dev
    environment:
      LISTEN: ":9090"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "/mockmsft", "-health-check"]
      interval: 2s
      timeout: 5s
      retries: 10

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.1
    profiles: ["oidc"]
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": []
        }
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/.well-known/openid-configuration || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20

  shepherd-init:
    image: shepherd:local-init
    depends_on:
      postgres:
        condition: service_healthy
    env_file: shepherd.dev.env
    environment:
      SHEPHERD_DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd_dev?sslmode=disable
    command:
      - migrate
      - up
    restart: "no"

  shepherd-seed:
    image: shepherd:local-init
    depends_on:
      shepherd-init:
        condition: service_completed_successfully
    env_file: shepherd.dev.env
    environment:
      SHEPHERD_DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd_dev?sslmode=disable
      SHEPHERD_DEV_ALLOW_STATIC_TOKEN: "true"
    command:
      - dev
      - seed
    restart: "no"

  shepherd:
    image: shepherd:local
    depends_on:
      shepherd-seed:
        condition: service_completed_successfully
      mockmsft:
        condition: service_healthy
    env_file: shepherd.dev.env
    environment:
      SHEPHERD_DATABASE_URL: postgres://shepherd:shepherd@postgres:5432/shepherd_dev?sslmode=disable
      SHEPHERD_GRAPH_BASE_URL: http://mockmsft:9090
      SHEPHERD_ADO_BASE_URL: http://mockmsft:9090
    command: ["serve"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/shepherd", "healthcheck", "--addr", "localhost:8080"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Three Alloy instances — metrics + logs on prod-eu-1, metrics on staging-eu-1.
  # Started by default (no profile gate).

  # cluster=prod-eu-1 / role=metrics
  alloy-metrics:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.1}
    depends_on:
      shepherd:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy-metrics
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ../dev/alloy-metrics.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "12345:12345"

  # cluster=prod-eu-1 / role=logs
  alloy-logs:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.1}
    depends_on:
      shepherd:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy-logs
      - --server.http.listen-addr=0.0.0.0:12346
      - --disable-reporting
    volumes:
      - ../dev/alloy-logs.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "12346:12346"

  # cluster=staging-eu-1 / role=metrics
  alloy-staging:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.1}
    depends_on:
      shepherd:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy-staging
      - --server.http.listen-addr=0.0.0.0:12347
      - --disable-reporting
    volumes:
      - ../dev/alloy-staging.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "12347:12347"

volumes:
  shepherd_dev_postgres:
    name: shepherd_dev_postgres

networks:
  default:
    name: shepherd-dev
