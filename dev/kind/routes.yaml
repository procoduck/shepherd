# The two hand-written HTTPRoutes (docs/plans/2026-09-14-kind-dev-stack.md §1, K5). The
# shepherd app's own HTTPRoute is deliberately NOT in this file: it is rendered by the chart
# itself from dev/kind/values.yaml's `route.*` (K3), so shepherd stays entirely chart-managed.
# Both routes below attach to the shared Gateway `dev` (gateway.yaml) and match every path, the
# same PathPrefix "/" shape the chart's own httproute.yaml template uses.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oidc
  namespace: shepherd-dev
spec:
  parentRefs:
    - name: dev
  hostnames:
    - oidc.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oidc
          port: 8090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: shepherd-dev
spec:
  parentRefs:
    - name: dev
  hostnames:
    - gitea.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitea
          port: 3000
