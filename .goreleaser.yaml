version: 2

project_name: shepherd

before:
  hooks:
    # Generated code (gen/, sqlc, alloy_gen.go) is committed and CI's
    # generated-drift job fails any PR where it no longer matches its sources,
    # so regenerating here would only add failure modes (plugin versions,
    # node_modules) to the release path. The SPA is the one build-time input:
    # go:embed needs internal/spa/dist populated before go build.
    - ./scripts/build-web.sh   # canonical build script per check-build-script guard

builds:
  - id: shepherd
    main: ./cmd/shepherd
    env: [CGO_ENABLED=0]
    goos: [linux]              # release targets are linux amd64/arm64 only
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X shepherd/internal/version.Version={{ .Version }}
      - -X shepherd/internal/version.Commit={{ .ShortCommit }}
      - -X shepherd/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"        # reproducible builds
  - id: shepherd-simulator
    main: ./cmd/shepherd-simulator
    binary: shepherd-simulator
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X shepherd/internal/version.Version={{ .Version }}
      - -X shepherd/internal/version.Commit={{ .ShortCommit }}
      - -X shepherd/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive        # syft-generated SBOM per archive

dockers:
  - id: amd64
    use: buildx
    goarch: amd64
    ids: [shepherd]
    dockerfile: deploy/Dockerfile.goreleaser
    image_templates:
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd:{{ .Version }}-amd64"
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.source={{ .Env.SOURCE_URL }}
  - id: arm64
    use: buildx
    goarch: arm64
    ids: [shepherd]
    dockerfile: deploy/Dockerfile.goreleaser
    image_templates:
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd:{{ .Version }}-arm64"
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.source={{ .Env.SOURCE_URL }}
  # The chart deploys the simulator by default since v0.0.1, so its image is a
  # first-class release artifact — a chart whose default install names an image
  # nothing publishes would fail to pull on every fresh cluster.
  - id: simulator-amd64
    use: buildx
    goarch: amd64
    ids: [shepherd-simulator]
    dockerfile: deploy/Dockerfile.goreleaser-simulator
    image_templates:
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd-simulator:{{ .Version }}-amd64"
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.source={{ .Env.SOURCE_URL }}
  - id: simulator-arm64
    use: buildx
    goarch: arm64
    ids: [shepherd-simulator]
    dockerfile: deploy/Dockerfile.goreleaser-simulator
    image_templates:
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd-simulator:{{ .Version }}-arm64"
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.source={{ .Env.SOURCE_URL }}

docker_manifests:
  - name_template: "{{ .Env.IMAGE_REGISTRY }}/shepherd:{{ .Version }}"
    image_templates:
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd:{{ .Version }}-amd64"
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd:{{ .Version }}-arm64"
  - name_template: "{{ .Env.IMAGE_REGISTRY }}/shepherd:latest"
    image_templates:
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd:{{ .Version }}-amd64"
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd:{{ .Version }}-arm64"
    skip_push: "{{ if .Prerelease }}true{{ end }}"
  - name_template: "{{ .Env.IMAGE_REGISTRY }}/shepherd-simulator:{{ .Version }}"
    image_templates:
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd-simulator:{{ .Version }}-amd64"
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd-simulator:{{ .Version }}-arm64"
  - name_template: "{{ .Env.IMAGE_REGISTRY }}/shepherd-simulator:latest"
    image_templates:
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd-simulator:{{ .Version }}-amd64"
      - "{{ .Env.IMAGE_REGISTRY }}/shepherd-simulator:{{ .Version }}-arm64"
    skip_push: "{{ if .Prerelease }}true{{ end }}"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude: ['^docs:', '^chore:', '^test:', '^ci:']

release:
  disable: "{{ if index .Env \"SKIP_SCM_RELEASE\" }}true{{ end }}"
  # GitHub releases when the mirror is GitHub; on Azure DevOps set SKIP_SCM_RELEASE=1 —
  # the images + manifests are the release artifacts there.

snapshot:
  # DECISION: spec section 21 uses -dev+ShortCommit (semver build metadata), but "+" is
  # invalid in a Docker tag and breaks the snapshot docker builds; "-" keeps the intent.
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"
