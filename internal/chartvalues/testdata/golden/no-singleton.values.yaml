# Generated by Shepherd (Collectors → Connect a cluster) for Grafana's
# k8s-monitoring chart, version 4.4.0.
#
# This is not a complete values.yaml: it only points the collectors below at
# Shepherd. Apply it with your own values file and shepherd-credentials.yaml,
# which loads each collector's agent token from a Kubernetes Secret:
#   helm upgrade ... -f your-values.yaml -f shepherd-layer.yaml -f shepherd-credentials.yaml
# No secret is ever in either file.

cluster:
  name: "prod-us-2"

collectors:
  alloy-logs:
    remoteConfig:
      enabled: true
      url: "https://shepherd.example.com"
      pollFrequency: "60s"
      auth:
        type: basic
        usernameFrom: 'sys.env("SHEPHERD_AGENT_TOKEN_ID")'
        passwordFrom: 'sys.env("SHEPHERD_AGENT_TOKEN_SECRET")'
      extraAttributes:
        role: "logs"
        tenant: "globex"
  alloy-metrics:
    remoteConfig:
      enabled: true
      url: "https://shepherd.example.com"
      pollFrequency: "60s"
      auth:
        type: basic
        usernameFrom: 'sys.env("SHEPHERD_AGENT_TOKEN_ID")'
        passwordFrom: 'sys.env("SHEPHERD_AGENT_TOKEN_SECRET")'
      extraAttributes:
        role: "metrics"
        tenant: "globex"
  alloy-receiver:
    remoteConfig:
      enabled: true
      url: "https://shepherd.example.com"
      pollFrequency: "60s"
      auth:
        type: basic
        usernameFrom: 'sys.env("SHEPHERD_AGENT_TOKEN_ID")'
        passwordFrom: 'sys.env("SHEPHERD_AGENT_TOKEN_SECRET")'
      extraAttributes:
        role: "receiver"
        tenant: "globex"
