# Cluster-observability layer generated by Shepherd's k8s-monitoring chart
# values generator (docs/gateway-tier-plan.md W9).
#
# This file is NOT a complete values.yaml. It wires the selected collectors'
# remoteConfig to this Shepherd instance and sets nothing else — no sizing,
# no presets, no other feature. Apply it alongside your own values file:
#   helm upgrade ... -f your-values.yaml -f this-file.yaml
#
# Pinned chart version: 4.4.0 (internal/chartvalues.PinnedChartVersion).
#
# auth.usernameFrom/passwordFrom read this cluster's Shepherd agent-token
# credentials from the environment at SHEPHERD_AGENT_TOKEN_ID/SHEPHERD_AGENT_TOKEN_SECRET — the
# same pair, and the same convention, the beacon baseline pipeline reads
# (internal/beacon.DefaultTokenIDEnv/DefaultTokenSecretEnv): set them via your
# own values' alloy.extraEnv (Kubernetes Secret + secretKeyRef, not a literal
# value) on each collector this file lists. No secret is ever in this file.
#
# One more addition your OWN values file must make: the chart's own
# validation requires an alloy.extraEnv entry named GCLOUD_RW_API_KEY to
# exist on every collector below, regardless of auth mechanism — a leftover
# from the chart's Grafana-Cloud-specific origin (see render.go's
# RequiredOperatorExtraEnvVar doc comment). Its value is never read by
# anything this file wires; any valueFrom/value satisfies the check, e.g.:
#   alloy-singleton:
#     alloy:
#       extraEnv:
#         - name: GCLOUD_RW_API_KEY
#           value: "unused"

cluster:
  name: "prod-eu-1"

collectors:
  alloy-singleton:
    remoteConfig:
      enabled: true
      url: "https://shepherd.example.com"
      pollFrequency: "60s"
      auth:
        type: basic
        usernameFrom: 'sys.env("SHEPHERD_AGENT_TOKEN_ID")'
        passwordFrom: 'sys.env("SHEPHERD_AGENT_TOKEN_SECRET")'
      extraAttributes:
        role: "singleton"
        tenant: "acme"
