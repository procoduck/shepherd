version: v2
inputs:
  - directory: proto
plugins:
  - protoc_builtin: go
    out: gen
    opt:
      - paths=source_relative
  - protoc_builtin: connect-go
    out: gen
    opt:
      - paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt:
      - target=ts
